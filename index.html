<style>
:root{
  --bg:#071010; --bg-card:#0A0A0A; --bg-sunken:#050808;
  --ink:#F5F5F5; --ink-soft:#7A9BAA; --ink-faint:#C8DCE2;
  --line:#0F2E2E; --line-strong:#1A4040;
  --accent:#00D4CC; --accent-dark:#22E8E0; --accent-soft:rgba(0,212,204,0.12);
  --good:#00E676; --good-soft:rgba(0,230,118,0.12);
  --warn:#FFB300; --warn-soft:rgba(255,179,0,0.12);
  --bad:#FF5252; --bad-soft:rgba(255,82,82,0.12);
  --chart-1:var(--accent); --chart-2:var(--good); --chart-3:var(--bad);
  --graphite:#2C2723; --graphite-2:#3A342F;
  --font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  --size-destaque:17px;
  --size-texto:13px;
  --radius:10px;
  --shadow:0 2px 8px rgba(0,0,0,.04);
}

/* Regra absoluta: 1 única fonte, zero negrito e exatamente 2 tamanhos em todo o app */
*{
  box-sizing:border-box;
  font-family:var(--font-family) !important;
  font-weight:400 !important;
  font-size:var(--size-texto);
}

html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-size:var(--size-texto);}
#root{min-height:100vh;}
button,input,select,textarea{font-family:inherit;cursor:pointer;font-size:var(--size-texto);color:var(--ink);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px;}

/* REGRA DE ELIMINAÇÃO ABSOLUTA DO BRANCO STARK EM INPUTS, SELECTS E TEXTAREAS */
input, select, textarea {
  background-color: var(--bg-sunken) !important;
  color: var(--ink) !important;
  border: 1px solid var(--line-strong) !important;
  border-radius: 8px;
}
input:focus, select:focus, textarea:focus {
  outline: 2px solid var(--accent-soft);
  border-color: var(--accent) !important;
}
input[type="checkbox"], input[type="radio"] {
  accent-color: var(--accent);
  cursor: pointer;
}

/* ---------- Elementos com Tamanho 1 (Destaques / Títulos: 17px) ---------- */
h1, h2, h3, h2.section-title, .logo, .hero-banner h2, .welcome-empty h3,
.obra-nome, .kpi .val, .modal h3, .topbar h1, .doctitle h1, .val-destaque, .destaque-grande, .chart-title {
  font-size:var(--size-destaque) !important;
  color:var(--ink) !important;
  letter-spacing:-.015em;
}

/* ---------- Elementos com Tamanho 2 (Texto Padrão / Dados / Tabelas: 13px) ---------- */
body, p, span, div, td, th, label, input, select, textarea, button, a,
.side-item, .side-section-label, .side-foot, .tag, .sub, .badge, .lbl, .hint, .contrato, table.tbl td, table.tbl th {
  font-size:var(--size-texto);
}

/* ---------- layout shell ---------- */
.shell{display:flex;min-height:100vh;}
.side{width:240px;flex:none;background:var(--sidebar, var(--graphite));color:var(--ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:transform .22s ease;z-index:50;}
.side-backdrop{display:none;}
.hamb{display:none;background:none;border:none;color:var(--ink);padding:6px;margin-right:10px;flex:none;}
@media (max-width:860px){
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .side{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);box-shadow:0 0 30px rgba(0,0,0,.3);}
  .side.open{transform:translateX(0);}
  .side-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;}
  .side-backdrop.open{display:block;}
  .hamb{display:inline-flex;align-items:center;}
  .hide-mobile{display:none;}
  .content{padding:12px !important;padding-bottom:120px !important;}
  .topbar{padding:0 12px !important;}
  .tbl-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;}
  table.tbl{min-width:540px;}
  .modal-bg{padding:10px;}
  .modal{padding:16px;max-height:92vh;border-radius:12px;}
  .bottom-nav{left:0;padding-bottom:calc(10px + env(safe-area-inset-bottom));}
  .filter-tabs{flex-wrap:wrap;width:100%;}
  .filter-btn{flex:1;text-align:center;}
  input, select, textarea{font-size:16px !important;}
}
.side-brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
.side-brand .logo{color:#FFFFFF;letter-spacing:-.02em;}
.side-brand .logo em{color:var(--accent);font-style:normal;}
.side-brand .tag{color:#9BA3AC;margin-top:2px;letter-spacing:.04em;text-transform:uppercase;}
.side-nav{flex:1;overflow-y:auto;padding:14px 10px;}
.side-section-label{letter-spacing:.08em;text-transform:uppercase;color:#7C848D;margin:16px 10px 6px;}
.side-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#C9CDD2;cursor:pointer;margin-bottom:2px;transition:background .12s;}
.side-item:hover{background:rgba(255,255,255,.08);color:#FFFFFF;}
.side-item.active{background:var(--accent);color:#FFFFFF;}
.side-item svg{flex:none;opacity:.9;}
.side-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);color:#7C848D;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:60px;flex:none;background:var(--bg-card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:10;}
.topbar h1{margin:0;letter-spacing:-.01em;color:var(--ink);}
.topbar .sub{color:var(--ink-soft);margin-top:1px;}
.content{flex:1;padding:22px;padding-bottom:110px;max-width:1200px;width:100%;margin:0 auto;}
.bottom-nav{position:fixed;bottom:0;left:240px;right:0;background:var(--bg-card);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 18px;z-index:20;box-shadow:0 -2px 10px rgba(0,0,0,.05);}
.bottom-nav .lbl{color:var(--ink);text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px;}
.bottom-nav button{flex:none;}
.bottom-nav button:disabled{opacity:.35;cursor:default;}
@media (max-width:860px){ .bottom-nav{left:0;} }

/* ---------- primitives ---------- */
.card{background:var(--bg-card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;word-break:break-word;overflow-wrap:anywhere;}
.content > .card + .card{margin-top:14px;}

.grid{display:grid;gap:14px;align-items:stretch;}
.grid > *{margin-top:0 !important;height:100%;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media (max-width:1024px){.grid-5,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media (max-width:860px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}}

h2.section-title{margin:0 0 12px;display:flex;align-items:center;gap:8px;color:var(--ink);}
h2.section-title .bar{width:4px;height:16px;background:var(--accent);border-radius:2px;display:inline-block;}

.help-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--bg-sunken);color:var(--ink-faint);border:1px solid var(--line-strong);font-size:11px;cursor:pointer;transition:all .15s ease;margin-left:4px;vertical-align:middle;}
.help-btn:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;padding:9px 15px;border:1px solid transparent;white-space:nowrap;transition:all .15s ease;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{background:var(--accent-dark);}
.btn-ghost{background:var(--bg-card);color:var(--ink);border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--bg-sunken);}
.btn-sm{padding:6px 11px;}
.btn-danger{background:var(--bad-soft);color:var(--bad);}
.btn-wsp{background:#25D366;color:#fff;}
.btn-wsp:hover{background:#1EBE5D;}

.field{display:flex;flex-direction:column;gap:5px;}
.field label{color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;color:var(--ink) !important;background:var(--bg-sunken) !important;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent) !important;}
.field .hint{color:var(--ink-faint);}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-bad{background:var(--bad-soft);color:var(--bad);}
.badge-neutral{background:var(--bg-sunken);color:var(--ink-soft);}

.kpi{background:var(--bg-card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);color:var(--ink);position:relative;display:flex;flex-direction:column;justify-content:space-between;height:100%;margin-top:0 !important;}
.kpi .lbl{text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);padding-right:60px;}
.kpi .val{margin-top:8px;letter-spacing:-.01em;color:var(--ink);}
.kpi .sub-text{color:var(--ink-faint);margin-top:4px;}
.kpi .tag-top{position:absolute;top:14px;right:14px;background:var(--bg-sunken);color:var(--ink-soft);padding:3px 8px;border-radius:6px;}

/* ---------- ESTILOS DE CARDS DAS OBRAS ---------- */
.card-obra{transition:transform .15s,box-shadow .15s;cursor:pointer;background:var(--bg-card);border:1px solid var(--line-strong);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;height:100%;margin-top:0 !important;}
.card-obra:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.2);}
.card-obra .obra-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;}
.card-obra .obra-cliente{color:var(--ink-soft);}
.card-obra .obra-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);}
.card-obra .obra-footer .contrato{color:var(--ink-faint);}
.card-obra .obra-footer .contrato span{color:var(--ink);}
.card-obra .progress-container{position:relative;margin-top:10px;}
.card-obra .progress-container .progress-track{height:12px;border-radius:6px;background:var(--bg-sunken);}
.card-obra .progress-container .progress-track .progress-fill{transition:width .4s ease;height:100%;border-radius:6px;}
.card-obra .progress-container .progress-labels{display:flex;justify-content:space-between;color:var(--ink-faint);margin-top:5px;}
.card-obra .status-badge{flex:none;}

/* ---------- ESTILOS DE TABELA E ALINHAMENTO PERFEITO ---------- */
.tbl-responsive{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;}
table.tbl{width:100%;border-collapse:collapse;margin-top:4px;}
table.tbl th{padding:10px 12px;border-bottom:2px solid var(--line-strong);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-size:13px;vertical-align:middle;white-space:nowrap;}
table.tbl td{padding:12px 12px;border-bottom:1px solid var(--line);color:var(--ink);font-size:13px;vertical-align:middle;}
table.tbl tr:hover td{background:var(--bg-sunken);}

/* Classes de Alinhamento e Largura para Respiro de Texto */
table.tbl th.col-desc, table.tbl td.col-desc{text-align:left;vertical-align:middle;min-width:220px;width:35%;word-break:break-word;}
table.tbl th.col-num, table.tbl td.col-num{text-align:right;vertical-align:middle;white-space:nowrap;min-width:110px;}
table.tbl th.col-center, table.tbl td.col-center{text-align:center;vertical-align:middle;white-space:nowrap;}

.empty{text-align:center;padding:40px 20px;color:var(--ink-faint);}
.empty svg{opacity:.4;margin-bottom:10px;}

.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--bg-card);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:22px;color:var(--ink);border:1px solid var(--line);}
.modal h3{margin:0 0 16px;color:var(--ink);}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--graphite);color:#fff;padding:11px 20px;border-radius:9px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);}

.hero-banner{background:linear-gradient(135deg,var(--graphite) 0%,var(--graphite-2) 100%);border-radius:var(--radius);padding:24px 28px;color:#fff;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.hero-banner h2{margin:0 0 4px;letter-spacing:-.02em;color:#fff !important;}
.hero-banner p{color:#B0B8C2;margin:0;}
.hero-banner .hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.hero-banner .btn-hero{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:10px 18px;transition:all .15s;}
.hero-banner .btn-hero:hover{background:var(--accent);border-color:var(--accent);}
.hero-banner .btn-hero-primary{background:var(--accent);border-color:var(--accent);}
.hero-banner .btn-hero-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}

.welcome-empty{text-align:center;padding:50px 20px;}
.welcome-empty .icon-big{opacity:.3;margin-bottom:16px;}
.welcome-empty p{color:var(--ink-soft);max-width:420px;margin:0 auto 20px;}

.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.search-input{flex:1;min-width:200px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 12px;background:var(--bg-sunken) !important;color:var(--ink) !important;}
.filter-tabs{display:flex;gap:4px;background:var(--bg-sunken);padding:4px;border-radius:8px;}
.filter-btn{border:none;background:transparent;padding:6px 12px;border-radius:6px;color:var(--ink-soft);cursor:pointer;}
.filter-btn.active{background:var(--bg-card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

.foto-lightbox{position:fixed;inset:0;background:rgba(10,10,10,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;}

/* Verde Obra theme card enhancement */
.card {
  border: 1px solid var(--line);
  border-radius: 12px;
  transition: border-color 0.2s;
}
.btn-primary {
  letter-spacing: 0.03em;
  border-radius: 10px;
}
.btn-ghost {
  border-radius: 10px;
}
.section-title {
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 11px;
}
input, select, textarea {
  border-radius: 10px !important;
}

  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
  .modal{padding:12px;border-radius:10px;}
  table.tbl{min-width:400px;}
}</style>

function uid() { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function todayISO() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function dayNum(iso) {
  if (!iso) return 0;
  const parts = String(iso).split('T')[0].split('-');
  if (parts.length !== 3) return 0;
  const [y, m, d] = parts.map(Number);
  return Math.floor(Date.UTC(y, m - 1, d) / 86400000);
}
function isoFromDayNum(days) {
  const date = new Date(days * 86400000);
  const y = date.getUTCFullYear();
  const m = String(date.getUTCMonth() + 1).padStart(2, '0');
  const d = String(date.getUTCDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

function fmtData(iso) {
  if (!iso) return '—';
  const str = String(iso).split('T')[0];
  const parts = str.split('-');
  if (parts.length !== 3) return iso;
  return parts[2] + '/' + parts[1] + '/' + parts[0];
}
function fmtDataCurta(iso) {
  if (!iso) return '—';
  const str = String(iso).split('T')[0];
  const parts = str.split('-');
  if (parts.length !== 3) return iso;
  const meses = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  return parts[2] + ' ' + meses[Number(parts[1]) - 1];
}
function brl(v) {
  v = Number(v) || 0;
  return v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function esc(t) { const d = document.createElement('div'); d.textContent = (t == null ? '' : String(t)); return d.innerHTML; }
function toggleDica(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const oculto = (el.style.display === 'none' || !el.style.display);
  el.style.display = oculto ? 'block' : 'none';
}

function parseMoeda(str) {
  if (str == null || str === '') return 0;
  if (typeof str === 'number') return isNaN(str) ? 0 : str;
  let s = String(str).trim().replace(/[^\d,.-]/g, '');
  if (!s) return 0;
  
  const hasComma = s.includes(',');
  const hasDot = s.includes('.');
  
  if (hasComma && hasDot) {
    const lastComma = s.lastIndexOf(',');
    const lastDot = s.lastIndexOf('.');
    if (lastComma > lastDot) {
      s = s.replace(/\./g, '').replace(',', '.');
    } else {
      s = s.replace(/,/g, '');
    }
  } else if (hasComma) {
    s = s.replace(',', '.');
  } else if (hasDot) {
    const partes = s.split('.');
    if (partes.length > 2 || (partes.length === 2 && partes[1].length === 3)) {
      s = s.replace(/\./g, '');
    }
  }
  
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}

function proximoNumero(obra, tipo) {
  if (!obra.contadores) obra.contadores = { rdo: 0, financeiro: 0, medicao: 0, recebimento: 0, aditivo: 0, gasto: 0 };
  if (obra.contadores[tipo] == null) obra.contadores[tipo] = 0;
  obra.contadores[tipo]++;
  salvar();
  return String(obra.contadores[tipo]).padStart(4, '0');
}

const DB_NAME = 'ObraFlowDB';
const DB_VERSION = 1;
const STORE_NAME = 'obraflow_store';

function openObraFlowDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject('IndexedDB não suportado'); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbSalvar(key, data) {
  try {
    const db = await openObraFlowDB();
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(data, key);
    return new Promise((resolve) => {
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) {
    console.warn('Erro ao salvar no IndexedDB:', e);
    return false;
  }
}

async function dbCarregar(key) {
  try {
    const db = await openObraFlowDB();
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    return new Promise((resolve) => {
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    console.warn('Erro ao carregar do IndexedDB:', e);
    return null;
  }
}

function salvar() {
  const payload = { obras: state.obras, empresa: state.empresa, tema: state.tema, modeloRelatorio: state.modeloRelatorio };
  try { const j=JSON.stringify(payload); if(j.length<3500000) localStorage.setItem(STORAGE_KEY,j); } catch(e) { console.warn('localStorage cheio'); }
  dbSalvar(STORAGE_KEY, payload);
}

function carregar() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      aplicarEstadoSalvo(data);
    }
  } catch (e) { console.error(e); }
  
  dbCarregar(STORAGE_KEY).then((dataDb) => {
    if (dataDb && dataDb.obras) {
      aplicarEstadoSalvo(dataDb);
    }
  }).catch(()=>{});
}

function aplicarEstadoSalvo(data) {
  if (!data) return;
  state.obras = (data.obras || []).map(o => {
    o.gastos = o.gastos || [];
    o.trabalhadores = o.trabalhadores || [];
    o.recebimentos = o.recebimentos || [];
    o.contadores = o.contadores || { rdo: 0, financeiro: 0, medicao: 0, recebimento: 0, aditivo: 0, gasto: 0 };
    return o;
  });
  state.empresa = Object.assign({ razao: '', contato: '', responsavel: '', logo: '' }, data.empresa || {});
  state.tema = data.tema || 'dark_grafite';
  state.modeloRelatorio = data.modeloRelatorio || 'executivo_minimalista';
}

  try { localStorage.removeItem(SESSION_KEY); } catch(e) {}

function salvarSessao() {
  try {
    if (state.apontamentoDraft) {
      syncDraftFromDOM();
    }
    const sessao = {
      screen: state.screen,
      obraAtualId: state.obraAtualId,
      obraTab: state.obraTab,
      apontamentoEditId: state.apontamentoEditId,
      apontamentoDraft: state.apontamentoDraft,
    };
    localStorage.setItem(SESSION_KEY, JSON.stringify(sessao));
  } catch (e) { console.error(e); }
}
function carregarSessao() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.screen === 'obra' && s.obraAtualId && getObra(s.obraAtualId)) {
      state.screen = 'obra';
      state.obraAtualId = s.obraAtualId;
      state.obraTab = s.obraTab || 'visao';
    } else if (s.screen === 'config') {
      state.screen = 'config';
    } else {
      state.screen = 'painel';
    }
    state.apontamentoEditId = s.apontamentoEditId || null;
    state.apontamentoDraft = s.apontamentoDraft || null;
    if (state.apontamentoDraft) {
      setTimeout(() => toast('Continuando de onde parou — rascunho de RDO recuperado'), 400);
    }
  } catch (e) { console.error(e); }
}
function limparRascunhoApontamento() { 
  state.apontamentoDraft = null;
  state.apontamentoEditId = null;
  salvarSessao();
}

  document.querySelectorAll('.toast').forEach((el) => el.remove());
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.remove(), 3200);
}

function aplicarTema(nome) {
  const tema = TEMAS[nome] || TEMAS.dark_grafite;
  Object.keys(tema).forEach((k) => { if (k.indexOf('--') === 0) document.documentElement.style.setProperty(k, tema[k]); });
  state.tema = nome;
  salvar();
}
function aplicarTemaEAtualizar(nome) {
  aplicarTema(nome);
  render();
  toast('Tema "' + TEMAS[nome].nome + '" aplicado');
}

function aplicarModeloRelatorioEAtualizar(modelo) {
  state.modeloRelatorio = modelo;
  salvar();
  render();
  toast('Modelo de Relatório "' + MODELOS_RELATORIO[modelo].nome + '" selecionado');
}

function criarObra(dados) {
  const obra = {
    id: uid(),
    nome: dados.nome,
    cliente: dados.cliente || '',
    endereco: dados.endereco || '',
    metragemTotal: parseMoeda(dados.metragemTotal),
    contrato: {
      valor: parseMoeda(dados.valor),
      dataInicio: dados.dataInicio || todayISO(),
      dataFimPrevista: dados.dataFimPrevista || todayISO(),
      responsavel: dados.responsavel || '',
    },
    status: dados.status || 'andamento',
    precificacaoFixa: false,
    etapas: [],
    apontamentos: [],
    medicoes: [],
    aditivos: [],
    gastos: [],
    trabalhadores: [],
    recebimentos: [],
    contasPagar: [],
    contasReceber: [],
    contadores: { rdo: 0, financeiro: 0, medicao: 0, recebimento: 0, aditivo: 0, gasto: 0, contaPagar: 0, contaReceber: 0 },
  };
  state.obras.push(obra);
  state.obraAtualId = obra.id;
  state.screen = 'obra';
  state.obraTab = 'visao';
  salvar();
  render();
  toast('Obra "' + obra.nome + '" criada — agora cadastre as etapas do cronograma');
}
function excluirObra(id) {
  const o = getObra(id);
  if (!o) return;
  _confirmar('Excluir a obra "' + o.nome + '"? Todos os dados serão perdidos permanentemente.', function() {
    state.obras = state.obras.filter((x) => x.id !== id);
    state.obraAtualId = null;
    state.screen = 'painel';
    salvar(); render();
    toast('Obra excluída');
  });
}
function addEtapa(obraId, dados) {
  const o = getObra(obraId);
  if (!o) return;
  o.etapas.push({
    id: uid(), nome: dados.nome, ordem: o.etapas.length,
    dataInicioPrev: dados.dataInicioPrev, dataFimPrev: dados.dataFimPrev,
    metragemPrevista: parseMoeda(dados.metragemPrevista),
    valorFixo: dados.valorFixo != null ? parseMoeda(dados.valorFixo) : undefined,
    predecessoraId: dados.predecessoraId || '',
  });
  salvar(); render();
}
function editarEtapa(obraId, etapaId, dados) {
  const o = getObra(obraId);
  if (!o) return;
  const e = o.etapas.find(x => x.id === etapaId);
  if (!e) return;
  e.nome = dados.nome;
  e.dataInicioPrev = dados.dataInicioPrev;
  e.dataFimPrev = dados.dataFimPrev;
  e.metragemPrevista = parseMoeda(dados.metragemPrevista);
  if (o.precificacaoFixa || dados.valorFixo != null) {
    e.valorFixo = parseMoeda(dados.valorFixo);
  }
  salvar(); render();
  toast('Etapa atualizada');
}
function removerEtapa(obraId, etapaId) {
  const o = getObra(obraId);
  if (!o) return;
  _confirmar('Remover esta etapa do cronograma?', function() {
    o.etapas = (o.etapas || []).filter((e) => e.id !== etapaId);
    salvar(); render();
    toast('Etapa removida');
  });
}
function m2ExecutadoEtapa(obra, etapaId) {
  let total = 0;
  (obra.apontamentos || []).forEach((a) => {
    (a.progresso || []).forEach((p) => {
      if (p.etapaId === etapaId) {
        total += Number(p.m2Executado) || 0;
      }
    });
  });
  return total;
}

function pctAtualEtapa(obra, etapaId) {
  const etapa = (obra.etapas || []).find((e) => e.id === etapaId);
  if (!etapa) return 0;
  const m2 = m2ExecutadoEtapa(obra, etapaId);
  const prev = Number(etapa.metragemPrevista) || 0;
  if (prev > 0) {
    return clamp(Math.round((m2 / prev) * 10000) / 100, 0, 100);
  }
  return m2 > 0 ? (m2 <= 100 ? clamp(m2, 0, 100) : 100) : 0;
}

function m2ExecutadoFiltrado(obra, etapaId, idsPermitidos) {
  let total = 0;
  (obra.apontamentos || []).forEach((a) => {
    if (idsPermitidos.indexOf(a.id) !== -1) {
      (a.progresso || []).forEach((p) => {
        if (p.etapaId === etapaId) {
          total += Number(p.m2Executado) || 0;
        }
      });
    }
  });
  return total;
}

function pctEtapaFiltrado(obra, etapa, idsPermitidos) {
  const m2 = m2ExecutadoFiltrado(obra, etapa.id, idsPermitidos);
  const prev = Number(etapa.metragemPrevista) || 0;
  if (prev > 0) {
    return clamp(Math.round((m2 / prev) * 10000) / 100, 0, 100);
  }
  return m2 > 0 ? (m2 <= 100 ? clamp(m2, 0, 100) : 100) : 0;
}
function pesoEtapa(obra, etapa) {
  if (!obra.etapas || !obra.etapas.length) return 0;
  const somaMetragens = obra.etapas.reduce((s, e) => s + (Number(e.metragemPrevista) || 0), 0);
  if (somaMetragens > 0) {
    return (Number(etapa.metragemPrevista) || 0) / somaMetragens;
  }
  return 1 / obra.etapas.length;
}

function valorPrevistoEtapa(obra, etapa) {
  if (obra.precificacaoFixa || etapa.valorFixo != null) return Number(etapa.valorFixo) || 0;
  return pesoEtapa(obra, etapa) * valorContratoAtual(obra);
}

function pctFisicoGeral(obra) {
  if (!obra.etapas || !obra.etapas.length) return 0;
  let total = 0;
  obra.etapas.forEach((e) => { total += pesoEtapa(obra, e) * pctAtualEtapa(obra, e.id); });
  return clamp(total, 0, 100);
}

function pctPrazoConsumido(obra) {
  const diasTotais = Math.max(1, dayNum(obra.contrato.dataFimPrevista) - dayNum(obra.contrato.dataInicio));
  const diasDecorridos = clamp(dayNum(todayISO()) - dayNum(obra.contrato.dataInicio), 0, diasTotais);
  return Math.round((diasDecorridos / diasTotais) * 100);
}
function valorLiberadoEtapa(obra, etapaId) {
  let total = 0;
  (obra.medicoes || []).filter((m) => m.status === 'aprovada').forEach((m) => {
    const item = (m.itens || []).find((i) => i.etapaId === etapaId);
    if (item) total += Number(item.valorLiberado) || 0;
  });
  return total;
}

function valorTotalLiberado(obra) {
  return (obra.medicoes || []).filter((m) => m.status === 'aprovada').reduce((acc, m) => {
    const totalEtapas = (m.itens || []).reduce((s, i) => s + (Number(i.valorLiberado) || 0), 0);
    const totalAvulsos = (m.itensAvulsos || []).reduce((s, i) => s + (i.tipo === 'deducao' ? -Number(i.valor) : Number(i.valor)), 0);
    return acc + totalEtapas + totalAvulsos;
  }, 0);
}

function totalAditivosAcrescimo(obra) {
  return (obra.aditivos || []).filter(a => a.tipo !== 'deducao').reduce((s, a) => s + (Number(a.valorAjuste) || 0), 0);
}
function totalAditivosDeducao(obra) {
  return (obra.aditivos || []).filter(a => a.tipo === 'deducao').reduce((s, a) => s + (Number(a.valorAjuste) || 0), 0);
}

function valorContratoAtual(obra) {
  const inicial = Number(obra.contrato.valor) || 0;
  const acrescimos = totalAditivosAcrescimo(obra);
  const deducoes = totalAditivosDeducao(obra);
  return Math.max(0, inicial + acrescimos - deducoes);
}

function totalRecebidoCliente(obra) {
  return (obra.recebimentos || []).reduce((s, r) => s + (Number(r.valor) || 0), 0);
}

function saldoEmAbertoCliente(obra) {
  return valorContratoAtual(obra) - totalRecebidoCliente(obra);
}

function totalGastosCompras(obra, etapaId) {
  const lista = (obra.gastos || []).filter(g => !etapaId || g.etapaId === etapaId);
  return lista.reduce((s, g) => s + (Number(g.valor) || 0), 0);
}

function totalGastosMaoDeObra(obra) {
  let total = 0;
  (obra.apontamentos || []).forEach(a => {
    (a.presencasTrabalhadores || []).forEach(pt => {
      const trab = (obra.trabalhadores || []).find(t => t.id === pt.trabalhadorId);
      const valDiaria = pt.valorDiaria != null ? Number(pt.valorDiaria) : (trab ? Number(trab.valorDiaria) : 0);
      if (pt.presente && valDiaria > 0) {
        total += valDiaria;
      }
    });
  });
  return total;
}

function totalGastosReais(obra) {
  return totalGastosCompras(obra) + totalGastosMaoDeObra(obra);
}

function margemLucroReal(obra) {
  return valorContratoAtual(obra) - totalGastosReais(obra);
}

function diasParadosClima(obra) {
  return (obra.apontamentos || []).filter(a => a.clima === 'chuva' || a.clima === 'impraticavel').length;
}

function etapaAtrasada(obra, etapa) {
  const pct = pctAtualEtapa(obra, etapa.id);
  return pct < 100 && etapa.dataFimPrev && etapa.dataFimPrev < todayISO();
}
function obraTemAtraso(obra) { return obra.etapas.some((e) => etapaAtrasada(obra, e)); }

function criarMedicao(obraId, dados) {
  const o = getObra(obraId);
  if (!o) return;
  const idsPermitidos = dados.apontamentoIds || o.apontamentos.filter((a) => a.data <= dados.periodoFim).map((a) => a.id);
  const itens = o.etapas.map((e) => {
    const pctAtual = pctEtapaFiltrado(o, e, idsPermitidos);
    const jaLiberado = valorLiberadoEtapa(o, e.id);
    const valorTotalEtapa = valorPrevistoEtapa(o, e);
    const valorLiberado = Math.max(0, (pctAtual / 100) * valorTotalEtapa - jaLiberado);
    return { etapaId: e.id, pctAcumulado: pctAtual, valorLiberado: +valorLiberado.toFixed(2) };
  });
  const itensAvulsos = (dados.itensAvulsos || [])
    .filter((i) => i.descricao && parseMoeda(i.valor) > 0)
    .map((i) => ({ id: uid(), descricao: i.descricao, valor: parseMoeda(i.valor), tipo: i.tipo === 'deducao' ? 'deducao' : 'acrescimo' }));
  
  const numSeq = proximoNumero(o, 'medicao');

  const med = {
    id: uid(), numero: numSeq, dataEmissao: todayISO(),
    periodoInicio: dados.periodoInicio, periodoFim: dados.periodoFim,
    apontamentoIds: idsPermitidos, itens, itensAvulsos, status: 'aberta',
  };
  o.medicoes.push(med);
  salvar(); render();
  toast('Medição MED-' + numSeq + ' criada — revise os valores e aprove quando estiver certo');
}
function aprovarMedicao(obraId, medId) {
  const o = getObra(obraId);
  if (!o) return;
  const m = o.medicoes.find((x) => x.id === medId);
  if (!m) return;
  _confirmar('Aprovar MED-'+(m.numero||'')+'? Uma conta a receber será criada no Fluxo de Caixa.', function() {
    m.status = 'aprovada';
    o.contasReceber = o.contasReceber || [];
    const jaExiste = o.contasReceber.find(cr => cr.medicaoId === medId);
    if (!jaExiste) {
      const valorItens = (m.itens||[]).reduce((s,it)=>s+(Number(it.valorLiberado)||0), 0);
      const valorAvulsos = (m.itensAvulsos||[]).reduce((s,it)=>{
        const v = parseMoeda(it.valor||'0');
        return it.tipo==='deducao' ? s-v : s+v;
      }, 0);
      const valorMed = valorItens + valorAvulsos || valorTotalLiberado(o);
      o.contadores = o.contadores || {};
      o.contadores.contaReceber = (o.contadores.contaReceber||0)+1;
      o.contasReceber.push({
        id: uid(),
        numero: String(o.contadores.contaReceber).padStart(4,'0'),
        descricao: 'MED-'+(m.numero||'001')+' — '+(m.descricao||'Medição'),
        valor: valorMed,
        dataEmissao: todayISO(),
        dataVencimento: m.periodoFim || todayISO(),
        status: 'pendente',
        categoria: 'medicao',
        medicaoId: medId,
      });
      toast('Medição aprovada — Conta a Receber de ' + brl(valorMed) + ' criada no Fluxo');
    }
    (m.itensAvulsos || []).forEach((item) => {
      addAditivo(obraId, {
        motivo: 'MED-' + m.numero + ': ' + item.descricao,
        tipo: item.tipo || 'acrescimo',
        valor: parseMoeda(item.valor || '0'),
        data: todayISO(),
      });
    });
    salvar(); render();
  });
}
function _executarEstornoMedicao(obraId, medId) {
  const o = getObra(obraId);

  const m = o.medicoes.find((x) => x.id === medId);

  const crVinculada = (o.contasReceber||[]).find(cr => cr.medicaoId === medId);

  m.status = 'aberta';
  if (o.aditivos && o.aditivos.length) {
    o.aditivos = o.aditivos.filter(a => !a.motivo || !a.motivo.startsWith('MED-' + m.numero));
  }

}

function addAditivo(obraId, dados) {
  const o = getObra(obraId);
  if (!o) return;
  const valorAntes = valorContratoAtual(o);
  const valorAjuste = parseMoeda(dados.valorAjuste);
  const tipo = dados.tipo === 'deducao' ? 'deducao' : 'acrescimo';
  const valorDepois = tipo === 'deducao' ? Math.max(0, valorAntes - valorAjuste) : valorAntes + valorAjuste;
  const numSeq = proximoNumero(o, 'aditivo');
  o.aditivos.push({ id: uid(), numero: numSeq, data: dados.data || todayISO(), motivo: dados.motivo, tipo, valorAjuste, valorAntes, valorDepois });

function addRecebimentoCliente(obraId, dados) {
  const o = getObra(obraId);
  if (!o) return;
  o.recebimentos = o.recebimentos || [];
  const numSeq = proximoNumero(o, 'recebimento');
  const recId = uid();

  /* Se vinculado a medição, localiza a CR e sincroniza status */
  let origemId = dados.origemId || '';
  let descricao = dados.observacao || 'Pagamento referente à obra';

  if (dados.medicaoId) {
    const med = (o.medicoes||[]).find(m => m.id === dados.medicaoId);
    if (med) {
      descricao = 'MED-' + (med.numero||'001') + ' — ' + (med.descricao||'Medição');
    }
    /* Localizar CR vinculada e marcar como recebida */
    const cr = (o.contasReceber||[]).find(c => c.medicaoId === dados.medicaoId);
    if (cr) {
      origemId = cr.id;
      cr.status = 'recebido';
      cr.dataRecebimento = dados.data || todayISO();
      cr.formaPagamento = dados.formaPagamento || 'PIX';
    }
    /* Marcar medição como paga */
    if (med) med.statusPagamento = 'pago';
  }

  o.recebimentos.push({
    id: recId,
    numero: numSeq,
    data: dados.data || todayISO(),
    valor: parseMoeda(dados.valor),
    formaPagamento: dados.formaPagamento || 'PIX',
    comprovanteNro: dados.comprovanteNro || '',
    observacao: descricao,
    medicaoId: dados.medicaoId || '',
    origemId: origemId,
  });
  salvar(); render();
  toast('Recebimento REC-' + numSeq + ' (' + brl(dados.valor) + ') registrado!');
}

          '<button class="hamb" onclick="toggleMenu()"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>' +
          '<div style="min-width:0;overflow:hidden;"><h1 style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + (obra ? esc(obra.nome) : (state.screen === 'config' ? 'Configurações' : 'Dashboard Geral')) + '</h1>' +
          (obra ? '<div class="sub">' + esc(obra.cliente || 'Sem cliente definido') + '</div>' : (state.screen === 'config' ? '<div class="sub">Empresa & Preferências</div>' : '<div class="sub">Visão geral de todas as obras ativas</div>')) +
          '</div>' +
        '</div>' +
        (obra ? (
          '<div style="display:flex;gap:6px;flex-none;">' +
            '<button class="btn btn-ghost btn-sm" onclick="abrirModalEditarObra()" title="Editar dados da obra">' + ICONS.edit + '</button>' +
            '<button class="btn btn-ghost btn-sm" style="color:var(--bad);" onclick="excluirObra(\'' + obra.id + '\')\" title="Excluir obra">' + ICONS.trash + '</button>' +
            '<button class="btn btn-ghost btn-sm" onclick="irPainel()" title="Voltar ao painel">' + ICONS.painel + '</button>' +
          '</div>'
        ) : '') +
      '</div>' +
      '<div id="root" class="content">' + contentHtml + '</div>' +
    '</div>' +
  '</div>';
}


function renderPainelGeral() {
  const obras = state.obras;
  const ativas = obras.filter((o) => o.status === 'andamento');
  const atrasadas = obras.filter((o) => obraTemAtraso(o));
  const totalObras = obras.length;

  const valorTotalCarteira = obras.reduce((a, o) => a + valorContratoAtual(o), 0);
  const valorTotalRecebidoGlobal = obras.reduce((a, o) => a + totalRecebidoCliente(o), 0);
  const gastosReaisGlobal = obras.reduce((a, o) => a + totalGastosReais(o), 0);

  const hojeAnoMes = todayISO().slice(0, 7);
  let totalRdosEsteMes = 0;
  let todosRdos = [];
  obras.forEach((o) => {
    (o.apontamentos || []).forEach((a) => {
      if (a.data && a.data.startsWith(hojeAnoMes)) totalRdosEsteMes++;
      todosRdos.push({ ...a, obraNome: o.nome, obraId: o.id, responsavel: o.contrato.responsavel || 'Eng. Responsável' });
    });
  });
  todosRdos.sort((a, b) => b.data.localeCompare(a.data));
  const ultimosRdos = todosRdos.slice(0, 5);

  let obrasFiltradas = obras.slice();
  if (state.statusFilter === 'andamento') obrasFiltradas = obrasFiltradas.filter(o => o.status === 'andamento');
  else if (state.statusFilter === 'atraso') obrasFiltradas = obrasFiltradas.filter(o => obraTemAtraso(o));
  else if (state.statusFilter === 'concluida') obrasFiltradas = obrasFiltradas.filter(o => o.status === 'concluida');

  if (state.searchQuery.trim()) {
    const q = state.searchQuery.toLowerCase();
    obrasFiltradas = obrasFiltradas.filter(o => (o.nome && o.nome.toLowerCase().includes(q)) || (o.cliente && o.cliente.toLowerCase().includes(q)));
  }

  if (!totalObras) {
    return '' +
      '<div class="welcome-empty">' +
        '<div class="icon-big">🏗️</div>' +
        '<h3>Nenhuma obra cadastrada ainda</h3>' +
        '<p>Cadastre sua primeira obra para visualizar os gráficos de progresso financeiro, distribuição de custos e indicadores do Dashboard Geral.</p>' +
        '<button class="btn btn-primary" onclick="abrirModalNovaObra()">' + ICONS.plus + ' Criar Primeira Obra</button>' +
      '</button>';
  }

  const kpiCardsHtml = '' +
    '<div class="grid grid-4" style="margin-bottom:18px;">' +
      '<div class="kpi">' +
        '<span class="tag-top">Ativas</span>' +
        '<div class="lbl">Obras em Andamento</div>' +
        '<div class="val" style="margin-top:8px;">' + ativas.length + ' / ' + totalObras + '</button>' +
        '<div class="sub-text">Projetos em execução</div>' +
      '</button>' +
      '<div class="kpi">' +
        '<span class="tag-top">Contratos</span>' +
        '<div class="lbl">Orçamento Total</div>' +
        '<div class="val" style="margin-top:8px;">' + brl(valorTotalCarteira) + '</button>' +
        '<div class="sub-text">Valor contratado acumulado</div>' +
      '</button>' +
      '<div class="kpi">' +
        '<span class="tag-top">Comprovado</span>' +
        '<div class="lbl">Recebido dos Clientes</div>' +
        '<div class="val" style="color:var(--good);margin-top:8px;">' + brl(valorTotalRecebidoGlobal) + '</button>' +
        '<div class="sub-text">Entradas quitadas / pagas</div>' +
      '</button>' +
      '<div class="kpi">' +
        '<span class="tag-top">Realizado</span>' +
        '<div class="lbl">Total de Despesas</div>' +
        '<div class="val" style="color:var(--bad);margin-top:8px;">' + brl(gastosReaisGlobal) + '</button>' +
        '<div class="sub-text">Custo acumulado das obras</div>' +
      '</button>' +
    '</button>';

  const maxValor = Math.max(1, ...obras.map(o => Math.max(valorContratoAtual(o), totalRecebidoCliente(o), totalGastosReais(o))));
  const chartW = 580, chartH = 210, padLeft = 60, padBot = 30, padTop = 20, padRight = 20;
  const graphW = chartW - padLeft - padRight;
  const graphH = chartH - padTop - padBot;

  const ySteps = 4;
  let gridYLines = '';
  for (let i = 0; i <= ySteps; i++) {
    const valStep = (maxValor / ySteps) * i;
    const yPos = padTop + graphH - (i / ySteps) * graphH;
    const labelStep = valStep >= 1000000 ? (valStep / 1000000).toFixed(1) + 'M' : valStep >= 1000 ? Math.round(valStep / 1000) + 'k' : Math.round(valStep);
    gridYLines += '<line x1="' + padLeft + '" y1="' + yPos + '" x2="' + (chartW - padRight) + '" y2="' + yPos + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (padLeft - 8) + '" y="' + (yPos + 4) + '" text-anchor="end" fill="var(--ink-faint)">R$' + labelStep + '</text>';
  }

  const numObras = obras.length;
  const groupW = graphW / numObras;
  const barW = Math.min(22, (groupW - 20) / 3);

  let barsSvg = '';
  obras.forEach((o, idx) => {
    const groupX = padLeft + idx * groupW + groupW / 2;
    const vOrc = valorContratoAtual(o);
    const vRec = totalRecebidoCliente(o);
    const vDes = totalGastosReais(o);

    const hOrc = (vOrc / maxValor) * graphH;
    const hRec = (vRec / maxValor) * graphH;
    const hDes = (vDes / maxValor) * graphH;

    const xOrc = groupX - barW * 1.6;
    const xRec = groupX - barW * 0.5;
    const xDes = groupX + barW * 0.6;

    const yOrc = padTop + graphH - hOrc;
    const yRec = padTop + graphH - hRec;
    const yDes = padTop + graphH - hDes;

    barsSvg += '<rect x="' + xOrc + '" y="' + yOrc + '" width="' + barW + '" height="' + Math.max(2, hOrc) + '" fill="var(--accent)" opacity="0.85" rx="3"><title>' + esc(o.nome) + ' - Orçamento: ' + brl(vOrc) + '</title></rect>';
    barsSvg += '<rect x="' + xRec + '" y="' + yRec + '" width="' + barW + '" height="' + Math.max(2, hRec) + '" fill="var(--good)" opacity="0.85" rx="3"><title>' + esc(o.nome) + ' - Recebido: ' + brl(vRec) + '</title></rect>';
    barsSvg += '<rect x="' + xDes + '" y="' + yDes + '" width="' + barW + '" height="' + Math.max(2, hDes) + '" fill="var(--bad)" opacity="0.85" rx="3"><title>' + esc(o.nome) + ' - Despesas: ' + brl(vDes) + '</title></rect>';

    const nomeCurto = o.nome.length > 14 ? o.nome.slice(0, 12) + '..' : o.nome;
    barsSvg += '<text x="' + groupX + '" y="' + (chartH - 8) + '" text-anchor="middle" fill="var(--ink-soft)">' + esc(nomeCurto) + '</text>';
  });

  const legendas = [
    { cor: 'var(--accent)', label: 'Orçamento Contrato' },
    { cor: 'var(--good)',   label: 'Recebido Cliente'   },
    { cor: 'var(--bad)',    label: 'Despesas Reais'      },
  ];
  const legendSvg = legendas.map((l, i) =>
    '<rect x="' + (padLeft + i * 130) + '" y="2" width="12" height="12" rx="3" fill="' + l.cor + '" opacity="0.85"/>' +
    '<text x="' + (padLeft + i * 130 + 16) + '" y="12" fill="var(--ink-faint)" font-size="11">' + l.label + '</text>'
  ).join('');

  const barChartSvg = '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" style="width:100%;height:auto;">' + legendSvg + gridYLines + barsSvg + '</svg>';

  let categoriasCustos = { material: 0, mao_de_obra: 0, equipamento: 0, outros: 0 };
  obras.forEach(o => {
    (o.gastos || []).forEach(g => {
      const cat = g.categoria || 'outros';
      categoriasCustos[cat] = (categoriasCustos[cat] || 0) + (Number(g.valor) || 0);
    });
    categoriasCustos.mao_de_obra += totalGastosMaoDeObra(o);
  });

  const totalCustos = Object.values(categoriasCustos).reduce((a, b) => a + b, 0) || 1;
  const coresCat = { material: 'var(--accent)', mao_de_obra: 'var(--good)', equipamento: 'var(--warn)', outros: 'var(--bad)' };
  const labelsCat = { material: 'Material', mao_de_obra: 'Mão de Obra', equipamento: 'Equipamento', outros: 'Outros' };

  let accumPct = 0;
  const donutR = 40, donutC = 60, circumference = 2 * Math.PI * donutR;
  let donutSlicesSvg = '';

  Object.keys(categoriasCustos).forEach((cat, i) => {
    const val = categoriasCustos[cat];
    const pct = val / totalCustos;
    const strokeDash = (pct * circumference) + ' ' + circumference;
    const strokeOffset = -(accumPct * circumference);
    accumPct += pct;

    if (val > 0) {
      donutSlicesSvg += '<circle cx="' + donutC + '" cy="' + donutC + '" r="' + donutR + '" fill="transparent" stroke="' + coresCat[cat] + '" stroke-width="18" stroke-dasharray="' + strokeDash + '" stroke-dashoffset="' + strokeOffset + '" opacity="' + (1 - i * 0.15) + '" transform="rotate(-90 ' + donutC + ' ' + donutC + ')"><title>' + labelsCat[cat] + ': ' + brl(val) + ' (' + Math.round(pct * 100) + '%)</title></circle>';
    }
  });

  const donutLegendHtml = Object.keys(categoriasCustos).map(cat => {
    const val = categoriasCustos[cat];
    const pct = Math.round((val / totalCustos) * 100);
    return '' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">' +
      '<div style="display:flex;align-items:center;gap:7px;">' +
        '<span style="width:10px;height:10px;border-radius:50%;background:' + coresCat[cat] + ';display:inline-block;"></span>' +
        '<span>' + labelsCat[cat] + '</span>' +
      '</button>' +
      '<span style="color:var(--ink-soft);">' + brl(val) + ' (' + pct + '%)</span>' +
    '</button>';
  }).join('');

  const donutChartHtml = '' +
  '<div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;flex:1;">' +
    '<div style="width:120px;height:120px;flex:none;">' +
      '<svg viewBox="0 0 120 120" style="width:100%;height:100%;">' +
        (totalCustos > 1 ? donutSlicesSvg : '<circle cx="60" cy="60" r="40" fill="transparent" stroke="var(--line-strong)" stroke-width="18"/>') +
      '</svg>' +
    '</button>' +
    '<div style="flex:1;min-width:180px;">' + donutLegendHtml + '</button>' +
  '</button>';

  const cardsObrasGridHtml = obrasFiltradas.sort((a, b) => {
    const ordem = { 'andamento': 0, 'concluida': 1, 'parada': 2 };
    return (ordem[a.status] || 0) - (ordem[b.status] || 0);
  }).map((o) => {
    const pct = pctFisicoGeral(o);
    const pctPrazo = pctPrazoConsumido(o);
    const atraso = obraTemAtraso(o);
    const emAberto = saldoEmAbertoCliente(o);

    const statusBadge = o.status === 'concluida' ? '<span class="badge badge-good">✓ Concluída</span>'
      : o.status === 'parada' ? '<span class="badge badge-warn">⏸ Parada</span>'
      : '<span class="badge badge-neutral">▶ Em andamento</span>';
    
    const progressColor = atraso ? 'var(--bad)' : (pct >= 100 ? 'var(--good)' : 'var(--accent)');
    
    return '' +
    '<div class="card card-obra" onclick="abrirObra(\'' + o.id + '\')">' +
      '<div>' +
        '<div class="obra-header">' +
          '<div style="min-width:0;">' +
            '<div class="obra-nome">' + esc(o.nome) + '</button>' +
            '<div class="obra-cliente">' + esc(o.cliente || 'Sem cliente') + '</button>' +
          '</button>' +
          '<div class="status-badge" onclick="event.stopPropagation();">' + statusBadge + '</button>' +
        '</button>' +
        '<div class="progress-container">' +
          '<div class="progress-track">' +
            '<div class="progress-fill" style="width:' + clamp(pctPrazo, 0, 100) + '%;background:var(--line-strong);position:absolute;" title="Prazo consumido"></div>' +
            '<div class="progress-fill" style="width:' + clamp(pct, 0, 100) + '%;background:' + progressColor + ';position:relative;" title="Físico executado"></div>' +
          '</button>' +
          '<div class="progress-labels">' +
            '<span>📊 Físico ' + Math.round(pct) + '%</span>' +
            '<span>⏱ Prazo ' + pctPrazo + '%</span>' +
          '</button>' +
        '</button>' +
      '</button>' +
      '<div>' +
        '<div class="obra-footer">' +
          '<span class="contrato">Contrato: <span>' + brl(valorContratoAtual(o)) + '</span></span>' +
          '<span>Em Aberto: <span style="color:' + (emAberto > 0 ? 'var(--warn)' : 'var(--good)') + ';">' + brl(emAberto) + '</span></span>' +
        '</button>' +
        (atraso ? '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--bad-soft);"><span class="badge badge-bad">' + ICONS.alert + ' Etapa(s) Atrasada(s)</span></div>' : '') +
      '</button>' +
    '</button>';
  }).join('');

  const linhasUltimosRdos = ultimosRdos.map(r => {
    const climaIcons = { bom: '☀️ Bom', chuva: '🌧️ Chuva', impraticavel: '🛑 Impraticável' };
    return '' +
    '<tr style="cursor:pointer;" onclick="abrirObra(\'' + r.obraId + '\')">' +
      '<td style="white-space:nowrap;">' + fmtData(r.data) + '</td>' +
      '<td class="col-desc"><span class="val-destaque">' + esc(r.obraNome) + '</span></td>' +
      '<td class="col-desc">' + esc(r.responsavel) + '</td>' +
      '<td class="col-center">' + (climaIcons[r.clima] || '☀️ Bom') + '</td>' +
    '</tr>';
  }).join('');

  return '' +
    kpiCardsHtml +
    '<div class="grid grid-2" style="margin-bottom:18px;">' +
      '<div class="card">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
          '<h2 class="section-title" style="margin:0;"><span class="bar"></span>Progresso Financeiro por Obra</h2>' +
        '</button>' +
        barChartSvg +
      '</button>' +
      '<div class="card">' +
        '<h2 class="section-title"><span class="bar"></span>Distribuição de Custos</h2>' +
        donutChartHtml +
      '</button>' +
    '</button>' +
    '<div style="margin-bottom:18px;">' +
      '<div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">' +
        '<h2 class="section-title" style="margin:0;"><span class="bar"></span>Obras da Carteira (Cards de Gestão)</h2>' +
        '<button class="btn btn-primary btn-sm" onclick="abrirModalNovaObra()">' + ICONS.plus + ' Nova Obra</button>' +
      '</button>' +
      '<div class="search-bar">' +
        '<input class="search-input" placeholder="🔍 Pesquisar obra ou cliente..." value="' + esc(state.searchQuery) + '" oninput="state.searchQuery=this.value; render();">' +
        '<div class="filter-tabs">' +
          '<button class="filter-btn ' + (state.statusFilter === 'todos' ? 'active' : '') + '" onclick="state.statusFilter=\'todos\'; render();">Todas (' + obras.length + ')</button>' +
          '<button class="filter-btn ' + (state.statusFilter === 'andamento' ? 'active' : '') + '" onclick="state.statusFilter=\'andamento\'; render();">Ativas (' + ativas.length + ')</button>' +
          '<button class="filter-btn ' + (state.statusFilter === 'atraso' ? 'active' : '') + '" onclick="state.statusFilter=\'atraso\'; render();">Com Atraso (' + atrasadas.length + ')</button>' +
        '</button>' +
      '</button>' +
      (obrasFiltradas.length ? '<div class="grid grid-3">' + cardsObrasGridHtml + '</button>' : '<div class="empty">Nenhuma obra encontrada.</div>') +
    '</button>' +
    '<div class="card">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">' +
        '<h2 class="section-title" style="margin:0;"><span class="bar"></span>Últimos RDOs Emitidos</h2>' +
        '<span style="color:var(--accent);cursor:pointer;" onclick="if(state.obras.length) abrirObra(state.obras[0].id);">Ver todos →</span>' +
      '</button>' +
      '<div class="tbl-responsive"><table class="tbl"><thead><tr><th style="width:90px;">Data</th><th class="col-desc">Obra</th><th class="col-desc">Responsável</th><th class="col-center">Clima</th></tr></thead><tbody>' + (linhasUltimosRdos || '<tr><td colspan="4" class="empty">Nenhum RDO registrado</td></tr>') + '</tbody></table></div>' +
    '</button>';
}

function renderConfigScreen() {

  return '' +
  '<h2 class="section-title"><span class="bar"></span>Dados da Empresa</h2>' +

      '</button>' +
    '</button>' +
    '<div style="display:flex;justify-content:flex-end;margin-top:16px;">' +
      '<button class="btn btn-primary btn-sm" onclick="salvarConfigEmpresa()">Salvar Dados da Empresa</button>' +
    '</button>' +
  '</button>' +

  '<h2 class="section-title" style="margin-top:22px;"><span class="bar"></span>Modelos de Layout para Relatórios e Recibos (PDF Executivo)</h2>' +
  '<p style="color:var(--ink-faint);margin:0 0 14px;">Escolha o modelo visual que será aplicado em todos os PDFs gerados pelo sistema (Extratos, Recibos, RDO, Financeiro).</p>' +
  '<div class="grid grid-2">' +
    Object.keys(MODELOS_RELATORIO).map((key) => {

      '<div class="card" style="cursor:pointer;' + (ativo ? 'border-color:var(--accent);border-width:2px;' : '') + '" onclick="aplicarModeloRelatorioEAtualizar(\'' + key + '\')">' +

    }).join('') +
  '</button>' +

  '<h2 class="section-title" style="margin-top:22px;"><span class="bar"></span>Paletas de Cores Harmonizadas (Zero Fundo Branco Stark)</h2>' +

function uploadLogoEmpresa(files) {
  const file = files && files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const maxDim = 300;
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      state.empresa.logo = canvas.toDataURL('image/png');
      salvar();
      render();
      toast('Logo da empresa salva com sucesso!');
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function removerLogoEmpresa() {
  _confirmar('Remover a logo da empresa?', function() { state.empresa.logo = ''; salvar(); render(); }); return;
  void 0;
  salvar(); render();
}
function salvarConfigEmpresa() {
  const elRazao = document.getElementById('cfg-razao');

  if (elRazao) state.empresa.razao = elRazao.value.trim();

function exportarBackupObraFlow() {
  try {
    const dados = { _backupApp: 'obraflow', _backupVersao: 1, _backupData: new Date().toISOString(), obras: state.obras, empresa: state.empresa, tema: state.tema, modeloRelatorio: state.modeloRelatorio };
    const blob = new Blob([JSON.stringify(dados, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'backup-obraflow-' + todayISO() + '.json'; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast('Backup exportado com sucesso');
  } catch (e) { toast('Falha ao exportar backup'); }
}
function importarBackupObraFlow(files) {
  const file = files && files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const dados = JSON.parse(reader.result);
      if (!dados || typeof dados !== 'object' || !Array.isArray(dados.obras)) { toast('Arquivo de backup inválido'); return; }
      if (confirm('Importar este backup vai substituir TODAS as obras deste aparelho. Continuar?')) return;
      state.obras = dados.obras || [];
      state.empresa = Object.assign({ razao: '', contato: '', responsavel: '', logo: '' }, dados.empresa || {});
      if (dados.tema) aplicarTema(dados.tema);
      if (dados.modeloRelatorio) state.modeloRelatorio = dados.modeloRelatorio;
      limparSessao();
      salvar();
      state.screen = 'painel'; state.obraAtualId = null;
      render();
      toast('Backup importado com sucesso');
    } catch (e) { toast('Falha ao ler arquivo de backup'); }
  };
  reader.readAsText(file);
}

function confirmarFecharFolha() {
  const o = getObra();
  if (!o) return;
  o.contasPagar = o.contasPagar || [];
  const ini = document.getElementById('ff-inicio').value;
  const fim = document.getElementById('ff-fim').value;
  const venc = document.getElementById('ff-venc').value;
  if (!ini || !fim || !venc) { toast('Preencha período e vencimento'); return; }

  // Calcula diárias no período
  let totalFolha = 0;
  const resumoFolha = {};
  (o.apontamentos || []).filter(a => a.data >= ini && a.data <= fim).forEach(a => {
    (a.presencasTrabalhadores || []).forEach(pt => {
      if (pt.presente) {
        const t = (o.trabalhadores || []).find(x => x.id === pt.trabalhadorId);
        if (t) {
          const diaria = Number(t.valorDiaria) || 0;
          totalFolha += diaria;
          resumoFolha[t.nome] = (resumoFolha[t.nome] || 0) + diaria;
        }
      }
    });
  });

  if (totalFolha <= 0) { toast('Nenhuma diária encontrada no período'); return; }
  const num = proximoNumero(o, 'contaPagar');
  const resumoTxt = Object.keys(resumoFolha).map(n => n + ': ' + brl(resumoFolha[n])).join(' | ');
  o.contasPagar.push({
    id: uid(), numero: num,
    descricao: 'Folha ' + fmtData(ini) + ' a ' + fmtData(fim),
    fornecedor: 'Equipe Própria',
    valor: totalFolha, dataVencimento: venc, dataPagamento: '',
    status: 'pendente',
    categoria: 'mao_de_obra',
    origem: 'diaria', origemId: '',
    obs: resumoTxt,
  });
  salvar(); render(); fecharModal();
  toast('Folha fechada — CP-' + num + ': ' + brl(totalFolha) + ' a pagar em ' + fmtData(venc));
}

function calcDiariasNaoFaturadas(o) {
  // Total de diárias geradas em apontamentos
  let totalGerado = 0;
  (o.apontamentos || []).forEach(a => {
    (a.presencasTrabalhadores || []).forEach(pt => {
      if (pt.presente) {
        const t = (o.trabalhadores || []).find(x => x.id === pt.trabalhadorId);
        if (t) totalGerado += Number(t.valorDiaria) || 0;
      }
    });
  });
  // Total já faturado em folhas (contasPagar com origem='diaria')
  const totalFaturado = (o.contasPagar || [])
    .filter(cp => cp.origem === 'diaria')
    .reduce((s, cp) => s + cp.valor, 0);
  return Math.max(0, totalGerado - totalFaturado);
}

function imprimirReciboFuncionario(trabId) {
  const o = getObra();
  if (!o) return;
  const t = (o.trabalhadores || []).find(x => x.id === trabId);
  if (!t) return;

  // Monta histórico de presenças
  const presencas = [];

    const pt = (a.presencasTrabalhadores || []).find(p => p.trabalhadorId === trabId);
    if (pt && pt.presente) {
      presencas.push({ data: a.data, valor: Number(pt.valorDiaria || t.valorDiaria) || 0 });
    }
  });

  const totalDias = presencas.length;
  const totalValor = presencas.reduce((s, p) => s + p.valor, 0);
  const emp = state.empresa;
  const ct = TEMAS[state.tema] || TEMAS.dark_grafite;

  const linhasPresenca = presencas.map((p, i) =>

      '<td style="padding:7px 10px;border-bottom:1px solid #E2E8F0;text-align:center;">' + brl(p.valor) + '</td>' +

  ).join('');

  const logoHtml = emp.logo
    ? '<img src="' + emp.logo + '" style="height:48px;object-fit:contain;">'
    : '<div style="font-weight:700;font-size:18px;color:' + accentHex + ';">' + esc(emp.razao || 'ObraFlow') + '</div>';

  const body = '' +
  '<style>body{font-family:Arial,sans-serif;color:#0F172A;margin:0;padding:24px;} table{width:100%;border-collapse:collapse;} h1,h2,h3{margin:0;}</style>' +
  '<div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:16px;border-bottom:2px solid ' + accentHex + ';margin-bottom:20px;">' +
    '<div>' + logoHtml + '<div style="margin-top:6px;color:#64748B;">' + esc(emp.contato || '') + '</div></div>' +
    '<div style="text-align:right;">' +
      '<div style="font-size:20px;font-weight:700;">RECIBO DE DI&Aacute;RIAS</div>' +
      '<div style="color:#64748B;margin-top:4px;">Obra: ' + esc(o.nome) + '</div>' +
      '<div style="color:#64748B;">Emitido em: ' + fmtData(todayISO()) + '</div>' +
    '</div>' +
  '</div>' +
  '<div style="background:#F1F5F9;border-radius:8px;padding:16px;margin-bottom:20px;">' +
    '<div style="font-size:18px;font-weight:700;">' + esc(t.nome) + '</div>' +
    '<div style="color:#64748B;margin-top:4px;">Fun&ccedil;&atilde;o: ' + esc(t.funcao) + ' &nbsp;|&nbsp; Di&aacute;ria atual: ' + brl(t.valorDiaria) + '</div>' +
  '</div>' +
  '<table>' +
    '<thead><tr style="background:' + accentHex + ';color:#fff;">' +
      '<th style="padding:10px;text-align:left;">Data</th>' +
      '<th style="padding:10px;text-align:center;">Valor Di&aacute;ria</th>' +
    '</tr></thead>' +
    '<tbody>' + (linhasPresenca || '<tr><td colspan="2" style="padding:20px;text-align:center;color:#94A3B8;">Nenhuma presen&ccedil;a registrada</td></tr>') + '</tbody>' +
    '<tfoot><tr style="background:#1E293B;color:#fff;">' +
      '<td style="padding:10px;font-weight:700;">Total: ' + totalDias + ' dia(s)</td>' +
      '<td style="padding:10px;text-align:center;font-weight:700;font-size:16px;">' + brl(totalValor) + '</td>' +
    '</tr></tfoot>' +
  '</table>' +
  '<div style="margin-top:48px;display:flex;gap:40px;">' +
    '<div style="flex:1;border-top:1px solid #94A3B8;padding-top:8px;text-align:center;color:#64748B;">Assinatura do Trabalhador<br>' + esc(t.nome) + '</div>' +
    '<div style="flex:1;border-top:1px solid #94A3B8;padding-top:8px;text-align:center;color:#64748B;">Assinatura do Respons&aacute;vel<br>' + esc(emp.responsavel || o.contrato.responsavel || 'Responsável') + '</div>' +
  '</div>' +
  '<div style="margin-top:32px;padding-top:10px;border-top:1px solid #E2E8F0;color:#94A3B8;text-align:center;font-size:11px;">Documento gerado pelo ObraFlow · ' + esc(emp.razao || '') + '</div>';

  _abrirImpressao(body, 'Recibo-' + t.nome.replace(/\s+/g, '-'));
}

/* ══════════════════════════════════════════════
   FLUXO DE CAIXA — renderFluxoTab
══════════════════════════════════════════════ */
function renderFluxoTab(o) {
  var hoje = todayISO();
  o.contasPagar   = o.contasPagar   || [];
  o.contasReceber = o.contasReceber || [];
  var aba     = state.fluxoAba || 'pagar';
  var sel     = state.fluxoSelecionados || {};
  var modoSel = !!state.fluxoModoSel;
  var expId   = state.fluxoExpanded;
  var pendP   = o.contasPagar.filter(function(x){return x.status==='pendente';}).reduce(function(s,x){return s+Number(x.valor);},0);
  var pendR   = o.contasReceber.filter(function(x){return x.status!=='recebido';}).reduce(function(s,x){return s+Number(x.valor);},0);
  var saldo   = o.contasReceber.filter(function(x){return x.status==='recebido';}).reduce(function(s,x){return s+Number(x.valor);},0)
              - o.contasPagar.filter(function(x){return x.status==='pago';}).reduce(function(s,x){return s+Number(x.valor);},0);
  var lista   = aba === 'pagar' ? o.contasPagar : o.contasReceber;
  var selIds  = Object.keys(sel).filter(function(id){return sel[id];});
  var temSel  = selIds.length > 0;
  var todosOk = lista.length > 0 && lista.every(function(x){return sel[x.id];});
  var catL    = {material:'Material',equipamento:'Equipamento',mao_de_obra:'Mão de Obra',servico:'Serviço',medicao:'Medição',parcela:'Parcela',aditivo:'Aditivo',outros:'Outros'};
  var q = function(s){ return s.replace(/'/g, "&#39;"); };

  var linhas = '';
  var sorted = lista.slice().sort(function(a,b){return (a.dataVencimento||'').localeCompare(b.dataVencimento||'');});
  for (var ii=0; ii<sorted.length; ii++) {
    var it = sorted[ii];
    var isExp = expId === it.id;
    var venc  = it.status==='pendente' && it.dataVencimento && it.dataVencimento < hoje;
    var sc    = (it.status==='pago'||it.status==='recebido') ? 'var(--good)' : venc ? 'var(--bad)' : 'var(--warn)';
    var sl    = it.status==='pago' ? 'Pago' : it.status==='recebido' ? 'Recebido' : venc ? 'Vencida' : 'Pendente';
    var vc    = aba==='pagar' ? 'var(--bad)' : 'var(--good)';
    var sn    = aba==='pagar' ? '−' : '+';
    var ip    = it.status==='pendente';
    var fid   = q(it.id);

    linhas += '<div data-fid="'+fid+'" onclick="fluxoToggleExpand(this.dataset.fid)" style="display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;">';
    if (modoSel) {
      linhas += '<input type="checkbox" '+(sel[it.id]?'checked':'')+' onclick="event.stopPropagation()" data-fid="'+fid+'" onchange="fluxoToggleSel(this.dataset.fid)" style="width:18px;height:18px;flex:none;accent-color:var(--accent);">';
    }
    linhas += '<div style="flex:1;min-width:0;">'
      +'<div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(it.descricao)+'</div>'
      +'<div style="color:var(--ink-faint);font-size:12px;">'+(it.dataVencimento?fmtData(it.dataVencimento):'—')+((it.fornecedor||it.cliente)?' · '+esc(it.fornecedor||it.cliente||''):'')+(catL[it.categoria]?' · '+catL[it.categoria]:'')+' </div>'
      +'</div>';
    linhas += '<div style="text-align:right;flex:none;"><div style="font-weight:700;color:'+vc+';">'+sn+brl(it.valor)+'</div><div style="font-size:11px;color:'+sc+';">'+sl+'</div></div>';
    linhas += '<span style="color:var(--ink-faint);font-size:10px;margin-left:2px;">'+(isExp?'▲':'▼')+'</span>';
    linhas += '</div>';

    if (isExp) {
      linhas += '<div style="display:flex;gap:8px;padding:8px 0 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);">';
      if (aba==='pagar') {
        linhas += ip
          ? '<button class="btn btn-primary btn-sm" data-fid="'+fid+'" onclick="fluxoPagarItem(this.dataset.fid)">✓ Pagar</button>'
          : '<button class="btn btn-ghost btn-sm" data-fid="'+fid+'" onclick="fluxoEstornarItem(this.dataset.fid)">↩ Estornar</button>';
      } else {
        linhas += ip
          ? '<button class="btn btn-primary btn-sm" data-fid="'+fid+'" onclick="fluxoReceberItem(this.dataset.fid)">💰 Receber</button>'
          : '<button class="btn btn-ghost btn-sm" data-fid="'+fid+'" onclick="fluxoEstornarItem(this.dataset.fid)">↩ Estornar</button>';
      }
      linhas += '<button class="btn btn-ghost btn-sm" data-fid="'+fid+'" onclick="fluxoEditarItem(this.dataset.fid)">'+ICONS.edit+' Editar</button>';
      linhas += '<button class="btn btn-ghost btn-sm" style="color:var(--bad);" data-fid="'+fid+'" onclick="fluxoExcluirItem(this.dataset.fid)">'+ICONS.trash+'</button>';
      linhas += '<button class="btn btn-ghost btn-sm" onclick="fluxoSelecionarModo()">☑ Vários</button>';
      linhas += '</div>';
    } else {
      linhas += '<div style="border-bottom:1px solid var(--line);"></div>';
    }
  }

  var h = '';
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">';
  h += '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;"><div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">Saldo</div><div style="font-weight:700;font-size:16px;color:'+(saldo>=0?'var(--good)':'var(--bad)')+';">'+brl(saldo)+'</div></div>';
  h += '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;"><div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">A Pagar</div><div style="font-weight:700;font-size:16px;color:var(--bad);">'+brl(pendP)+'</div></div>';
  h += '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;"><div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">A Receber</div><div style="font-weight:700;font-size:16px;color:var(--good);">'+brl(pendR)+'</div></div>';
  h += '</div>';

  h += '<div style="display:flex;gap:0;margin-bottom:0;border-bottom:2px solid var(--line);">';
  h += '<button onclick="state.fluxoAba=\'pagar\';state.fluxoSelecionados={};state.fluxoExpanded=null;render();" style="flex:1;padding:10px;background:none;border:none;border-bottom:2px solid '+(aba==='pagar'?'var(--accent)':'transparent')+';color:'+(aba==='pagar'?'var(--accent)':'var(--ink-soft)')+';font-weight:600;cursor:pointer;margin-bottom:-2px;">A Pagar ('+o.contasPagar.length+')</button>';
  h += '<button onclick="state.fluxoAba=\'receber\';state.fluxoSelecionados={};state.fluxoExpanded=null;render();" style="flex:1;padding:10px;background:none;border:none;border-bottom:2px solid '+(aba==='receber'?'var(--accent)':'transparent')+';color:'+(aba==='receber'?'var(--accent)':'var(--ink-soft)')+';font-weight:600;cursor:pointer;margin-bottom:-2px;">A Receber ('+o.contasReceber.length+')</button>';
  h += '</div>';

  h += '<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;">';
  if (modoSel) {
    h += '<input type="checkbox" '+(todosOk?'checked':'')+' onchange="fluxoSelecionarTodos('+(todosOk?'false':'true')+')" style="width:18px;height:18px;accent-color:var(--accent);">';
    h += '<span style="color:var(--ink-faint);font-size:12px;">'+selIds.length+' selecionado(s)</span>';
    h += '<div style="flex:1;"></div>';
    if (aba==='pagar') {
      if (temSel) h += '<button class="btn btn-primary btn-sm" onclick="fluxoPagarSelecionados()">✓ Pagar</button>';
      if (temSel) h += '<button class="btn btn-ghost btn-sm" onclick="fluxoExcluirSelecionados()" style="color:var(--bad);">'+ICONS.trash+'</button>';
    } else {
      if (temSel) h += '<button class="btn btn-primary btn-sm" onclick="fluxoReceberSelecionados()">✓ Receber</button>';
      if (temSel) h += '<button class="btn btn-ghost btn-sm" onclick="fluxoExcluirSelecionados()" style="color:var(--bad);">'+ICONS.trash+'</button>';
    }
    h += '<button class="btn btn-ghost btn-sm" onclick="fluxoSelecionarModo()">✕ Cancelar</button>';
  } else {
    h += '<div style="flex:1;"></div>';
    if (aba==='pagar') {
      h += '<button class="btn btn-ghost btn-sm" onclick="irTab(\'gastos\')">+ Lançar Gasto</button>';
    } else {
      h += '<button class="btn btn-ghost btn-sm" onclick="abrirModalContaReceberFluxo(\''+o.id+'\')">+ Novo Recebimento</button>';
    }
  }
  h += '</div>';

  h += lista.length ? '<div>'+linhas+'</div>' : '<div style="color:var(--ink-faint);text-align:center;padding:32px 0;">Nenhum lançamento.</div>';
  return h;
}


/* ── Ações em lote Fluxo ── */
function fluxoEditarItem(id) {
  const o = getObra(); if (!o) return;
  const aba = state.fluxoAba || 'pagar';
  if (aba === 'pagar') {
    const cp = (o.contasPagar||[]).find(x=>x.id===id);
    if (!cp) return;
    state.modal = {
      tipo: 'nova-conta-pagar',
      obraId: o.id,
      editId: id,
      descricao: cp.descricao,
      fornecedor: cp.fornecedor||'',
      valor: String(cp.valor),
      dataEmissao: cp.dataEmissao||todayISO(),
      dataVencimento: cp.dataVencimento||'',
      categoria: cp.categoria||'material',
      etapaId: cp.etapaId||'',
      notaFiscal: cp.notaFiscal||'',
      observacao: cp.observacao||'',
    };
  } else {
    const cr = (o.contasReceber||[]).find(x=>x.id===id);
    if (!cr) return;
    state.modal = {
      tipo: 'nova-conta-receber-fluxo',
      obraId: o.id,
      editId: id,
      descricao: cr.descricao,
      valor: String(cr.valor),
      dataEmissao: cr.dataEmissao||todayISO(),
      dataVencimento: cr.dataVencimento||'',
      categoria: cr.categoria||'medicao',
      observacao: cr.observacao||'',
    };
  }
  render();
}

function trabToggleExpand(id) {
  state.trabExpanded = state.trabExpanded === id ? null : id;
  render();
}
function fluxoToggleExpand(id) {
  state.fluxoExpanded = state.fluxoExpanded === id ? null : id;
  render();
}
function fluxoSelecionarModo() {
  state.fluxoModoSel = !state.fluxoModoSel;
  state.fluxoSelecionados = {};
  state.fluxoExpanded = null;
  render();
}
function fluxoPagarItem(id) {
  const o = getObra(); if (!o) return;
  const cp = (o.contasPagar||[]).find(x=>x.id===id);
  if (cp) {
    cp.status='pago'; cp.dataPagamento=todayISO(); cp.formaPagamento='PIX';
    /* FIX5: Sync to gastos */
    if (cp.origem === 'gasto' && cp.origemId) {
      const g = (o.gastos||[]).find(x=>x.id===cp.origemId);
      if (g) g.statusPagamento = 'pago';
    }
  }
  state.fluxoExpanded = null;
  salvar(); render();
  toast('Conta paga ✓');
}
function fluxoReceberItem(id) {
  const o = getObra(); if (!o) return;
  const cr = (o.contasReceber||[]).find(x=>x.id===id);
  if (cr) {
    cr.status='recebido';
    cr.dataRecebimento=todayISO();
    cr.formaPagamento='PIX';
    /* Registra em recebimentos do cliente para aparecer no Financeiro */
    o.recebimentos = o.recebimentos || [];
    const jaExiste = o.recebimentos.find(r=>r.origemId===id);
    if (!jaExiste) {
      o.contadores = o.contadores || {};
      o.contadores.recebimento = (o.contadores.recebimento||0)+1;
      o.recebimentos.push({
        id: uid(),
        numero: String(o.contadores.recebimento).padStart(4,'0'),
        valor: cr.valor,
        data: todayISO(),
        formaPagamento: 'PIX',
        observacao: cr.descricao,
        comprovanteNro: 'CR-'+(cr.numero||''),
        origemId: id,
      });
    }
  }
  state.fluxoExpanded = null;
  salvar(); render();
  toast('Recebimento confirmado ✓ — registrado no Financeiro');
}
function fluxoEstornarItem(id) {
  const o = getObra(); if (!o) return;
  const aba = state.fluxoAba || 'pagar';
  if (aba==='pagar') {
    const cp = (o.contasPagar||[]).find(x=>x.id===id);
    if (cp) { cp.status='pendente'; cp.dataPagamento=''; }
  } else {
    const cr = (o.contasReceber||[]).find(x=>x.id===id);
    if (cr) { cr.status='pendente'; cr.dataRecebimento=''; }
  }
  state.fluxoExpanded = null;
  salvar(); render();
  toast('Estornado');
}
function fluxoExcluirItem(id) {
  const o = getObra(); if (!o) return;
  const aba = state.fluxoAba || 'pagar';
  _confirmar('Excluir este lançamento?', function() {
    if (aba==='pagar') o.contasPagar = (o.contasPagar||[]).filter(x=>x.id!==id);
    else o.contasReceber = (o.contasReceber||[]).filter(x=>x.id!==id);
    state.fluxoExpanded = null;
    salvar(); render();
    toast('Lançamento excluído');
  });
}
function fluxoToggleSel(id) {
  state.fluxoSelecionados = state.fluxoSelecionados || {};
  state.fluxoSelecionados[id] = !state.fluxoSelecionados[id];
  render();
}
function fluxoSelecionarTodos(val) {
  const o = getObra();
  if (!o) return;
  const aba = state.fluxoAba || 'pagar';
  const lista = aba === 'pagar' ? (o.contasPagar||[]) : (o.contasReceber||[]);
  state.fluxoSelecionados = {};
  if (val) lista.forEach(x => { state.fluxoSelecionados[x.id] = true; });
  render();
}
function fluxoPagarSelecionados() {
  const o = getObra(); if (!o) return;
  const sel = Object.keys(state.fluxoSelecionados||{}).filter(id=>state.fluxoSelecionados[id]);
  if (!sel.length) return;
  sel.forEach(id => {
    const cp = (o.contasPagar||[]).find(x=>x.id===id);
    if (cp && cp.status==='pendente') {
      cp.status='pago'; cp.dataPagamento=todayISO(); cp.formaPagamento='PIX';
      /* FIX5: Sync status back to o.gastos if origin is 'gasto' */
      if (cp.origem === 'gasto' && cp.origemId) {
        const g = (o.gastos||[]).find(x=>x.id===cp.origemId);
        if (g) g.statusPagamento = 'pago';
      }
      /* FIX5: done */
    }
  });
  state.fluxoSelecionados = {};
  salvar(); render();
  toast(sel.length + ' conta(s) marcada(s) como paga(s)');
}
function fluxoReceberSelecionados() {
  const o = getObra(); if (!o) return;
  const sel = Object.keys(state.fluxoSelecionados||{}).filter(id=>state.fluxoSelecionados[id]);
  if (!sel.length) return;
  o.recebimentos = o.recebimentos || [];
  o.contadores = o.contadores || {};
  sel.forEach(id => {
    const cr = (o.contasReceber||[]).find(x=>x.id===id);
    if (cr && cr.status!=='recebido') {
      cr.status='recebido'; cr.dataRecebimento=todayISO(); cr.formaPagamento='PIX';
      const jaExiste = o.recebimentos.find(r=>r.origemId===id);
      if (!jaExiste) {
        o.contadores.recebimento = (o.contadores.recebimento||0)+1;
        o.recebimentos.push({
          id: uid(), numero: String(o.contadores.recebimento).padStart(4,'0'),
          valor: cr.valor, data: todayISO(), formaPagamento: 'PIX',
          observacao: cr.descricao, comprovanteNro: 'CR-'+(cr.numero||''), origemId: id,
        });
      }
    }
  });
  state.fluxoSelecionados = {};
  salvar(); render();
  toast(sel.length + ' recebimento(s) confirmado(s) — registrado no Financeiro');
}
function fluxoExcluirSelecionados() {
  const o = getObra(); if (!o) return;
  const sel = Object.keys(state.fluxoSelecionados||{}).filter(id=>state.fluxoSelecionados[id]);
  if (!sel.length || !confirm('Excluir ' + sel.length + ' item(s) selecionado(s)?')) return;
  const aba = state.fluxoAba || 'pagar';
  if (aba==='pagar') o.contasPagar = (o.contasPagar||[]).filter(x=>!sel.includes(x.id));
  else o.contasReceber = (o.contasReceber||[]).filter(x=>!sel.includes(x.id));
  state.fluxoSelecionados = {};
  salvar(); render();
  toast(sel.length + ' item(s) excluído(s)');
}


function renderModalFluxo(modal) {
  if (modal.tipo === 'nova-conta-receber') {
    return '' +
    '<h3>Nova Conta a Receber 💰</h3>' +
    '<div class="grid grid-2" style="gap:12px;">' +
      '<div class="field" style="grid-column:1/-1;"><label>Descrição *</label><input id="cr-desc" placeholder="Ex.: Recebimento MED-002 — Cliente" value="' + esc(modal.descricao || '') + '"></div>' +
      '<div class="field"><label>Valor (R$) *</label><input id="cr-valor" type="text" inputmode="decimal" placeholder="0,00" value="' + (modal.valor ? modal.valor : '') + '" onfocus="this.select()"></div>' +
      '<div class="field"><label>Data de Vencimento *</label><input id="cr-venc" type="date" value="' + (modal.dataVencimento || '') + '"></div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:20px;justify-content:flex-end;">' +
      '<button class="btn btn-ghost" onclick="fecharModal()">Cancelar</button>' +
      '<button class="btn btn-primary" onclick="confirmarContaReceber()">Lançar no Fluxo de Caixa</button>' +
    '</div>';
  }
  if (modal.tipo === 'nova-conta-pagar') {

      '<div class="field" style="grid-column:1/-1;"><label>Vencimento (Data de Pagamento) *</label><input id="ff-venc" type="date" value="' + (modal.vencimento || '') + '"></div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +

      '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'ff-inicio\').value=calcPeriodoPadrao(\'mensal\').inicio; document.getElementById(\'ff-fim\').value=calcPeriodoPadrao(\'mensal\').fim;">Mensal</button>' +
      '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'ff-inicio\').value=todayISO(); document.getElementById(\'ff-fim\').value=todayISO();">Hoje (Diário)</button>' +

      '<button class="btn btn-primary" onclick="confirmarFecharFolha()">Calcular e Lançar Folha</button>' +
    '</div>';
  }
  return null;
}

function calcPeriodoPadrao(tipo) {
  const hoje = new Date();
  if (tipo === 'quinzenal') {
    const d = hoje.getDate();
    if (d <= 15) {
      const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
      return { inicio: ini.toISOString().slice(0, 10), fim: new Date(hoje.getFullYear(), hoje.getMonth(), 15).toISOString().slice(0, 10) };
    } else {
      const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 16);
      const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
      return { inicio: ini.toISOString().slice(0, 10), fim: fim.toISOString().slice(0, 10) };
    }
  }
  // mensal
  const ini = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const fim = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
  return { inicio: ini.toISOString().slice(0, 10), fim: fim.toISOString().slice(0, 10) };
}
