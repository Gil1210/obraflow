<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap');
:root{
  --bg:#101317; --bg-card:#171B21; --bg-sunken:#1E242B;
  --ink:#EDF0F3; --ink-soft:#A2ABB5; --ink-faint:#939DA8;
  --line:#242A32; --line-strong:#333B45;
  --accent:#22B07D; --accent-dark:#189067; --accent-light:#5FD3A9; --accent-soft:rgba(34,176,125,0.14);
  --good:#22B07D; --good-soft:rgba(34,176,125,0.14);
  --warn:#D9A441; --warn-soft:rgba(217,164,65,0.14);
  --bad:#E0685E; --bad-soft:rgba(224,104,94,0.14);
  --sidebar-start:#0B0E11; --sidebar-end:#0B0E11;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-hover:0 12px 30px rgba(0,0,0,.5);
  --font:'Public Sans',system-ui,sans-serif; --font-head:'Outfit',system-ui,sans-serif;
  --size-lg:18px; --size-md:14px; --size-sm:12px;
  --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);}
html{font-size:var(--size-md);}
html,body{background:var(--bg);color:var(--ink);font-size:var(--size-md);min-height:100vh;-webkit-font-smoothing:antialiased;}
#app{min-height:100vh;}
button,input,select,textarea{font-family:inherit;cursor:pointer;font-size:var(--size-md);color:var(--ink);border:none;outline:none;}
::selection{background:var(--accent-soft);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:20px;border:3px solid var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--ink-faint);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
h1,h2,h3,.logo,.kpi .val,.modal h3,.topbar h1,.val-destaque{font-family:var(--font-head);font-size:var(--size-lg);color:var(--ink);letter-spacing:-.015em;font-weight:600;line-height:1.25;}
.shell{display:flex;min-height:100vh;overflow-x:hidden;}
.side{width:250px;flex:none;background:var(--sidebar-start);color:#EDF0F3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:50;border-right:1px solid #1C2128;}
.side-backdrop{display:none;}
.hamb{display:none;background:none;border:none;color:var(--ink);padding:6px;margin-right:10px;}
.side-brand{padding:22px 20px 18px;}
.side-brand .logo{font-family:var(--font-head);color:#EDF0F3;font-size:21px;letter-spacing:-.03em;font-weight:700;}
.side-brand .logo em{color:#5FD3A9;font-style:normal;font-weight:500;font-size:11px;display:block;margin-top:2px;letter-spacing:.14em;text-transform:uppercase;}
.side-nav{flex:1;overflow-y:auto;padding:8px 12px;}
.side-section-label{letter-spacing:.1em;text-transform:uppercase;color:#8B949E;margin:20px 12px 8px;font-size:11px;font-weight:600;}
.side-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:calc(var(--radius) - 2px);color:#9AA3AD;cursor:pointer;margin-bottom:2px;transition:background .15s,color .15s;font-size:var(--size-md);font-weight:500;}
.side-item:hover{background:rgba(255,255,255,.05);color:#EDF0F3;}
.side-item.active{background:rgba(34,176,125,0.16);color:#5FD3A9;font-weight:600;}
.side-item svg{flex:none;opacity:.9;stroke-width:1.75;}
.side-foot{padding:16px 20px;border-top:1px solid #1C2128;color:#8B949E;font-size:12px;}
.rpt-menu{position:relative;display:inline-block;}
.rpt-fab{display:none!important;}
.rpt-fab:hover{transform:scale(1.07);}
.rpt-panel{position:fixed;top:64px;right:8px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.22);min-width:210px;padding:6px;display:none;z-index:9999;}
.rpt-panel.open{display:block;}
.rpt-panel-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);padding:6px 10px 4px;}
.rpt-item{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--ink-soft);transition:background .12s;}
.rpt-item:hover{background:var(--bg-sunken);color:var(--ink);}
.rpt-item svg,.rpt-item i{width:16px;height:16px;font-size:16px;color:var(--ink-faint);}
.obra-tabs{display:flex;align-items:center;gap:2px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:0 16px;border-bottom:1px solid var(--line);background:var(--bg-card);flex-shrink:0;}
.obra-tabs::-webkit-scrollbar{display:none;}
.obra-tab{display:flex;align-items:center;gap:5px;padding:7px 10px;font-size:11px;font-weight:600;color:var(--ink-faint);cursor:pointer;white-space:nowrap;border-radius:8px;border-bottom:none;margin-bottom:0;transition:color .15s,background .15s;flex-shrink:0;}
.obra-tab:hover{color:var(--ink);background:var(--bg-sunken);}
.obra-tab.active{color:var(--accent);background:var(--accent-soft);font-weight:700;border-bottom:none;}
.obra-tab svg,.obra-tab i{width:15px;height:15px;font-size:15px;opacity:.7;}
.obra-tab.active svg,.obra-tab.active i{opacity:1;}
.obra-tab-more{position:relative;}
.obra-tab-dropdown{position:fixed;top:auto;right:auto;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);z-index:9999;min-width:180px;padding:6px;display:none;}
.obra-tab-dropdown.open{display:block;} /* controlled by JS */
.obra-tab-dropdown .dd-item{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:13px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-radius:calc(var(--radius)-2px);transition:background .12s;}
.obra-tab-dropdown .dd-item:hover{background:var(--bg-sunken);color:var(--ink);}
.obra-tab-dropdown .dd-item.active{color:var(--accent);font-weight:600;}
.main-inner{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden;}
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{height:64px;flex:none;background:var(--bg-card);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10;;overflow:visible;}
.topbar h1{margin:0;letter-spacing:-.02em;color:var(--ink);}
.topbar .sub{color:var(--ink-faint);margin-top:1px;font-size:12px;}
.content{flex:1;padding:26px;padding-bottom:80px;max-width:1240px;width:100%;margin:0 auto;}
.card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);color:var(--ink);display:flex;flex-direction:column;justify-content:space-between;word-break:break-word;}
.content>.card+.card{margin-top:16px;}
.grid{display:grid;gap:16px;align-items:stretch;}
.grid>*{margin-top:0!important;height:100%;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-5{grid-template-columns:repeat(5,1fr);}
@media(max-width:1024px){.grid-5,.grid-4{grid-template-columns:repeat(2,1fr);}}
@media(max-width:860px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr;}}
h2.section-title{font-family:var(--font-head);margin:0 0 14px;display:flex;align-items:center;gap:9px;color:var(--ink);font-size:var(--size-lg);letter-spacing:-.02em;}
h2.section-title .bar{width:5px;height:18px;background:var(--accent);border-radius:3px;display:inline-block;}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:calc(var(--radius) - 2px);padding:10px 17px;border:1px solid transparent;white-space:nowrap;transition:all .15s;font-size:var(--size-md);font-weight:600;font-family:var(--font-head);letter-spacing:-.01em;}
.btn svg{stroke-width:1.75;}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:none;}
.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
.btn-ghost{background:var(--bg-card);color:var(--ink-soft);border-color:var(--line-strong);}
.btn-ghost:hover{background:var(--bg-sunken);color:var(--ink);}
.btn-sm{padding:7px 13px;font-size:13px;}
.btn-danger{background:var(--bad-soft);color:var(--bad);border-color:transparent;}
.btn-danger:hover{background:var(--bad);color:#fff;}
.btn-wsp{background:var(--good-soft);color:var(--good);border-color:transparent;}
.btn-wsp:hover{background:var(--good);color:#fff;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{color:var(--ink-soft);font-size:12px;font-weight:600;letter-spacing:0;}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);border-radius:calc(var(--radius) - 2px);padding:10px 13px;color:var(--ink)!important;background:var(--bg-card)!important;min-width:0;transition:all .15s;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft);}
.field .hint{color:var(--ink-faint);font-size:12px;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-warn{background:var(--warn-soft);color:var(--warn);}
.badge-bad{background:var(--bad-soft);color:var(--bad);}
.badge-neutral{background:var(--bg-sunken);color:var(--ink-soft);}
.kpi{position:relative;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;height:100%;}
.kpi .lbl{color:var(--ink-soft);font-size:13px;font-weight:600;letter-spacing:0;white-space:normal;line-height:1.3;margin-bottom:4px;}
.kpi .val{margin-top:0;letter-spacing:-.02em;color:var(--ink);font-weight:700;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kpi .sub-text{color:var(--ink-faint);margin-top:5px;font-size:12px;}
.kpi .tag-top{position:absolute;top:10px;right:10px;background:var(--bg-sunken);color:var(--ink-soft);padding:2px 7px;border-radius:99px;font-size:10px;font-weight:600;}
.card-obra{cursor:pointer;background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:space-between;height:100%;transition:transform .18s,box-shadow .18s,border-color .18s;}
.card-obra:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:var(--line-strong);}
.card-obra .obra-header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px;}
.card-obra .obra-cliente{color:var(--ink-faint);font-size:13px;}
.card-obra .obra-footer{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line);}
.card-obra .obra-footer .contrato{min-width:0;line-height:1.5;}
.card-obra .obra-footer .contrato{color:var(--ink-faint);font-size:12px;}
.card-obra .obra-footer .contrato span{color:var(--ink);font-weight:700;font-family:var(--font-head);font-size:15px;letter-spacing:-.02em;}
.card-obra .progress-container{margin-top:12px;}
.card-obra .progress-track{height:7px;border-radius:99px;background:var(--bg-sunken);overflow:hidden;}
.card-obra .progress-fill{transition:width .4s ease;height:100%;border-radius:99px;background:var(--accent);}
.card-obra .progress-labels{display:flex;justify-content:space-between;color:var(--ink-faint);margin-top:6px;font-size:12px;}
.tbl-responsive{width:100%;overflow-x:auto;margin-top:10px;}
table.tbl{width:100%;border-collapse:collapse;margin-top:4px;}
table.tbl th{padding:10px 13px;border-bottom:1px solid var(--line-strong);color:var(--ink-faint);font-size:12px;font-weight:600;vertical-align:middle;white-space:nowrap;text-align:left;}
table.tbl td{padding:13px;border-bottom:1px solid var(--line);color:var(--ink);font-size:var(--size-md);vertical-align:middle;}
table.tbl tr:hover td{background:var(--bg-sunken);}
table.tbl th.col-desc,table.tbl td.col-desc{text-align:left;min-width:220px;width:35%;word-break:break-word;}
table.tbl th.col-num,table.tbl td.col-num{text-align:right;white-space:nowrap;min-width:110px;font-variant-numeric:tabular-nums;}
table.tbl th.col-center,table.tbl td.col-center{text-align:center;white-space:nowrap;}
.empty{text-align:center;padding:46px 20px;color:var(--ink-faint);}
.empty svg{opacity:.3;margin-bottom:12px;stroke-width:1.5;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--bg-card);border-radius:calc(var(--radius) + 4px);max-width:580px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;color:var(--ink);border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.22);}
.modal h3{margin:0 0 18px;color:var(--ink);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#101317;padding:12px 22px;border-radius:99px;z-index:200;font-size:var(--size-md);font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.2);}
.hero-banner{background:linear-gradient(120deg,#1A2A24,#171B21);border-radius:calc(var(--radius) + 2px);padding:28px 30px;color:#EDF0F3;margin-bottom:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.hero-banner h2{margin:0 0 5px;color:#EDF0F3!important;font-family:var(--font-head);letter-spacing:-.03em;font-size:24px;}
.hero-banner p{color:rgba(237,240,243,.6);margin:0;font-size:var(--size-md);}
.hero-banner .hero-actions{display:flex;gap:10px;flex-wrap:wrap;}
.hero-banner .btn-hero{font-family:var(--font-head);font-weight:600;background:rgba(255,255,255,.07);color:#EDF0F3;border:1px solid rgba(255,255,255,.16);border-radius:calc(var(--radius) - 2px);padding:10px 18px;transition:all .15s;font-size:var(--size-md);}
.hero-banner .btn-hero:hover{background:#EDF0F3;color:#101317;border-color:#EDF0F3;}
.hero-banner .btn-hero-primary{background:#EDF0F3;color:#101317;border-color:#EDF0F3;}
.hero-banner .btn-hero-primary:hover{opacity:.88;}
.welcome-empty{text-align:center;padding:56px 20px;}
.welcome-empty .icon-big{opacity:.22;margin-bottom:18px;}
.welcome-empty p{color:var(--ink-soft);max-width:440px;margin:0 auto 22px;}
.search-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
.search-input{flex:1;min-width:200px;border:1px solid var(--line-strong);border-radius:calc(var(--radius) - 2px);padding:10px 13px;background:var(--bg-card)!important;color:var(--ink)!important;}
.search-input:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft);}
.filter-tabs{display:flex;gap:3px;background:var(--bg-sunken);padding:4px;border-radius:calc(var(--radius) - 1px);}
.filter-btn{border:none;background:transparent;padding:7px 14px;border-radius:calc(var(--radius) - 4px);color:var(--ink-soft);cursor:pointer;font-size:13px;font-weight:600;transition:all .15s;font-family:var(--font-head);}
.filter-btn:hover{color:var(--ink);}
.filter-btn.active{background:var(--bg-card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.foto-lightbox{position:fixed;inset:0;background:rgba(10,12,14,.94);z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.card{animation:fadeIn .22s ease;}
@media(max-width:860px){
  .grid-5{grid-template-columns:repeat(3,1fr)!important;}
  .grid-4{grid-template-columns:repeat(2,1fr)!important;}
  .grid-3{grid-template-columns:repeat(3,1fr)!important;}
  .grid-2{grid-template-columns:1fr!important;}
  .side{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);transition:transform .22s ease;z-index:60;width:260px;}
  .side.open{transform:translateX(0);}
  .side-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55;}
  .side-backdrop.open{display:block;}
  .hamb{display:inline-flex;align-items:center;}
  .hide-mobile{display:none;}
  .content{padding:14px!important;padding-bottom:100px!important;}
  .topbar{padding:0 14px!important;height:58px!important;}
  .topbar h1{font-size:16px!important;}
  .modal-bg{padding:8px;}
  .modal{max-height:92vh;}
  input,select,textarea{font-size:16px!important;}
  .kpi .val{font-size:22px!important;}
  .card{padding:16px;}
  .tbl-responsive{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:8px;}
  table.tbl{min-width:540px;}
  .filter-tabs{flex-wrap:wrap;width:100%;}
  .filter-btn{flex:1;text-align:center;}
  .hero-banner{flex-direction:column;align-items:flex-start;}
  .hero-banner .hero-actions{width:100%;}
  .hero-banner .hero-actions .btn{width:100%;justify-content:center;}
  .section-title-row{flex-wrap:wrap;gap:8px;}
  .section-title-row .btn{width:100%;}
  .search-bar{flex-direction:column;}
  .search-input{min-width:0;width:100%;}
  .card-obra .obra-header{flex-direction:column;}
  .grid.grid-2>.card{min-width:0;}
  .kpi .val{font-size:18px!important;}
  table.tbl th,table.tbl td{padding:9px 8px;}
  .modal .grid.grid-3{grid-template-columns:repeat(3,1fr)!important;}
  .topbar{gap:6px;}
  .topbar h1{font-size:14px!important;}
  .topbar .btn{padding:6px 8px!important;font-size:11px!important;white-space:nowrap;}
  .topbar .btn svg{width:13px;height:13px;}
}
@media(max-width:500px){
  .card{background:transparent!important;border:none!important;box-shadow:none!important;border-radius:0!important;padding:10px 0!important;border-bottom:1px solid var(--line)!important;}
  .card:last-child{border-bottom:none!important;}
  .content>.card+.card{margin-top:0!important;}
  .card-obra{background:transparent!important;border:none!important;box-shadow:none!important;border-radius:0!important;padding:10px 0!important;border-bottom:1px solid var(--line)!important;height:auto!important;}
  .grid{gap:4px!important;}
  .grid-5{grid-template-columns:repeat(2,1fr)!important;}
  .grid-4{grid-template-columns:repeat(2,1fr)!important;}
  .grid-3{grid-template-columns:repeat(2,1fr)!important;}
  .grid-2{grid-template-columns:1fr!important;}
  .kpi{background:transparent!important;border:none!important;box-shadow:none!important;padding:6px 2px!important;height:auto!important;}
  .kpi .lbl{font-size:12px!important;font-weight:600!important;color:var(--ink-soft)!important;line-height:1.2!important;margin-bottom:2px!important;}
  .kpi .val{font-size:11px!important;font-weight:700!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
  .kpi .sub-text{font-size:9px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;}
  .kpi .tag-top{display:none!important;}
  .modal{margin:4px!important;max-height:95vh!important;width:calc(100% - 8px)!important;}
  .modal .grid.grid-4{grid-template-columns:repeat(2,1fr)!important;}
  .modal .grid.grid-3{grid-template-columns:repeat(3,1fr)!important;}
  .modal .grid.grid-2{grid-template-columns:repeat(2,1fr)!important;}
  .modal .btn{width:100%;justify-content:center;margin-bottom:2px;}
  table.tbl{min-width:280px;}
  table.tbl th,table.tbl td{padding:7px 6px;font-size:11px;}
  .hero-banner{padding:16px;}
  .btn{padding:9px 10px;font-size:12px;}
  .topbar .btn{padding:6px 8px!important;font-size:11px!important;white-space:nowrap;}
  .obra-tabs{padding:0 8px;}
  .obra-tab span{display:none;}
  .obra-tab{padding:9px 10px;}
  .obra-tab-more span{display:inline!important;}
}
@media(max-width:480px){

}

function m2ExecutadoEtapa(obra,etapaId){let t=0;(obra.apontamentos||[]).forEach(a=>{(a.progresso||[]).forEach(p=>{if(p.etapaId===etapaId)t+=Number(p.m2Executado)||0;});});return t;}
function pctAtualEtapa(obra,etapaId){const e=(obra.etapas||[]).find(x=>x.id===etapaId);if(!e)return 0;const m2=m2ExecutadoEtapa(obra,etapaId),prev=Number(e.metragemPrevista)||0;if(prev>0)return clamp(Math.round((m2/prev)*10000)/100,0,100);return m2>0?(m2<=100?clamp(m2,0,100):100):0;}
function pesoEtapa(obra,etapa){if(!obra.etapas||!obra.etapas.length)return 0;const s=obra.etapas.reduce((a,e)=>a+(Number(e.metragemPrevista)||0),0);if(s>0)return(Number(etapa.metragemPrevista)||0)/s;return 1/obra.etapas.length;}
function valorPrevistoEtapa(obra,etapa){if(obra.precificacaoFixa||etapa.valorFixo!=null)return Number(etapa.valorFixo)||0;return pesoEtapa(obra,etapa)*valorContratoAtual(obra);}
function pctFisicoGeral(obra){if(!obra.etapas||!obra.etapas.length)return 0;let t=0;obra.etapas.forEach(e=>{t+=pesoEtapa(obra,e)*pctAtualEtapa(obra,e.id);});return clamp(t,0,100);}
function pctPrazoConsumido(obra){const dt=Math.max(1,dayNum(obra.contrato.dataFimPrevista)-dayNum(obra.contrato.dataInicio)),dd=clamp(dayNum(todayISO())-dayNum(obra.contrato.dataInicio),0,dt);return Math.round((dd/dt)*100);}
function valorLiberadoEtapa(obra,etapaId){let t=0;(obra.medicoes||[]).filter(m=>m.status==='aprovada').forEach(m=>{const it=(m.itens||[]).find(i=>i.etapaId===etapaId);if(it)t+=Number(it.valorLiberado)||0;});return t;}
function valorTotalLiberado(obra){return(obra.medicoes||[]).filter(m=>m.status==='aprovada').reduce((a,m)=>{const te=(m.itens||[]).reduce((s,i)=>s+(Number(i.valorLiberado)||0),0);const ta=(m.itensAvulsos||[]).reduce((s,i)=>s+(i.tipo==='deducao'?-Number(i.valor):Number(i.valor)),0);return a+te+ta;},0);}
function totalAditivosAcrescimo(obra){return(obra.aditivos||[]).filter(a=>a.tipo!=='deducao').reduce((s,a)=>s+(Number(a.valorAjuste)||0),0);}
function totalAditivosDeducao(obra){return(obra.aditivos||[]).filter(a=>a.tipo==='deducao').reduce((s,a)=>s+(Number(a.valorAjuste)||0),0);}
function valorContratoAtual(obra){return Math.max(0,(Number(obra.contrato.valor)||0)+totalAditivosAcrescimo(obra)-totalAditivosDeducao(obra));}
function totalRecebidoCliente(obra){return(obra.recebimentos||[]).reduce((s,r)=>s+(Number(r.valor)||0),0);}
function saldoEmAbertoCliente(obra){return valorContratoAtual(obra)-totalRecebidoCliente(obra);}
function totalGastosCompras(obra){return(obra.gastos||[]).reduce((s,g)=>s+(Number(g.valor)||0),0);}
function totalGastosMaoDeObra(obra){
  let t=0;
  (obra.apontamentos||[]).forEach(a=>{(a.presencasTrabalhadores||[]).forEach(pt=>{const tr=(obra.trabalhadores||[]).find(x=>x.id===pt.trabalhadorId);const vd=pt.valorDiaria!=null?Number(pt.valorDiaria):(tr?Number(tr.valorDiaria):0);if(pt.presente&&vd>0)t+=vd;});});
  (obra.trabalhadores||[]).forEach(tr=>{(tr.diasAvulsos||[]).forEach(da=>{if(da.presente!==false)t+=Number(da.valorDiaria)||Number(tr.valorDiaria)||0;});});
  return t;
}
function totalGastosReais(obra){return totalGastosCompras(obra)+totalGastosMaoDeObra(obra);}
function margemLucroReal(obra){return valorContratoAtual(obra)-totalGastosReais(obra);}
function etapaAtrasada(obra,etapa){return pctAtualEtapa(obra,etapa.id)<100&&etapa.dataFimPrev&&etapa.dataFimPrev<todayISO();}
function obraTemAtraso(obra){return(obra.etapas||[]).some(e=>etapaAtrasada(obra,e));}

function salvarApontamento(obraId,dados,editId){
  const o=getObra(obraId);if(!o)return;
  const ant=editId?(o.apontamentos.find(a=>a.id===editId)||null):null;
  const numSeq=editId?((ant&&ant.numero)||proximoNumero(o,'rdo')):proximoNumero(o,'rdo');
  const reg={id:editId||uid(),numero:numSeq,data:dados.data,clima:dados.clima||'bom',efetivo:dados.efetivo||[],equipamentos:dados.equipamentos||[],progresso:dados.progresso||[],ocorrencias:dados.ocorrencias||'',fotos:dados.fotos||[],presencasTrabalhadores:dados.presencasTrabalhadores||[]};
  if(ant){if(!reg.fotos.length)reg.fotos=ant.fotos||[];if(dados.presencasTrabalhadores===undefined)reg.presencasTrabalhadores=ant.presencasTrabalhadores||[];if(!reg.efetivo.length)reg.efetivo=ant.efetivo||[];if(!reg.equipamentos.length)reg.equipamentos=ant.equipamentos||[];}
  if(editId){o.apontamentos=o.apontamentos.map(a=>a.id===editId?reg:a);}else{o.apontamentos.push(reg);}
  salvar();render();toast('RDO-'+numSeq+' salvo!');
}
function removerApontamento(obraId,id){_confirmar('Excluir este apontamento?',()=>{const o=getObra(obraId);if(!o)return;o.apontamentos=o.apontamentos.filter(a=>a.id!==id);salvar();render();toast('Apontamento excluido');});}

function criarMedicao(obraId,dados){
  const o=getObra(obraId);if(!o)return;
  const idsP=dados.apontamentoIds||o.apontamentos.filter(a=>a.data<=dados.periodoFim).map(a=>a.id);
  const itens=o.etapas.map(e=>{const pct=idsP.length?calcPctFiltrado(o,e,idsP):pctAtualEtapa(o,e.id);const jaL=valorLiberadoEtapa(o,e.id);const vT=valorPrevistoEtapa(o,e);return{etapaId:e.id,pctAcumulado:pct,valorLiberado:+Math.max(0,(pct/100)*vT-jaL).toFixed(2)};});
  const itensAvulsos=(dados.itensAvulsos||[]).filter(i=>i.descricao&&parseMoeda(i.valor)>0).map(i=>({id:uid(),descricao:i.descricao,valor:parseMoeda(i.valor),tipo:i.tipo==='deducao'?'deducao':'acrescimo'}));
  const numSeq=proximoNumero(o,'medicao');
  o.medicoes.push({id:uid(),numero:numSeq,dataEmissao:todayISO(),periodoInicio:dados.periodoInicio,periodoFim:dados.periodoFim,apontamentoIds:idsP,itens,itensAvulsos,status:'aberta'});
  salvar();render();toast('Medicao MED-'+numSeq+' criada');
}
function calcPctFiltrado(obra,etapa,idsP){let t=0;(obra.apontamentos||[]).forEach(a=>{if(idsP.indexOf(a.id)!==-1)(a.progresso||[]).forEach(p=>{if(p.etapaId===etapa.id)t+=Number(p.m2Executado)||0;});});const prev=Number(etapa.metragemPrevista)||0;if(prev>0)return clamp(Math.round((t/prev)*10000)/100,0,100);return t>0?(t<=100?clamp(t,0,100):100):0;}

function aprovarMedicao(obraId,medId){
  const o=getObra(obraId);if(!o)return;const m=o.medicoes.find(x=>x.id===medId);if(!m)return;
  _confirmar('Aprovar MED-'+( m.numero||'')+'? Conta a receber sera criada no Fluxo.',()=>{
    m.status='aprovada';o.contasReceber=o.contasReceber||[];
    if(vM>0&&!o.contasReceber.find(cr=>cr.medicaoId===medId)){
      const vIt=(m.itens||[]).reduce((s,i)=>s+(Number(i.valorLiberado)||0),0);
      const vAv=(m.itensAvulsos||[]).reduce((s,i)=>{const v=parseMoeda(i.valor||'0');return i.tipo==='deducao'?s-v:s+v;},0);
      const vM=+(vIt+vAv).toFixed(2);
      o.contadores=o.contadores||{};o.contadores.contaReceber=(o.contadores.contaReceber||0)+1;
      o.contasReceber.push({id:uid(),numero:String(o.contadores.contaReceber).padStart(4,'0'),descricao:'MED-'+(m.numero||''),valor:vM,dataEmissao:todayISO(),dataVencimento:m.periodoFim||todayISO(),status:'pendente',categoria:'medicao',medicaoId:medId});
      toast('Medicao aprovada — CR de '+brl(vM)+' criada');
    }
    (m.itensAvulsos||[]).forEach(item=>{addAditivo(obraId,{motivo:'MED-'+m.numero+': '+item.descricao,tipo:item.tipo||'acrescimo',valor:parseMoeda(item.valor||'0'),data:todayISO()});});
    salvar();render();
  });
}
function desfazerAprovarMedicao(obraId,medId){
  const o=getObra(obraId);if(!o)return;const m=o.medicoes.find(x=>x.id===medId);if(!m)return;
  _confirmar('Desfazer aprovacao da MED-'+(m.numero||'')+'?',()=>{
    const cr=(o.contasReceber||[]).find(x=>x.medicaoId===medId);
    if(cr){o.recebimentos=(o.recebimentos||[]).filter(r=>r.origemId!==cr.id);o.contasReceber=o.contasReceber.filter(x=>x.medicaoId!==medId);}
    m.status='aberta';
    if(o.aditivos)o.aditivos=o.aditivos.filter(a=>!a.motivo||!a.motivo.startsWith('MED-'+m.numero));
    salvar();render();toast('Medicao estornada');
  });
}
function excluirMedicao(obraId,medId){
  const o=getObra(obraId);if(!o)return;const m=o.medicoes.find(x=>x.id===medId);if(!m)return;
  _confirmar('Excluir MED-'+(m.numero||'')+'?',()=>{
    o.medicoes=o.medicoes.filter(x=>x.id!==medId);
    o.contasReceber=(o.contasReceber||[]).filter(cr=>cr.medicaoId!==medId);
    if(o.aditivos)o.aditivos=o.aditivos.filter(a=>!a.motivo||!a.motivo.startsWith('MED-'+m.numero));
    salvar();render();toast('Medicao excluida');
  });
}

function addAditivo(obraId,dados){
  const o=getObra(obraId);if(!o)return;
  const vA=valorContratoAtual(o),tipo=dados.tipo==='deducao'?'deducao':'acrescimo',vJ=parseMoeda(dados.valorAjuste);
  const vD=tipo==='deducao'?Math.max(0,vA-vJ):vA+vJ;
  const numSeq=proximoNumero(o,'aditivo');
  o.aditivos.push({id:uid(),numero:numSeq,data:dados.data||todayISO(),motivo:dados.motivo,tipo,valorAjuste:vJ,valorAntes:vA,valorDepois:vD});
  salvar();render();toast('Aditivo AD-'+numSeq+' registrado');
}

function adicionarDiaAvulso(obraId,trabId,presente){
  const o=getObra(obraId);if(!o)return;
  const trab=(o.trabalhadores||[]).find(t=>t.id===trabId);if(!trab)return;
  trab.diasAvulsos=trab.diasAvulsos||[];
  const dataEl=document.getElementById('avulso_data');
  const diariaEl=document.getElementById('avulso_diaria');
  const data=dataEl?dataEl.value:todayISO();
  const diaria=diariaEl?parseMoeda(diariaEl.value):Number(trab.valorDiaria)||0;
  if(!data){toast('Informe a data');return;}
  const jaExiste=trab.diasAvulsos.find(d=>d.data===data);
  if(jaExiste){jaExiste.presente=presente;jaExiste.valorDiaria=diaria;toast('Dia atualizado');}
  else{trab.diasAvulsos.push({data,presente,valorDiaria:diaria});toast(presente?'Dia presente adicionado':'Falta adicionada');}
  salvar();render();
}

function removerDiaAvulso(obraId,trabId,idx){

  trab.diasAvulsos=trab.diasAvulsos||[];
  trab.diasAvulsos.splice(idx,1);
  salvar();render();
}

function confirmarEditarGasto(){

  g.descricao=document.getElementById('eg_desc').value||g.descricao;

  g.statusPagamento=document.getElementById('eg_status').value;
  g.fornecedor=document.getElementById('eg_forn').value;
  g.notaFiscal=document.getElementById('eg_nf').value;
  const etEl=document.getElementById('eg_etapa');
  if(etEl)g.etapaId=etEl.value;

function confirmarEditarRecebimento(){

  r.valor=parseMoeda(document.getElementById('er_valor').value);
  r.data=document.getElementById('er_data').value;
  r.formaPagamento=document.getElementById('er_forma').value;
  r.observacao=document.getElementById('er_obs').value;
  salvar();fecharModal();toast('Recebimento atualizado');

function confirmarEditarAditivo(){
  const o=getObra();if(!o)return;
  const a=(o.aditivos||[]).find(x=>x.id===state.modal.aditivoId);if(!a)return;
  a.motivo=document.getElementById('ea_motivo').value;
  a.tipo=document.getElementById('ea_tipo').value;
  a.valorAjuste=parseMoeda(document.getElementById('ea_valor').value);
  a.data=document.getElementById('ea_data').value;
  const idx=(o.aditivos||[]).indexOf(a);
  let base=o.contrato.valor||0;
  (o.aditivos||[]).slice(0,idx).forEach(ad=>{base=ad.tipo==='deducao'?base-ad.valorAjuste:base+ad.valorAjuste;});
  a.valorAntes=base;
  a.valorDepois=a.tipo==='deducao'?base-a.valorAjuste:base+a.valorAjuste;
  salvar();fecharModal();toast('Aditivo atualizado');
}

function removerAditivo(obraId,aditivoId){
  const o=getObra(obraId);if(!o)return;
  const a=(o.aditivos||[]).find(x=>x.id===aditivoId);
  _confirmar('Remover aditivo AD-'+(a?a.numero:'')+'?',()=>{
    o.aditivos=o.aditivos.filter(x=>x.id!==aditivoId);
    salvar();render();toast('Aditivo removido');
  });
}

function enviarResumoWhatsApp(apontamentoId){
  const o=getObra();if(!o)return;
  const a=(o.apontamentos||[]).find(x=>x.id===apontamentoId);if(!a)return;
  let msg='*RDO-'+a.numero+' — '+o.nome+'*\n';
  msg+='Data: '+fmtData(a.data)+' | Clima: '+a.clima+'\n';
  msg+='Progresso Geral: *'+pctFisicoGeral(o).toFixed(1)+'%*\n';
  if(a.presencasTrabalhadores&&a.presencasTrabalhadores.length){
    const pres=a.presencasTrabalhadores.filter(p=>p.presente);
    const falt=a.presencasTrabalhadores.filter(p=>!p.presente);
    const totalMO=pres.reduce((s,pt)=>{const tr=(o.trabalhadores||[]).find(x=>x.id===pt.trabalhadorId);return s+(pt.valorDiaria!=null?Number(pt.valorDiaria):(tr?Number(tr.valorDiaria):0));},0);
    msg+='Efetivo: *'+pres.length+' presentes*'+(falt.length?' · '+falt.length+' falta(s)':'')+(totalMO?' · MO: R$'+totalMO.toFixed(2).replace('.',','):'')+'\n';
  }
  if(a.progresso&&a.progresso.length){
    msg+='\nProgresso por Etapa:\n';
    a.progresso.forEach(p=>{const e=(o.etapas||[]).find(x=>x.id===p.etapaId);if(e)msg+='- '+e.nome+': '+p.m2Executado+' m2 ('+pctAtualEtapa(o,e.id).toFixed(1)+'%)\n';});
  }
  if(a.ocorrencias)msg+='\nOcorrencias: '+a.ocorrencias+'\n';
  msg+='\n_Enviado via Controle de Obras_';
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(msg),'_blank');
}

function toggleMaisDropdown(e){
  if(e)e.stopPropagation();
  state.obraTabDropdown=!state.obraTabDropdown;
  // Não chama render() completo - apenas mostra/esconde o dropdown via DOM
  var dd=document.getElementById('mais-dropdown');
  if(!dd){render();return;}
  if(state.obraTabDropdown){
    var btn=document.getElementById('mais-tab-btn');
    if(btn){
      var r=btn.getBoundingClientRect();
      dd.style.display='block';
      dd.style.position='fixed';
      dd.style.top=(r.bottom+4)+'px';
      dd.style.right=(window.innerWidth-r.right)+'px';
      dd.style.left='auto';
      dd.style.zIndex='9999';
    }
  } else {

  }

function _rdoColetarEfetivo(trabalhadores){
  const result=[];
  (trabalhadores||[]).forEach(function(t,i){
    const pEl=document.getElementById('ef_p_'+i);
    const dEl=document.getElementById('ef_diaria_'+i);
    if(!pEl)return;
    const presente=pEl.checked;
    const diaria=dEl?parseMoeda(dEl.value):Number(t.valorDiaria)||0;

  });

function renderPainelGeral_old_unused(){
  const obras=state.obras;
  const totalObras=obras.length;
  const emAndamento=obras.filter(o=>o.status==='andamento').length;
  const paradas=obras.filter(o=>o.status==='parada').length;
  const concluidas=obras.filter(o=>o.status==='concluida').length;
  const totalContratos=obras.reduce((s,o)=>s+valorContratoAtual(o),0);
  const totalRecebido=obras.reduce((s,o)=>s+totalRecebidoCliente(o),0);
  const totalPendente=totalContratos-totalRecebido;
  const totalGastos=obras.reduce((s,o)=>s+totalGastosReais(o),0);
  const margem=totalContratos-totalGastos;
  const pctMargem=totalContratos>0?(margem/totalContratos)*100:0;
  const pctRecebido=totalContratos>0?(totalRecebido/totalContratos)*100:0;
  const comAtraso=obras.filter(o=>obraTemAtraso(o));
  const hoje=todayISO(),hojeN=dayNum(hoje);
  let cpVencidas=0,cpVencidasV=0,cpSemana=0,cpSemanaV=0,crPend=0,crPendV=0,medAbertas=0,semRdo=[];
  obras.forEach(o=>{
    (o.contasPagar||[]).filter(c=>c.status!=='pago').forEach(c=>{const d=dayNum(c.dataVencimento);if(d&&d<hojeN){cpVencidas++;cpVencidasV+=Number(c.valor)||0;}else if(d&&d-hojeN<=7){cpSemana++;cpSemanaV+=Number(c.valor)||0;}});
    (o.contasReceber||[]).filter(c=>c.status!=='recebido').forEach(c=>{crPend++;crPendV+=Number(c.valor)||0;});
    medAbertas+=(o.medicoes||[]).filter(m=>m.status==='aberta').length;

    const ult=aps.length?dayNum(aps[0].data):0;

  html+='<div style="display:grid;grid-template-columns:repeat(3,1fr)!important;gap:8px;margin-bottom:8px;">'+

    kpi('Recebido de clientes',brl(totalRecebido),pctRecebido.toFixed(1)+'% do contratado','var(--good)')+
    kpi('Saldo a receber',brl(totalPendente),crPend+' titulo(s) em aberto','var(--warn)')+
  '</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(3,1fr)!important;gap:8px;margin-bottom:16px;">'+

    kpi('Margem estimada',brl(margem),pctMargem.toFixed(1)+'% sobre o contratado',margem>=0?'var(--good)':'var(--bad)')+
    kpi('Execucao media',pctMedio.toFixed(1)+'%',comAtraso.length?comAtraso.length+' obra(s) com atraso':'todas no prazo',comAtraso.length?'var(--warn)':'var(--good)')+
  '</div>';

  let sit='<div class="card" style="justify-content:flex-start;"><h2 class="section-title"><span class="bar"></span> Situacao do portfolio</h2>';

function exportarBackup(){
  const payload={obras:state.obras,empresa:state.empresa,tema:state.tema,modeloRelatorio:state.modeloRelatorio,dataExportacao:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-controleobras-'+todayISO()+'.json';a.click();toast('Backup exportado!');
}
function importarBackup(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{const data=JSON.parse(ev.target.result);aplicarEstadoSalvo(data);salvar();render();toast('Backup restaurado com sucesso!');}catch(err){toast('Erro ao importar backup');}
  };
  reader.readAsText(file);
}

function renderCurvaTab(o){
  const etapas=o.etapas||[];
  if(!etapas.length)return'<div class="card empty"><p>Cadastre etapas no cronograma para visualizar o painel de progresso.</p></div>';

  const hoje=todayISO();
  const hojeN=dayNum(hoje);
  const inicioObra=o.contrato&&o.contrato.dataInicio?o.contrato.dataInicio:hoje;
  const fimObra=o.contrato&&o.contrato.dataFimPrevista?o.contrato.dataFimPrevista:hoje;
  const durTotal=Math.max(1,dayNum(fimObra)-dayNum(inicioObra));
  const durDecorrido=Math.max(0,Math.min(durTotal,hojeN-dayNum(inicioObra)));
  const pctTempo=Math.min(100,(durDecorrido/durTotal)*100);
  const pctFisico=pctFisicoGeral(o);
  const diferenca=pctFisico-pctTempo;
  const statusGeral=diferenca>=-5?'ok':'atraso';

  const R=52,CX=64,CY=64,SW=10;
  const circ=2*Math.PI*R;
  const fisicoDash=(pctFisico/100)*circ;
  const tempoDash=(pctTempo/100)*circ;
  const accentColor=statusGeral==='ok'?'var(--good)':'var(--bad)';

  let html='<div style="background:var(--bg-card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;">';
  html+='<div style="display:flex;align-items:center;gap:16px;">';
  html+='<svg width="128" height="128" viewBox="0 0 128 128" style="flex:none;">';
  html+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="var(--bg-sunken)" stroke-width="'+SW+'"/>';
  html+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="var(--ink-faint)" stroke-width="'+(SW-4)+'" stroke-dasharray="'+tempoDash.toFixed(1)+' '+circ+'" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 '+CX+' '+CY+')" opacity="0.4"/>';
  html+='<circle cx="'+CX+'" cy="'+CY+'" r="'+R+'" fill="none" stroke="'+accentColor+'" stroke-width="'+SW+'" stroke-dasharray="'+fisicoDash.toFixed(1)+' '+circ+'" stroke-dashoffset="0" stroke-linecap="round" transform="rotate(-90 '+CX+' '+CY+')" style="transition:stroke-dasharray .6s ease;"/>';
  html+='<text x="'+CX+'" y="'+(CY-6)+'" text-anchor="middle" fill="var(--ink)" font-size="22" font-weight="800" font-family="Outfit,sans-serif">'+pctFisico.toFixed(0)+'%</text>';
  html+='<text x="'+CX+'" y="'+(CY+10)+'" text-anchor="middle" fill="var(--ink-faint)" font-size="11">físico</text>';
  html+='<text x="'+CX+'" y="'+(CY+24)+'" text-anchor="middle" fill="var(--ink-faint)" font-size="10">'+pctTempo.toFixed(0)+'% prazo</text>';
  html+='</svg>';
  html+='<div style="flex:1;display:flex;flex-direction:column;gap:10px;">';
  html+='<div>';
  html+='<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span style="font-weight:700;color:var(--ink);">Progresso Físico</span><span style="font-weight:800;color:'+accentColor+';">'+pctFisico.toFixed(1)+'%</span></div>';
  html+='<div style="height:10px;border-radius:99px;background:var(--bg-sunken);overflow:hidden;position:relative;">';
  html+='<div style="position:absolute;left:'+pctTempo.toFixed(1)+'%;top:0;bottom:0;width:2px;background:var(--ink-faint);z-index:2;"></div>';
  html+='<div style="height:100%;width:'+Math.min(100,pctFisico).toFixed(1)+'%;border-radius:99px;background:'+accentColor+';transition:width .5s ease;"></div>';
  html+='</div>';
  html+='<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:3px;"><span>'+fmtData(inicioObra)+'</span><span>▲ prazo '+pctTempo.toFixed(0)+'%</span><span>'+fmtData(fimObra)+'</span></div>';
  html+='</div>';
  html+='<div style="background:'+(diferenca>=0?'var(--good-soft)':'var(--bad-soft)')+';border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;">';
  html+='<span style="font-size:11px;font-weight:600;color:var(--ink-soft);">'+(diferenca>=0?'✓ Adiantado':'⚠ Atrasado')+'</span>';
  html+='<span style="font-size:16px;font-weight:800;font-family:var(--font-head);color:'+(diferenca>=0?'var(--good)':'var(--bad)')+';">'+(diferenca>=0?'+':'')+diferenca.toFixed(1)+'%</span>';
  html+='</div>';
  html+='</div></div></div>';

  html+='<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin-bottom:8px;">Progresso por Etapa</div>';
  html+='<div style="display:flex;flex-direction:column;gap:6px;">';
  etapas.forEach(function(e){
    const pct=pctAtualEtapa(o,e.id);
    const m2exec=m2ExecutadoEtapa(o,e.id);
    const prev=Number(e.metragemPrevista)||0;
    const atraso=etapaAtrasada(o,e);
    const done=pct>=100;
    const barCor=done?'var(--good)':atraso?'var(--bad)':'var(--accent)';
    const rowBg=atraso?'background:var(--bad-soft);':'';
    let diasTxt='';
    if(e.dataFimPrev&&!done){
      const diff=Math.round((new Date(e.dataFimPrev)-new Date(hoje))/(86400000));
      diasTxt=atraso?'<span style="color:var(--bad);font-size:10px;font-weight:700;">'+Math.abs(diff)+'d atraso</span>':'<span style="color:var(--ink-faint);font-size:10px;">'+diff+'d restantes</span>';
    }
    html+='<div style="background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;'+rowBg+'">';
    html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
    html+='<div style="font-size:12px;font-weight:700;color:var(--ink);">'+esc(e.nome)+'</div>';
    html+='<div style="display:flex;align-items:center;gap:8px;">'+diasTxt+'<span style="font-size:14px;font-weight:800;font-family:var(--font-head);color:'+barCor+';">'+pct.toFixed(0)+'%</span></div>';
    html+='</div>';
    html+='<div style="height:8px;border-radius:99px;background:var(--bg-sunken);overflow:hidden;">';
    html+='<div style="height:100%;width:'+Math.min(100,pct).toFixed(1)+'%;border-radius:99px;background:'+barCor+';transition:width .4s;"></div>';
    html+='</div>';
    if(prev>0||m2exec>0){
      html+='<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--ink-faint);margin-top:4px;">';
      html+='<span>'+m2exec.toFixed(1)+' / '+prev+' m²</span>';
      html+='<span>'+fmtData(e.dataInicioPrev)+' → '+fmtData(e.dataFimPrev)+'</span>';
      html+='</div>';
    }
    html+='</div>';
  });
  html+='</div>';
  return html;
}

    +'<select style="min-width:100px;" onchange="state.gastosCat=this.value;render();"><option value="">Categoria</option><option value="material"'+(catF==='material'?' selected':'')+'>Material</option><option value="equipamento"'+(catF==='equipamento'?' selected':'')+'>Equip.</option><option value="mao_de_obra"'+(catF==='mao_de_obra'?' selected':'')+'>MO</option><option value="outros"'+(catF==='outros'?' selected':'')+'>Outros</option></select>'

  +'</div>';

    html+='<div class="card empty"><p>'+(gastos.length?'Nenhum gasto encontrado.':'Nenhum gasto registrado.')+'</p></div>';
    return html;

function diasTrabalhados(o){
  const d={};
  (o.apontamentos||[]).forEach(a=>{(a.presencasTrabalhadores||[]).forEach(pt=>{if(pt.presente)d[pt.trabalhadorId]=(d[pt.trabalhadorId]||0)+1;});});
  (o.trabalhadores||[]).forEach(t=>{(t.diasAvulsos||[]).forEach(da=>{if(da.presente!==false)d[t.id]=(d[t.id]||0)+1;});});
  return d;
}

function renderGaleriaTab(o){

  fotos.sort((a,b)=>b.data.localeCompare(a.data));
  let html='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
    +'<h2 class="section-title" style="margin:0;"><span class="bar"></span> Galeria</h2>'
    +'<span style="font-size:12px;color:var(--ink-faint);font-weight:600;">'+fotos.length+' foto'+(fotos.length!==1?'s':'')+'</span>'
  +'</div>';
  if(!fotos.length) return html+'<div class="card empty"><p>Nenhuma foto. Adicione fotos ao criar um RDO.</p></div>';
  const grupos={};
  fotos.forEach(f=>{if(!grupos[f.data])grupos[f.data]=[];grupos[f.data].push(f);});

        +'<span style="font-size:10px;color:var(--ink-faint);">RDO-'+grp[0].numero+' · '+grp.length+' foto'+(grp.length>1?'s':'')+'</span>'

      +'</div>'

    grp.forEach(f=>{
      html+='<div style="border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:1;background:var(--bg-sunken);" onclick="state.fotoFullscreen=\''+f.src+'\';render();">'
        +'<img src="'+f.src+'" style="width:100%;height:100%;object-fit:cover;" loading="lazy" alt="Foto RDO-'+f.numero+'">'
      +'</div>';
    });
    html+='</div></div>';
  });
  return html;
}

function renderFinanceiroTab(o){
  const contrato=valorContratoAtual(o);
  const recebido=totalRecebidoCliente(o);
  const saldo=contrato-recebido;
  const gastosComp=totalGastosCompras(o);
  const gastosMO=totalGastosMaoDeObra(o);
  const gastosTotal=gastosComp+gastosMO;
  const lucro=contrato-gastosTotal;
  const pctRec=contrato>0?(recebido/contrato)*100:0;

  // KPIs financeiros com listrinha colorida
  

  let html='<h2 class="section-title"><span class="bar"></span> Financeiro Total</h2>';
  html+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">'
    +kpiF('var(--accent)','Contrato',brl(contrato),'atualizado','var(--ink)')
    +kpiF('var(--good)','Recebido',brl(recebido),pctRec.toFixed(1)+'% do contrato','var(--good)')
    +kpiF('var(--warn)','A Receber',brl(saldo),'pendente','var(--warn)')
    +kpiF('var(--good)','Lucro Est.',brl(lucro),lucro>=0?'margem positiva':'margem negativa',lucro>=0?'var(--good)':'var(--bad)')

function abrirModalNovaObra(){state.modal={tipo:'nova-obra'};render();}

function confirmarEditarObra(){const o=getObra();if(!o)return;o.nome=document.getElementById('m_nome').value||o.nome;o.cliente=document.getElementById('m_cliente').value;o.endereco=document.getElementById('m_endereco').value;o.contrato.valor=parseMoeda(document.getElementById('m_valor').value);o.metragemTotal=parseMoeda(document.getElementById('m_metragem').value);o.contrato.dataInicio=document.getElementById('m_dataInicio').value;o.contrato.dataFimPrevista=document.getElementById('m_dataFim').value;o.contrato.responsavel=document.getElementById('m_responsavel').value;o.status=document.getElementById('m_status').value;salvar();fecharModal();render();toast('Obra atualizada');}
function abrirModalEtapa(){state.modal={tipo:'nova-etapa'};render();}

  const o=getObra();if(!o)return;

  addEtapa(o.id,{nome,dataInicioPrev:document.getElementById('m_dtInicio').value,dataFimPrev:document.getElementById('m_dtFim').value,metragemPrevista:document.getElementById('m_metragem').value});

function abrirModalMedicao(){state.modal={tipo:'nova-medicao'};render();}
function confirmarNovaMedicao(){
  const o=getObra();if(!o)return;
  const ini=document.getElementById('m_periodoInicio').value;
  const fim=document.getElementById('m_periodoFim').value;
  if(!ini||!fim){toast('Informe o período da medição');return;}
  if(ini>fim){toast('Data início deve ser anterior ao fim');return;}
  const dup=(o.medicoes||[]).find(m=>m.periodoInicio===ini&&m.periodoFim===fim);
  if(dup){toast('Já existe uma medição para este período');return;}
  criarMedicao(o.id,{periodoInicio:ini,periodoFim:fim});
  fecharModal();
}
function abrirModalRecebimento(){state.modal={tipo:'novo-recebimento'};render();}

  const o=getObra();if(!o)return;
  const valor=document.getElementById('m_valor').value;

  const comprovante=document.getElementById('mp_comprovante').value;

function excluirPagamento(trabId,pagId){

function imprimirReciboPagamento(trabId,pagId){
  const o=getObra();if(!o)return;
  const t=(o.trabalhadores||[]).find(x=>x.id===trabId);if(!t)return;
  const pg=(t.pagamentos||[]).find(x=>x.id===pagId);if(!pg)return;
  const p=_reportPalette();const emp=state.empresa;
  const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
  const aps=(o.apontamentos||[]).slice().sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  let dTrab=0,faltas=0;
  aps.forEach(a=>{const pr=(a.presencasTrabalhadores||[]).find(x=>x.trabalhadorId===t.id);if(pr&&pr.presente)dTrab++;else if(pr&&!pr.presente)faltas++;});
  const totalGeral=dTrab*(Number(t.valorDiaria)||0);
  const totalPago=(t.pagamentos||[]).reduce((s,x)=>s+(Number(x.valor)||0),0);
  const saldo=totalGeral-totalPago;
  let html=_relatorioHeadHtml('Recibo de Pagamento',o);
  html+=_headerBlock('Recibo de Pagamento',o,emp);
  html+='<div class="rp-body">';
  html+='<div class="rp-info">'+
    '<div class="rp-field"><span class="lbl">Trabalhador:</span><span class="val">'+esc(t.nome)+'</span></div>'+
    '<div class="rp-field"><span class="lbl">Funcao:</span><span class="val">'+esc(t.funcao)+'</span></div>'+
    '<div class="rp-field"><span class="lbl">Ciclo:</span><span class="val">'+esc(t.ciclo||'—')+'</span></div>'+
    '<div class="rp-field"><span class="lbl">Diaria:</span><span class="val">'+brl(t.valorDiaria)+'</span></div>'+
  '</div>';
  html+='<div class="rp-kpi" style="grid-template-columns:repeat(4,1fr);">'+
    '<div class="rp-k"><div class="rp-kl">Dias Trabalhados</div><div class="rp-kv">'+dTrab+'</div></div>'+
    '<div class="rp-k"><div class="rp-kl">Faltas</div><div class="rp-kv" style="color:'+(faltas>0?p.bad:p.good)+'">'+faltas+'</div></div>'+
    '<div class="rp-k kpi-good"><div class="rp-kl">Total Pago</div><div class="rp-kv c-good">'+brl(totalPago)+'</div></div>'+
    '<div class="rp-k '+(saldo>0?'kpi-warn':'kpi-good')+'"><div class="rp-kl">Saldo</div><div class="rp-kv '+(saldo>0?'c-warn':'c-good')+'">'+brl(saldo)+'</div></div>'+
  '</div>';
  html+=_secTitle(1,'Frequencia Detalhada');
  html+='<table><thead><tr><th style="width:28px;">#</th><th style="width:36px;">Dia</th><th>Data</th><th>RDO</th><th style="text-align:center;">Status</th><th style="text-align:right;">Valor</th></tr></thead><tbody>';
  aps.forEach((a,i)=>{
    const pres=(a.presencasTrabalhadores||[]).find(x=>x.trabalhadorId===t.id);
    const presente=pres&&pres.presente;
    const falta=pres&&!pres.presente;
    const partes=String(a.data).split('-');
    const dt=partes.length===3?new Date(+partes[0],+partes[1]-1,+partes[2]):new Date(a.data);
    const ds=DS[dt.getDay()];
    const dmf=partes.length===3?partes[2]+'/'+partes[1]+'/'+partes[0]:fmtData(a.data);
    const bgRow=falta?'background:#FEF2F2;':'';
    const corSt=falta?'color:#DC2626;font-weight:700;':presente?'color:#16A34A;font-weight:700;':'color:#9CA3AF;';
    const stTxt=presente?'Presente':falta?'FALTA':'—';
    html+='<tr style="'+bgRow+'">'+
      '<td style="color:#9CA3AF;font-size:9px;">'+String(i+1).padStart(2,'0')+'</td>'+
      '<td style="font-weight:700;'+corSt+'">'+ds+'</td>'+
      '<td>'+dmf+'</td>'+
      '<td style="color:#9CA3AF;">RDO-'+a.numero+'</td>'+
      '<td style="text-align:center;'+corSt+'">'+stTxt+'</td>'+
      '<td style="text-align:right;">'+(presente?brl(t.valorDiaria):'—')+'</td>'+
    '</tr>';
  });
  if(!aps.length)html+='<tr><td colspan="6" style="text-align:center;color:'+p.inkFaint+';padding:14px;">Nenhum apontamento</td></tr>';
  html+='<tr class="rp-total-row"><td colspan="4"><strong>TOTAL</strong></td><td style="text-align:center;font-size:9px;color:#888;">'+dTrab+' pres. / '+faltas+' falta(s)</td><td style="text-align:right;"><strong>'+brl(totalGeral)+'</strong></td></tr>';
  html+='</tbody></table>';
  html+=_secTitle(2,'Este Pagamento');
  html+='<div class="rp-info">'+
    '<div class="rp-field"><span class="lbl">Data:</span><span class="val">'+fmtData(pg.data)+'</span></div>'+
    '<div class="rp-field"><span class="lbl">Forma:</span><span class="val">'+esc(pg.forma)+'</span></div>'+
    (pg.comprovante?'<div class="rp-field"><span class="lbl">Comprovante Nº:</span><span class="val">'+esc(pg.comprovante)+'</span></div>':'')+
    (pg.obs?'<div class="rp-field"><span class="lbl">Obs:</span><span class="val">'+esc(pg.obs)+'</span></div>':'')+
  '</div>';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:2px solid #C9A227;border-bottom:2px solid #C9A227;margin:10px 0;">'+
    '<span style="font-size:10px;color:#65748A;text-transform:uppercase;letter-spacing:.06em;">Valor pago neste recibo</span>'+
    '<span style="font-size:22px;font-weight:700;color:#1F3A68;">'+brl(pg.valor)+'</span>'+
  '</div>';
  if(pg.compImg){html+='<div style="margin:10px 0;"><div style="font-size:9px;color:#65748A;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;">Comprovante anexado:</div><img src="'+pg.compImg+'" style="max-width:280px;max-height:160px;object-fit:contain;border:1px solid #DCE4ED;border-radius:4px;display:block;"></div>';}
  html+='<div class="rp-note">Declaro que recebi o valor de <strong>'+brl(pg.valor)+'</strong> referente a servicos prestados na obra <strong>'+esc(o.nome)+'</strong>, dando plena quitacao do presente pagamento.</div>';
  html+='</div>';
  html+=_relatorioFootHtml();
  _printReport(html);
}

function salvarApontamentoForm(editId){
  const o=getObra();if(!o)return;
  const progresso=[];
  for(let i=0;i<window._addProgressCount;i++){
    const etapaEl=document.getElementById('m_prog_etapa_'+i);
    const m2El=document.getElementById('m_prog_m2_'+i);
    if(etapaEl&&m2El&&etapaEl.value){progresso.push({etapaId:etapaEl.value,m2Executado:parseMoeda(m2El.value)});}
  }
  var fotosExist=[];
  if(editId){
    const aEx=(o.apontamentos||[]).find(function(x){return x.id===editId;});
    if(aEx)fotosExist=aEx.fotos||[];
  }
  var fotasNovas=window._rdoFotos||[];
  window._rdoFotos=[];
  window._addProgressCount=0;
  const presencasTrabalhadores=_rdoColetarEfetivo(o.trabalhadores||[]);
  salvarApontamento(o.id,{
    data:document.getElementById('m_data').value,
    clima:document.getElementById('m_clima').value,
    ocorrencias:document.getElementById('m_ocorrencias').value,
    progresso,
    fotos:fotosExist.concat(fotasNovas),
    presencasTrabalhadores
  },editId);
  fecharModal();
}

function _relatorioFootHtml(obra){
  const d=new Date(),p2=n=>('0'+n).slice(-2);
  const txt=p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()+' '+p2(d.getHours())+':'+p2(d.getMinutes());
  const emp=state.empresa||{};
  const o=obra||getObra();
  const periodo=o&&o.contrato&&o.contrato.dataInicio&&o.contrato.dataFimPrevista
    ?'Período: '+fmtData(o.contrato.dataInicio)+' a '+fmtData(o.contrato.dataFimPrevista)
    :'';
  return '<div class="rp-footer">'+
    '<div class="rp-sig-row">'+
      '<div class="rp-sig-item"><div class="rp-sl"></div><div class="rp-sll">'+esc(emp.responsavel?'RESP. '+emp.responsavel:'Responsavel tecnico')+'</div></div>'+
      '<div class="rp-sig-item"><div class="rp-sl"></div><div class="rp-sll">Data de Emissao: '+txt+'</div></div>'+
    '</div>'+
    '<div class="rp-foot-info">'+
      '<span>'+esc(emp.razao||'ControleObras')+'</span>'+
      '<div style="text-align:right;">'+
        (periodo?'<div style="font-size:8.5px;color:var(--rp-inkFaint);margin-bottom:2px;">'+periodo+'</div>':'')+
        '<span>Documento gerado digitalmente</span>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function _printReport(html){
  window._appHtml=root.innerHTML;
  // Resetar tema do body para branco durante preview
  document.documentElement.style.setProperty('--bg','#F3F6F9');
  document.documentElement.style.setProperty('--ink','#1A2230');
  document.body.style.background='#F3F6F9';
  document.body.style.color='#1A2230';
  document.body.style.colorScheme='light';
   root.innerHTML='<div class="rp-no-print" style="position:fixed;top:0;left:0;right:0;z-index:100;background:#FFFFFF;padding:11px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #D5E0EB;box-shadow:0 2px 8px rgba(27,52,82,.08);"><span style="font-family:\'Barlow Condensed\',sans-serif;color:#10213B;font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;">Pre-visualizacao do relatorio</span><div style="display:flex;gap:8px;"><button onclick="window.print();" style="font-family:\'Barlow Condensed\',sans-serif;padding:7px 18px;background:#C9A227;color:#10213B;border:1px solid #B18C1C;border-radius:3px;cursor:pointer;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;">Imprimir / PDF</button><button onclick="_fecharPreview();" style="font-family:\'Barlow Condensed\',sans-serif;padding:7px 18px;background:#FFFFFF;color:#10213B;border:1px solid #B8C6D5;border-radius:3px;cursor:pointer;font-size:13px;text-transform:uppercase;letter-spacing:.12em;">Voltar</button></div></div><div class="rp-preview-shell" style="min-height:100vh;background:#F3F6F9;padding:76px 8px 30px;box-sizing:border-box;"><div id="print-view" style="width:min(210mm,100%);max-width:100%;margin:0 auto;background:#fff;color:#1A2230;border:1px solid #D5DDE7;box-shadow:0 10px 28px rgba(27,52,82,.12);overflow:hidden;">'+html+'</div></div>';
  // print button usa onclick inline
}
function _fecharPreview(){
  document.body.style.background='';
  document.body.style.color='';
  document.body.style.colorScheme='';
  document.documentElement.style.removeProperty('--bg');
  document.documentElement.style.removeProperty('--ink');
  window._appHtml=null;
  initTema();
  // Restaurar root se necessário
  var r=document.getElementById('app');
  if(!r){
    var div=document.createElement('div');
    div.id='app';
    document.body.appendChild(div);
  }
  render();
}

function imprimirRDO(){
  const o=getObra();if(!o)return;const p=_reportPalette();const emp=state.empresa;let html=_relatorioHeadHtml('Relatorio Diario de Obra (RDO)',o);
  const aps=o.apontamentos||[];
  const totalDias=aps.length;
  const diasComProgresso=aps.filter(a=>a.progresso&&a.progresso.length).length;
  const totalM2=aps.reduce((s,a)=>s+(a.progresso||[]).reduce((ss,p)=>ss+Number(p.m2Executado)||0,0),0);
  const totalPresencas=aps.reduce((s,a)=>s+(a.presencasTrabalhadores||[]).filter(p=>p.presente).length,0);
  html+=_headerBlock('Relatorio Diario de Obra',o,emp);
  html+='<div class="rp-body">';
  html+=_secTitle(1,'Identificacao da Obra');
   html+='<div class="rp-info"><div class="rp-field"><span class="lbl">Inicio:</span><span class="val">'+fmtData(o.contrato.dataInicio)+'</span></div><div class="rp-field"><span class="lbl">Previsao:</span><span class="val">'+fmtData(o.contrato.dataFimPrevista)+'</span></div></div>';
  html+=_secTitle(2,'Indicadores do Periodo');
  html+='<div class="rp-kpi"><div class="rp-k"><div class="rp-kl">Total RDOs</div><div class="rp-kv">'+totalDias+'</div><div class="rp-ks">dias registrados</div></div><div class="rp-k"><div class="rp-kl">Dias com Progresso</div><div class="rp-kv">'+diasComProgresso+'</div><div class="rp-ks">com avanco</div></div><div class="rp-k kpi-good"><div class="rp-kl">Total m2 Executados</div><div class="rp-kv c-good">'+totalM2.toFixed(1)+' m2</div><div class="rp-ks">acumulado</div></div><div class="rp-k kpi-warn"><div class="rp-kl">Total Presencas</div><div class="rp-kv c-warn">'+totalPresencas+'</div><div class="rp-ks">mao de obra</div></div></div>';
  html+=_secTitle(3,'Apontamentos Diarios');
  aps.forEach((a,idx)=>{
    html+='<h2><span class="sec-num">'+(idx+1)+'</span> RDO-'+a.numero+' &mdash; '+fmtData(a.data)+'</h2>';
    html+='<div class="rp-info"><div class="rp-field"><span class="lbl">Data:</span><span class="val">'+fmtData(a.data)+'</span></div><div class="rp-field"><span class="lbl">Clima:</span><span class="val">'+esc(a.clima)+'</span></div></div>';
    if(a.efetivo&&a.efetivo.length){html+='<h3>Equipe do Dia</h3><table><thead><tr><th>Funcao</th><th style="text-align:center;">Qtd</th><th>Tipo</th></tr></thead><tbody>';a.efetivo.forEach(e=>{html+='<tr><td>'+esc(e.funcao)+'</td><td style="text-align:center;">'+e.qtd+'</td><td>'+esc(e.tipo||'—')+'</td></tr>';});html+='</tbody></table>';}
    if(a.equipamentos&&a.equipamentos.length){html+='<h3>Equipamentos</h3><table><thead><tr><th>Equipamento</th><th style="text-align:center;">Horas</th></tr></thead><tbody>';a.equipamentos.forEach(e=>{html+='<tr><td>'+esc(e.nome)+'</td><td style="text-align:center;">'+e.horas+'h</td></tr>';});html+='</tbody></table>';}
    if(a.progresso&&a.progresso.length){html+='<h3>Progresso do Dia</h3><table><thead><tr><th>Etapa</th><th style="text-align:right;">m2 Executados</th><th style="width:25%;">Progresso</th></tr></thead><tbody>';a.progresso.forEach(pr=>{const et=(o.etapas||[]).find(x=>x.id===pr.etapaId);const pct=et?pctAtualEtapa(o,et.id):0;const barClass=pct>=100?'bar-good':pct>=50?'':'bar-warn';html+='<tr><td><strong>'+(et?esc(et.nome):'-')+'</strong></td><td style="text-align:right;">'+Number(pr.m2Executado).toFixed(1)+' m2</td><td><div class="rp-progress"><div class="rp-bar '+barClass+'" style="width:'+Math.min(pct,100)+'%"></div></div><span class="rp-prog-pct">'+pct.toFixed(1)+'%</span></td></tr>';});html+='</tbody></table>';}
    if(a.ocorrencias)html+='<div class="rp-note"><strong>Ocorrencias:</strong> '+esc(a.ocorrencias)+'</div>';
    if(a.fotos&&a.fotos.length){
      html+='<h3>Registro Fotográfico</h3>';
      html+='<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;">';
      a.fotos.forEach(function(f){
        html+='<div><img src="'+f+'" style="width:100%;height:120px;object-fit:cover;border-radius:4px;border:1px solid #DCE4ED;"></div>';
      });
      html+='</div>';
    }
  });
  if(!aps.length)html+='<div class="rp-note">Nenhum RDO registrado para esta obra.</div>';
  html+='</div>';
  html+=_relatorioFootHtml();_printReport(html);
}

function imprimirCronograma(){
  const o=getObra();if(!o)return;const p=_reportPalette();const emp=state.empresa;let html=_relatorioHeadHtml('Cronograma — '+o.nome,o);
  const etapas=o.etapas||[];
  const totalPrev=etapas.reduce((s,e)=>s+(Number(e.metragemPrevista)||0),0);
  const totalExec=etapas.reduce((s,e)=>s+m2ExecutadoEtapa(o,e.id),0);
  const geralPct=pctFisicoGeral(o);
  const diasRest=Math.max(0,dayNum(o.contrato.dataFimPrevista)-dayNum(todayISO()));
  const prazoConsumido=pctPrazoConsumido(o);
  html+=_headerBlock('Cronograma',o,emp,etapas.length+' etapas · '+diasRest+' dias restantes');
  html+='<div class="rp-body">';
  html+=_secTitle(1,'Indicadores Gerais');
  html+='<div class="rp-kpi"><div class="rp-k kpi-good"><div class="rp-kl">Progresso Fisico</div><div class="rp-kv c-good">'+geralPct.toFixed(1)+'%</div><div class="rp-ks">executado</div></div><div class="rp-k kpi-warn"><div class="rp-kl">Prazo Consumido</div><div class="rp-kv c-warn">'+prazoConsumido+'%</div><div class="rp-ks">do prazo total</div></div><div class="rp-k"><div class="rp-kl">m2 Previstos</div><div class="rp-kv">'+totalPrev+'</div><div class="rp-ks">area total</div></div><div class="rp-k"><div class="rp-kl">m2 Executados</div><div class="rp-kv">'+totalExec.toFixed(1)+'</div><div class="rp-ks">acumulado</div></div><div class="rp-k"><div class="rp-kl">Dias Restantes</div><div class="rp-kv">'+diasRest+'</div><div class="rp-ks">ate conclusao</div></div></div>';
  html+='<div class="rp-note">Progresso geral: <strong>'+geralPct.toFixed(1)+'%</strong> em <strong>'+prazoConsumido+'%</strong> do prazo. '+
    (geralPct>=prazoConsumido?'<span style="color:'+p.good+'">Dentro do prazo.</span>':'<span style="color:'+p.bad+'">Atencao: atraso detectado.</span>')+'</div>';
  html+=_secTitle(2,'Etapas do Cronograma');
  html+='<table><thead><tr><th>Etapa</th><th>Inicio</th><th>Fim</th><th style="text-align:right;">Previsto (m2)</th><th style="text-align:right;">Executado (m2)</th><th style="text-align:center;">Desvio</th><th style="width:18%;">Progresso</th><th style="text-align:center;">Status</th></tr></thead><tbody>';
  etapas.forEach(e=>{
    const pct=pctAtualEtapa(o,e.id),m2=m2ExecutadoEtapa(o,e.id),prev=Number(e.metragemPrevista)||0;
    const atrasado=e.dataFimPrev&&e.dataFimPrev<todayISO()&&pct<100;

      +'<div style="height:5px;border-radius:99px;background:var(--bg-sunken);overflow:hidden;margin-bottom:8px;"><div style="height:100%;width:'+clamp(pct,0,100).toFixed(1)+'%;border-radius:99px;background:'+barCor+';"></div></div>'
      +'<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-faint);">'
        +'<span>Contrato <strong style="color:var(--ink);">'+brl(valorContratoAtual(o))+'</strong></span>'
        +'<span>Recebido <strong style="color:'+barCor+';">'+brl(totalRecebidoCliente(o))+'</strong></span>'
        +'<span style="color:'+barCor+';">'+(atraso?'⚠ Atrasado':'✓ No prazo')+'</span>'
      +'</div>'
    +'</div>';
  });
  html+='</div>';

  html+='<div style="background:var(--bg-card);border:1px solid var(--line);border-radius:12px;overflow:hidden;">'
    +'<div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;">'
      +'<span style="width:3px;height:11px;background:var(--accent);border-radius:2px;display:inline-block;"></span>'
      +'<span style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);">Resumo Financeiro por Obra</span>'
    +'</div>'
    +'<div class="tbl-responsive"><table class="tbl"><thead><tr>'
      +'<th class="col-desc">Obra</th><th class="col-center">Status</th>'
      +'<th class="col-num">Contrato</th><th class="col-num">Gastos</th>'
      +'<th class="col-num">Margem</th><th class="col-num">Recebido</th>'
      +'<th class="col-num">A Receber</th><th class="col-center">Exec.</th>'
    +'</tr></thead><tbody>';
  let tContr=0,tGast=0,tMarg=0,tReceb=0;
  obras.forEach(function(o){
    const cont=valorContratoAtual(o),gast=totalGastosReais(o),rec=totalRecebidoCliente(o),mg=cont-gast,atr=obraTemAtraso(o);
    tContr+=cont;tGast+=gast;tMarg+=mg;tReceb+=rec;
    html+='<tr><td class="col-desc"><strong>'+esc(o.nome)+'</strong><br><small style="color:var(--ink-faint);">'+esc(o.cliente||'')+'</small></td>'
      +'<td class="col-center"><span class="badge '+(o.status==='andamento'?'badge-good':o.status==='parada'?'badge-warn':'badge-neutral')+'">'+(o.status==='andamento'?'Em andamento':o.status==='parada'?'Parada':'Concluida')+'</span></td>'
      +'<td class="col-num">'+brl(cont)+'</td>'
      +'<td class="col-num" style="color:var(--bad);">'+brl(gast)+'</td>'
      +'<td class="col-num" style="color:'+(mg>=0?'var(--good)':'var(--bad)')+';">'+brl(mg)+'</td>'
      +'<td class="col-num" style="color:var(--good);">'+brl(rec)+'</td>'
      +'<td class="col-num" style="color:var(--warn);">'+brl(cont-rec)+'</td>'
      +'<td class="col-center">'+(atr?'<span style="color:var(--warn);">'+pctFisicoGeral(o).toFixed(1)+'% ⚠</span>':pctFisicoGeral(o).toFixed(1)+'%')+'</td></tr>';
  });
  html+='<tr style="font-weight:700;border-top:2px solid var(--line-strong);">'
    +'<td class="col-desc">Total</td><td></td>'
    +'<td class="col-num">'+brl(tContr)+'</td>'
    +'<td class="col-num" style="color:var(--bad);">'+brl(tGast)+'</td>'
    +'<td class="col-num" style="color:'+(tMarg>=0?'var(--good)':'var(--bad)')+';">'+brl(tMarg)+'</td>'
    +'<td class="col-num" style="color:var(--good);">'+brl(tReceb)+'</td>'
    +'<td class="col-num" style="color:var(--warn);">'+brl(tContr-tReceb)+'</td>'
    +'<td></td></tr>'
  +'</tbody></table></div></div>';
  return html;
}

// ================================================================
// WRAPPERS — call mobile or desktop based on screen
// ================================================================
function renderPainelGeral(){return isMobile()?renderPainelGeral_mobile():renderPainelGeral_desktop();}

</script>
</body>
</html>
