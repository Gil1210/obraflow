function renderCronogramaTab(o) {
  const hoje = todayISO();
  const linhas = o.etapas.slice().sort((a, b) => a.ordem - b.ordem).map((e) => {
    const pct = pctAtualEtapa(o, e.id);
    const m2Exec = m2ExecutadoEtapa(o, e.id);
    const atraso = etapaAtrasada(o, e);
    const datasValidas = e.dataInicioPrev && e.dataFimPrev && e.dataFimPrev >= e.dataInicioPrev;
    const diasTotais = datasValidas ? Math.max(1, dayNum(e.dataFimPrev) - dayNum(e.dataInicioPrev)) : 1;
    const diasDecorridos = datasValidas ? clamp(dayNum(hoje) - dayNum(e.dataInicioPrev), 0, diasTotais) : 0;
    const pctPrevisto = datasValidas ? clamp((diasDecorridos / diasTotais) * 100, 0, 100) : 0;
    const pctPrevistoTxt = datasValidas ? Math.round(pctPrevisto) + '%' : '—';
    const gastosEtapa = totalGastosCompras(o, e.id);
    const orcadoEtapa = valorPrevistoEtapa(o, e);

    return '' +
    '<div style="padding:13px 0;border-bottom:1px solid var(--line);">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">' +
        '<div class="val-destaque">' + esc(e.nome) + '</div>' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          (atraso ? '<span class="badge badge-bad">Atrasada</span>' : (pct >= 100 ? '<span class="badge badge-good">Concluída</span>' : '<span class="badge badge-neutral">Em dia</span>')) +
          '<button class="btn btn-ghost btn-sm" onclick="abrirModalEditarEtapa(\'' + e.id + '\')">' + ICONS.edit + '</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="removerEtapaConfirm(\'' + e.id + '\')">' + ICONS.trash + '</button>' +
        '</div>' +
      '</div>' +
      '<div style="color:var(--ink-faint);margin:3px 0 8px;">' + (datasValidas ? (fmtDataCurta(e.dataInicioPrev) + ' → ' + fmtDataCurta(e.dataFimPrev)) : 'Sem datas') + ' · Executado Acumulado: <span class="val-destaque" style="color:var(--accent-dark);">' + m2Exec + ' m²</span> (' + (e.metragemPrevista || 0) + ' m²) · Orçado: <span>' + brl(orcadoEtapa) + '</span> · Gasto: <span style="color:' + (gastosEtapa > orcadoEtapa ? 'var(--bad)' : 'var(--ink)') + ';">' + brl(gastosEtapa) + '</span></div>' +
      '<div style="position:relative;">' +

function novoApontamentoDraft(obra, editId) {

  }
  return {
    data: todayISO(), clima: 'bom',

    equipamentos: [],
    progresso: obra.etapas.map((e) => ({ etapaId: e.id, m2Executado: '' })),
    ocorrencias: '', fotos: [],
    presencasTrabalhadores: (obra.trabalhadores || []).map(t => ({ trabalhadorId: t.id, presente: true, valorDiaria: Number(t.valorDiaria) || 0 })),

function syncDraftFromDOM() {
  const d = state.apontamentoDraft;
  if (!d) return;
  const o = getObra();
  
  const elData = document.getElementById('ap-data');
  if (elData) d.data = elData.value;
  
  const elClima = document.getElementById('ap-clima');
  if (elClima) d.clima = elClima.value;
  
  const elOcorrencias = document.getElementById('ap-ocorrencias');
  if (elOcorrencias) d.ocorrencias = elOcorrencias.value;
  
  if (d.efetivo) {
    d.efetivo.forEach((_, i) => {
      const f = document.getElementById('ef-funcao-' + i);
      const q = document.getElementById('ef-qtd-' + i);
      const t = document.getElementById('ef-tipo-' + i);
      if (f) d.efetivo[i].funcao = f.value;
      if (q) d.efetivo[i].qtd = Number(q.value) || 0;
      if (t) d.efetivo[i].tipo = t.value;
    });
  }
  
  if (d.equipamentos) {
    d.equipamentos.forEach((_, i) => {
      const n = document.getElementById('eq-nome-' + i);
      const h = document.getElementById('eq-horas-' + i);
      if (n) d.equipamentos[i].nome = n.value;
      if (h) d.equipamentos[i].horas = parseMoeda(h.value);
    });
  }
  
  if (o && o.etapas) {
    o.etapas.forEach((e) => {
      const inputEl = document.getElementById('ap-m2-' + e.id);
      if (inputEl) {
        const val = parseMoeda(inputEl.value);
        let item = d.progresso.find((p) => p.etapaId === e.id);
        if (!item) {
          item = { etapaId: e.id, m2Executado: val };
          d.progresso.push(item);
        } else {
          item.m2Executado = val;
        }
      }
    });
  }
}

function draftSetM2(etapaId, val) {
  syncDraftFromDOM();
  const d = state.apontamentoDraft;
  let item = d.progresso.find((p) => p.etapaId === etapaId);
  if (!item) {
    item = { etapaId: etapaId, m2Executado: 0 };
    d.progresso.push(item);
  }
  const m2Hoje = parseMoeda(val);
  item.m2Executado = m2Hoje;
  
  const o = getObra();
  if (!o) return;
  const etapa = o.etapas.find((e) => e.id === etapaId);
  const prevM2 = etapa ? (Number(etapa.metragemPrevista) || 0) : 0;
  
  let m2Outros = 0;
  (o.apontamentos || []).forEach(a => {
    if (a.id !== state.apontamentoEditId) {
      (a.progresso || []).forEach(p => {
        if (p.etapaId === etapaId) m2Outros += Number(p.m2Executado) || 0;
      });
    }
  });

  const totalAcumulado = m2Outros + m2Hoje;
  let pct = 0;
  if (prevM2 > 0) {
    pct = Math.round((totalAcumulado / prevM2) * 100);
  } else if (totalAcumulado > 0) {
    pct = totalAcumulado <= 100 ? Math.round(totalAcumulado) : 100;
  }
  
  const span = document.getElementById('pv-' + etapaId);
  if (span) span.textContent = `+${m2Hoje} m² no dia (Total: ${totalAcumulado} m² · ${pct}%)`;
  salvarSessao();
}

function comprimirFoto(file, callback) {
  const MAX_W = 1920, MAX_H = 1920, QUALITY = 0.88;
  const img = new Image();
  const url = URL.createObjectURL(file);
  img.onload = function() {
    URL.revokeObjectURL(url);
    let w = img.width, h = img.height;
    if (w > MAX_W || h > MAX_H) {
      const ratio = Math.min(MAX_W/w, MAX_H/h);
      w = Math.round(w*ratio); h = Math.round(h*ratio);
    }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    callback(canvas.toDataURL('image/jpeg', QUALITY));
  };
  img.onerror = function() {
    const reader = new FileReader();
    reader.onload = () => callback(reader.result);
    reader.readAsDataURL(file);
  };
  img.src = url;
}

  '<div style="margin-bottom:14px;">' +

    '<h2 class="section-title"><span class="bar"></span>Avanço Físico por Etapa <button class="help-btn" onclick="toggleDica(\'help-avanco\')" title="Ver ajuda">?</button></h2>' +

function renderGastosTab(o) {
  const gastos = (o.gastos || []).slice().sort((a,b)=>b.data.localeCompare(a.data));
  const total   = gastos.reduce((s,g)=>s+Number(g.valor),0);
  const pagos   = gastos.filter(g=>g.statusPagamento==='pago').reduce((s,g)=>s+Number(g.valor),0);
  const pend    = gastos.filter(g=>g.statusPagamento==='pendente').reduce((s,g)=>s+Number(g.valor),0);
  const catLabel = {material:'Material',equipamento:'Equipamento',mao_de_obra:'Mão de Obra',servico:'Serviço',outros:'Outros'};

  const linhas = gastos.map(g => {
    const et = (o.etapas||[]).find(e=>e.id===g.etapaId);
    return '<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(g.descricao) + '</div>' +
        '<div style="color:var(--ink-faint);font-size:12px;">' +
          fmtData(g.data) +
          (catLabel[g.categoria] ? ' · ' + catLabel[g.categoria] : '') +
          (et ? ' · ' + esc(et.nome) : '') +
          (g.fornecedor ? ' · ' + esc(g.fornecedor) : '') +
        '</div>' +
      '</div>' +
      '<div style="text-align:right;flex:none;">' +
        '<div style="font-weight:700;color:var(--bad);">−' + brl(g.valor) + '</div>' +
        '<div style="font-size:11px;color:' + (g.statusPagamento==='pago'?'var(--good)':'var(--warn)') + ';">' + (g.statusPagamento==='pago'?'Pago':'Pendente') + '</div>' +
      '</div>' +
      '<button onclick="removerGasto(\'' + o.id + '\',\'' + g.id + '\')" style="background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:4px;flex:none;">' + ICONS.trash + '</button>' +
    '</div>';
  }).join('');

  return '' +
  /* KPIs linha simples */
  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">' +
    '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;">' +
      '<div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">Total</div>' +
      '<div style="font-weight:700;font-size:16px;">' + brl(total) + '</div>' +
    '</div>' +
    '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;">' +
      '<div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">Pago</div>' +
      '<div style="font-weight:700;font-size:16px;color:var(--good);">' + brl(pagos) + '</div>' +
    '</div>' +
    '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;">' +
      '<div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">Pendente</div>' +
      '<div style="font-weight:700;font-size:16px;color:var(--warn);">' + brl(pend) + '</div>' +
    '</div>' +
  '</div>' +
  /* Ação no topo */
  '<div style="display:flex;justify-content:flex-end;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:4px;">' +
    '<button class="btn btn-ghost btn-sm" onclick="imprimirGastos()">' + ICONS.print + '</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="abrirModalGasto()">' + ICONS.plus + ' Lançar Gasto</button>' +
  '</div>' +
  /* Lista */
  (gastos.length
    ? '<div>' + linhas + '</div>'
    : '<div style="color:var(--ink-faint);text-align:center;padding:32px 0;">Nenhum gasto registrado.</div>');
}


function renderTrabalhadoresTab(o) {
  const lista = o.trabalhadores || [];
  const hoje  = todayISO();
  const folhaDe  = state.folhaDe  || (o.contrato && o.contrato.dataInicio) || todayISO();
  const folhaAte = state.folhaAte || hoje;

  /* Presenças de todos */
  const presencasPorTrab = {};
  (o.apontamentos||[]).forEach(a=>{
    if (a.data>=folhaDe && a.data<=folhaAte) {
      (a.presencasTrabalhadores||[]).forEach(p=>{
        if (p.presente) {
          presencasPorTrab[p.trabalhadorId] = presencasPorTrab[p.trabalhadorId]||[];
          presencasPorTrab[p.trabalhadorId].push({data:a.data, valor:p.valorDiaria, rdoNum:a.numero});
        }
      });
    }
  });

  const totalMO = Object.values(presencasPorTrab).flat().reduce((s,d)=>s+d.valor,0);
  const totalPago = (o.contasPagar||[]).filter(cp=>cp.origem==='apontamento'&&cp.status==='pago'&&cp.dataVencimento>=folhaDe&&cp.dataVencimento<=folhaAte).reduce((s,cp)=>s+Number(cp.valor),0);

  /* Linhas por trabalhador */
  const linhas = lista.map(t => {
    const dias = presencasPorTrab[t.id] || [];
    const bruto = dias.reduce((s,d)=>s+d.valor,0);
    const pago  = (o.contasPagar||[]).filter(cp=>cp.trabalhadorId===t.id&&cp.status==='pago'&&(cp.dataVencimento||'')>=folhaDe&&(cp.dataVencimento||'')<=folhaAte).reduce((s,cp)=>s+Number(cp.valor),0);
    const saldo = bruto - pago;
    const isTExp = state.trabExpanded === t.id;
    const mainTRow = '<div onclick="trabToggleExpand(\'' + t.id + '\')" style="display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;">' +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-weight:600;">' + esc(t.nome) + '</div>' +
        '<div style="color:var(--ink-faint);font-size:12px;">' + esc(t.funcao) + ' · ' + brl(t.valorDiaria) + '/dia · ' + dias.length + ' dia(s)</div>' +
      '</div>' +
      '<div style="text-align:right;flex:none;margin-right:6px;">' +
        '<div style="font-weight:700;">' + brl(bruto) + '</div>' +
        '<div style="font-size:11px;color:' + (dias.length===0?'var(--ink-faint)':saldo>0?'var(--warn)':'var(--good)') + ';">' + (dias.length===0?'Sem dias':saldo>0?'Deve '+brl(saldo):'Quitado') + '</div>' +
      '</div>' +
      '<span style="color:var(--ink-faint);font-size:10px;">' + (isTExp?'▲':'▼') + '</span>' +
    '</div>';
    const acoesTrab = isTExp
      ? '<div style="display:flex;gap:8px;padding:8px 0 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);">' +
          '<button class="btn btn-ghost btn-sm" onclick="abrirRelatorioPresencas(\'' + t.id + '\')">📋 Presenças</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="abrirRelatorioPresencas(\'' + t.id + '\')">Presenças</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="abrirFolhaPagamento(\'' + t.id + '\')">Folha</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="imprimirReciboTrabalhador(\'' + t.id + '\',\'' + folhaDe + '\',\'' + folhaAte + '\')">' + ICONS.print + ' Recibo</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="abrirModalEditarTrabalhador(\'' + t.id + '\')">' + ICONS.edit + ' Editar</button>' +
          '<button class="btn btn-ghost btn-sm" style="color:var(--bad);" onclick="removerTrabalhador(\'' + o.id + '\',\'' + t.id + '\')">' + ICONS.trash + '</button>' +
        '</div>'
      : '<div style="border-bottom:1px solid var(--line);"></div>';
    return mainTRow + acoesTrab;
  }).join('');

  return '' +
  '<h2 style="font-weight:700;font-size:16px;margin:0 0 14px;">Diárias / Equipe</h2>' +
  /* KPIs */
  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;">' +
    '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;">' +
      '<div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">Equipe</div>' +
      '<div style="font-weight:700;font-size:16px;">' + lista.length + '</div>' +
    '</div>' +
    '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;">' +
      '<div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">Total MO</div>' +
      '<div style="font-weight:700;font-size:16px;">' + brl(totalMO) + '</div>' +
    '</div>' +
    '<div style="padding:10px;background:var(--bg-sunken);border-radius:8px;text-align:center;">' +
      '<div style="color:var(--ink-faint);font-size:10px;text-transform:uppercase;">Pago</div>' +
      '<div style="font-weight:700;font-size:16px;color:var(--good);">' + brl(totalPago) + '</div>' +
    '</div>' +
  '</div>' +
  /* Período + ação */
  '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line);margin-bottom:4px;">' +
    '<input type="date" value="' + folhaDe + '" onchange="state.folhaDe=this.value;render();" style="flex:1;min-width:110px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg-sunken);color:var(--ink);">' +
    '<input type="date" value="' + folhaAte + '" onchange="state.folhaAte=this.value;render();" style="flex:1;min-width:110px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg-sunken);color:var(--ink);">' +
    '<button class="btn btn-ghost btn-sm" onclick="abrirModalTrabalhador()">' + ICONS.plus + ' Cadastrar</button>' +
    '<button class="btn btn-ghost btn-sm" onclick="imprimirFolhaGeral()">' + ICONS.print + ' Folha PDF</button>' +
  '</div>' +
  /* Lista */
  (lista.length
    ? '<div>' + linhas + '</div>'
    : '<div style="color:var(--ink-faint);text-align:center;padding:32px 0;">Nenhum trabalhador cadastrado.</div>');
}


function renderGaleriaTab(o) {
  let todasFotos = [];
  (o.apontamentos || []).forEach(a => {
    (a.fotos || []).forEach(src => {
      todasFotos.push({ src, data: a.data });
    });
  });
  todasFotos.sort((a, b) => b.data.localeCompare(a.data));

  const gridHtml = todasFotos.length ? todasFotos.map(f => '' +
    '<div style="position:relative;background:var(--bg-card);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);">' +
      '<img src="' + f.src + '" onclick="abrirFotoFullscreen(this.src)" style="width:100%;aspect-ratio:4/3;object-fit:cover;cursor:pointer;display:block;">' +
      '<div style="padding:8px 10px;color:var(--ink-soft);background:var(--bg-card);border-top:1px solid var(--line);">' + fmtData(f.data) + '</div>' +
    '</div>'
  ).join('') : '<div class="empty">Nenhuma foto registrada nos apontamentos.</div>';

  return '' +
  '<h2 class="section-title"><span class="bar"></span>Galeria Fotográfica da Obra</h2>' +
  '<p style="color:var(--ink-faint);margin:0 0 14px;">Linha do tempo cronológica de todas as imagens capturadas em campo.</p>' +
  '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;">' + gridHtml + '</div>';
}

function abrirFolhaPagamento(trabId) {
  state.modal = { tipo: 'folha-pagamento', trabId };
  render();
}

function renderModalFolhaPagamento(modal) {
  const o = getObra();
  if (!o) return '';
  const trab = (o.trabalhadores || []).find(t => t.id === modal.trabId);
  if (!trab) return '';
  const folhaDe  = state.folhaDe  || o.contrato.dataInicio;
  const folhaAte = state.folhaAte || todayISO();
  const dias = diasTrabalhadosPorTrabalhador(o, trab.id, folhaDe, folhaAte);
  const bruto = dias.reduce((s, d) => s + d.valorDiaria, 0);
  const contasTrab = (o.contasPagar || []).filter(cp =>
    cp.trabalhadorId === trab.id && cp.origem === 'apontamento' &&
    (cp.dataVencimento || '') >= folhaDe && (cp.dataVencimento || '') <= folhaAte
  );
  const pago = contasTrab.filter(cp => cp.status === 'pago').reduce((s,cp)=>s+Number(cp.valor),0);
  const pend = bruto - pago;
  const linhasDias = dias.map(d => {
    const cp = contasTrab.find(c => c.dataVencimento === d.data && c.descricao.includes(trab.nome));
    const status = cp ? cp.status : 'pendente';
    return '<tr>' +
      '<td>' + fmtData(d.data) + '</td>' +
      '<td>RDO-' + d.rdoNum + '</td>' +
      '<td class="col-num">' + brl(d.valorDiaria) + '</td>' +
      '<td class="col-center"><span class="badge ' + (status==='pago'?'badge-good':'badge-warn') + '">' + (status==='pago'?'✓ Pago':'Pendente') + '</span></td>' +
      (cp && cp.status==='pendente' ? '<td><button class="btn btn-primary btn-sm" onclick="abrirModalPagarConta(\'' + o.id + '\',\'' + cp.id + '\')">Pagar</button></td>' : '<td></td>') +
    '</tr>';
  }).join('');
  return '<h3>Folha — ' + esc(trab.nome) + '</h3>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">' +
      '<div class="field" style="flex:1;"><label>De</label><input type="date" value="' + folhaDe + '" onchange="state.folhaDe=this.value;state.modal.trabId=\'' + trab.id + '\';render();"></div>' +
      '<div class="field" style="flex:1;"><label>Até</label><input type="date" value="' + folhaAte + '" onchange="state.folhaAte=this.value;state.modal.trabId=\'' + trab.id + '\';render();"></div>' +
    '</div>' +
    '<div class="grid grid-3" style="margin-bottom:14px;">' +
      '<div class="kpi"><div class="lbl">Dias</div><div class="val">' + dias.length + '</div></div>' +
      '<div class="kpi"><div class="lbl">Bruto</div><div class="val">' + brl(bruto) + '</div></div>' +
      '<div class="kpi"><div class="lbl">Saldo</div><div class="val" style="color:' + (pend>0?'var(--bad)':'var(--good)') + ';">' + (pend>0?brl(pend):'✓ Quitado') + '</div></div>' +
    '</div>' +
    (dias.length ? '<div class="tbl-responsive"><table class="tbl"><thead><tr><th>Data</th><th>RDO</th><th class="col-num">Diária</th><th class="col-center">Status</th><th></th></tr></thead><tbody>' + linhasDias + '</tbody></table></div>' : '<div class="empty">Nenhuma presença no período.</div>') +
    '<div style="display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap;">' +
      '<button class="btn btn-ghost" onclick="fecharModal()">Fechar</button>' +
      (pend > 0 ? '<button class="btn btn-primary" onclick="pagarTodasDiariasEmAberto(\'' + trab.id + '\',\'' + folhaDe + '\',\'' + folhaAte + '\')">💰 Quitar Todas (' + brl(pend) + ')</button>' : '') +
      '<button class="btn btn-ghost" onclick="imprimirReciboTrabalhador(\'' + trab.id + '\',\'' + folhaDe + '\',\'' + folhaAte + '\')">' + ICONS.print + ' Recibo PDF</button>' +
    '</div>';
}

function pagarTodasDiariasEmAberto(trabId, de, ate) {
  const o = getObra();
  if (!o) return;
  const folhaDe  = de  || state.folhaDe  || (o.contrato && o.contrato.dataInicio) || todayISO();
  const folhaAte = ate || state.folhaAte || todayISO();
  const pendentes = (o.contasPagar || []).filter(cp =>
    cp.trabalhadorId === trabId && cp.origem === 'apontamento' &&
    cp.status === 'pendente' &&
    (cp.dataVencimento || '') >= folhaDe && (cp.dataVencimento || '') <= folhaAte
  );
  if (!pendentes.length) { toast('Nenhuma diária pendente no período'); return; }
  pendentes.forEach(cp => { cp.status='pago'; cp.dataPagamento=todayISO(); cp.formaPagamento='PIX'; });
  salvar(); render();
  toast(pendentes.length + ' diária(s) quitada(s)');
  setTimeout(() => imprimirReciboTrabalhador(trabId, folhaDe, folhaAte), 400);
}

function diasTrabalhadosPorTrabalhador(o, trabId, de, ate) {
  const dias = [];
  const trab = (o.trabalhadores || []).find(t => t.id === trabId);
  (o.apontamentos || []).forEach(a => {
    if (de && a.data < de) return;
    if (ate && a.data > ate) return;
    const pt = (a.presencasTrabalhadores || []).find(p => p.trabalhadorId === trabId);
    if (pt && pt.presente) {
      const valDiaria = pt.valorDiaria != null ? Number(pt.valorDiaria) : (trab ? Number(trab.valorDiaria) : 0);
      dias.push({ data: a.data, rdoNum: a.numero, valorDiaria: valDiaria, apontamentoId: a.id });
      return;
    }
    const cp = (o.contasPagar || []).find(c =>
      c.trabalhadorId === trabId && c.origem === 'apontamento' && c.origemId === a.id
    );
    if (cp) dias.push({ data: a.data, rdoNum: a.numero, valorDiaria: Number(cp.valor)||0, apontamentoId: a.id });
  });
  return dias.sort((a,b) => a.data.localeCompare(b.data));
}

function imprimirFolhaGeral() {

  if (!o) return;
  const folhaDe  = state.folhaDe  || o.contrato.dataInicio;
  const folhaAte = state.folhaAte || todayISO();
  const lista    = o.trabalhadores || [];
  const emp      = state.empresa || {};
  if (!lista.length) { toast('Nenhum trabalhador cadastrado'); return; }
  const totalBruto = lista.reduce((s,t)=>s+diasTrabalhadosPorTrabalhador(o,t.id,folhaDe,folhaAte).reduce((ss,d)=>ss+d.valorDiaria,0),0);
  const totalPago  = (o.contasPagar||[]).filter(cp=>cp.origem==='apontamento'&&cp.status==='pago'&&(cp.dataVencimento||'')>=folhaDe&&(cp.dataVencimento||'')<=folhaAte).reduce((s,cp)=>s+Number(cp.valor),0);
  const totalPend  = totalBruto - totalPago;
  const linhas = lista.map((t,i) => {
    const dias  = diasTrabalhadosPorTrabalhador(o,t.id,folhaDe,folhaAte);

    const pago  = (o.contasPagar||[]).filter(cp=>cp.trabalhadorId===t.id&&cp.origem==='apontamento'&&cp.status==='pago'&&(cp.dataVencimento||'')>=folhaDe&&(cp.dataVencimento||'')<=folhaAte).reduce((s,cp)=>s+Number(cp.valor),0);
    const pend  = bruto - pago;
    const bg = i%2===0?'#F8FAFC':'#fff';
    /* Mostra linha consolidada: Dias × Diária = Total */
    return '<tr style="background:'+bg+';">' +

      '<td style="padding:9px 12px;border-bottom:1px solid #E2E8F0;text-align:right;color:#16A34A;">' + brl(pago) + '</td>' +
      '<td style="padding:9px 12px;border-bottom:1px solid #E2E8F0;text-align:right;font-weight:700;color:' + (pend>0?'#D97706':'#16A34A') + ';">' + (pend>0?brl(pend):'✓') + '</td>' +

    '<div><div style="font-size:20px;font-weight:700;">' + esc(emp.razao||'ObraFlow') + '</div></div>' +
    '<div style="text-align:right;"><div style="font-size:15px;font-weight:700;text-transform:uppercase;color:#475569;">FOLHA DE PAGAMENTO</div><div style="font-size:12px;color:#94A3B8;">Emitida em: ' + fmtData(todayISO()) + '</div></div>' +

  '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px;">' +
    '<div style="background:#F8FAFC;border-radius:8px;padding:12px;text-align:center;"><div style="font-size:10px;text-transform:uppercase;color:#94A3B8;margin-bottom:4px;">Total Bruto</div><div style="font-size:18px;font-weight:700;">' + brl(totalBruto) + '</div></div>' +

    '</tr></tfoot>' +

  _abrirImpressao(body, 'Folha de Pagamento — ' + o.nome);
}

  const cp = (o.contasPagar||[]).slice().sort((a,b)=>(a.dataVencimento||'').localeCompare(b.dataVencimento||''));

  const catL = {material:'Material',equipamento:'Equipamento',mao_de_obra:'Mão de Obra',servico:'Serviço',medicao:'Medição',parcela:'Parcela',aditivo:'Aditivo',outros:'Outros'};

  const linhCR = cr.map(x=>'<tr>'+
    '<td>'+fmtData(x.dataVencimento||'')+'</td>'+
    '<td>'+esc(x.descricao)+'</td>'+

function confirmarImportarEtapas() {
  const o = getObra(); if (!o) return;
  const texto = document.getElementById('imp-etapas').value.trim();
  if (!texto) { toast('Cole o conteúdo exportado'); return; }
  const linhas = texto.split('\n').map(l => l.trim()).filter(Boolean);
  let criadas = 0, erros = 0;
  linhas.forEach(linha => {
    const partes = linha.split(';');
    if (partes.length < 2) { erros++; return; }
    const nome = partes[0].trim();
    const valor = parseMoeda(partes[1].trim());
    if (!nome || !valor) { erros++; return; }
    o.etapas = o.etapas || [];
    o.contadores = o.contadores || {};
    o.contadores.etapa = (o.contadores.etapa||0)+1;
    o.etapas.push({
      id: uid(),
      numero: String(o.contadores.etapa).padStart(4,'0'),
      nome: nome,
      valorFixo: valor,
      metragemPrevista: 0,
      dataInicioPrev: '',
      dataFimPrev: '',
      ordem: o.etapas.length,
    });
    criadas++;
  });
  salvar(); fecharModal(); render();
  toast(criadas + ' etapa(s) importada(s)' + (erros ? ' · ' + erros + ' linha(s) inválida(s)' : ''));
}

function togglePresencaDataModal(trabId, data) {
  const o = getObra(); if (!o) return;
  let apt = (o.apontamentos||[]).find(a=>a.data===data);
  if (!apt) {
    o.apontamentos = o.apontamentos || [];
    o.contadores = o.contadores || {};
    o.contadores.apontamento = (o.contadores.apontamento||0)+1;
    apt = {
      id: uid(), numero: String(o.contadores.apontamento).padStart(4,'0'),
      data: data, clima: 'bom', presencasTrabalhadores: [],
      efetivo: [], equipamentos: [], progresso: [], fotos: [], ocorrencias: ''
    };
    o.apontamentos.push(apt);
  }
  apt.presencasTrabalhadores = apt.presencasTrabalhadores || [];
  const t = (o.trabalhadores||[]).find(x=>x.id===trabId);
  const idx = apt.presencasTrabalhadores.findIndex(p=>p.trabalhadorId===trabId);
  if (idx === -1) {
    apt.presencasTrabalhadores.push({ trabalhadorId: trabId, presente: true, valorDiaria: t?t.valorDiaria:0 });
    /* Gera diária no fluxo */
    if (t) {
      o.contasPagar = o.contasPagar || [];
      o.contadores.contaPagar = (o.contadores.contaPagar||0)+1;
      o.contasPagar.push({
        id: uid(), numero: String(o.contadores.contaPagar).padStart(4,'0'),
        descricao: 'Diária — ' + t.nome + ' — ' + fmtData(data),
        valor: Number(t.valorDiaria)||0, dataVencimento: data, dataPagamento: '',
        status: 'pendente', categoria: 'mao_de_obra', etapaId: '',
        observacao: 'RDO-'+apt.numero, origem: 'apontamento',
        origemId: apt.id, trabalhadorId: trabId, formaPagamento: '',
      });
    }
  } else {
    const atual = apt.presencasTrabalhadores[idx].presente;
    apt.presencasTrabalhadores[idx].presente = !atual;
    if (atual) {
      o.contasPagar = (o.contasPagar||[]).filter(cp=>!(cp.trabalhadorId===trabId&&cp.origemId===apt.id&&cp.origem==='apontamento'));
    }
  }
  salvar();
  state.modal = { tipo: 'relatorio-dia', data: data };
  render();
}

  h += '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;">';
  h += '<div class="field" style="flex:1;"><label>De</label><input type="date" value="' + folhaDe + '" onchange="state.folhaDe=this.value;_reabrirPresencas(\''+trab.id+'\');"></div>';
  h += '<div class="field" style="flex:1;"><label>Até</label><input type="date" value="' + folhaAte + '" onchange="state.folhaAte=this.value;_reabrirPresencas(\''+trab.id+'\');"></div>';
  h += '</div>';
  var diasPres = 0; var total = 0;
  apts.forEach(function(apt) {
    var pt = (apt.presencasTrabalhadores||[]).find(function(p){return p.trabalhadorId===trab.id;});
    var presente = pt && pt.presente;
    var valDiaria = pt && pt.valorDiaria != null ? Number(pt.valorDiaria) : Number(trab.valorDiaria);
    if (presente) { diasPres++; total += valDiaria; }
  });
  h += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">';
  h += '<div class="kpi"><div class="lbl">Dias</div><div class="val">' + diasPres + '</div></div>';
  h += '<div class="kpi"><div class="lbl">Total</div><div class="val">' + brl(total) + '</div></div>';
  h += '<div class="kpi"><div class="lbl">Diária</div><div class="val">' + brl(trab.valorDiaria) + '</div></div>';
  h += '</div>';
  if (apts.length) {
    apts.forEach(function(apt) {
      var pt = (apt.presencasTrabalhadores||[]).find(function(p){return p.trabalhadorId===trab.id;});
      var presente = pt && pt.presente;
      var valDiaria = pt && pt.valorDiaria != null ? Number(pt.valorDiaria) : Number(trab.valorDiaria);
      var dow = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][new Date(apt.data+'T12:00:00').getDay()];
      var bg = presente ? 'var(--good)' : 'var(--bg-sunken)';
      var col = presente ? '#fff' : 'var(--ink-soft)';
      var bdr = presente ? 'var(--good)' : 'var(--line)';
      var lbl = presente ? '✓ Pres.' : 'Ausente';
      h += '<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);">';
      h += '<div style="flex:1;"><div style="font-weight:600;">' + fmtData(apt.data) + ' <span style="color:var(--ink-faint);font-size:11px;">' + dow + '</span></div>';
      h += '<div style="color:var(--ink-faint);font-size:11px;">RDO-' + (apt.numero||'?') + '</div></div>';
      h += '<div style="font-size:13px;color:var(--ink-soft);margin-right:8px;">' + (presente?brl(valDiaria):'—') + '</div>';
      h += '<div data-tid="' + trab.id + '" data-dt="' + apt.data + '" onclick="togglePresencaDataModal(this.dataset.tid,this.dataset.dt);_reabrirPresencas(this.dataset.tid);" style="padding:5px 10px;border-radius:16px;font-size:12px;font-weight:600;cursor:pointer;background:' + bg + ';color:' + col + ';border:1px solid ' + bdr + ';">' + lbl + '</div>';
      h += '</div>';
    });
  } else {
    h += '<div class="empty">Nenhum apontamento no período.</div>';
  }
  h += '<div style="margin-top:14px;background:var(--bg-sunken);border-radius:8px;padding:12px;">';
  h += '<div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Adicionar dia avulso:</div>';
  h += '<div style="display:flex;gap:8px;align-items:center;">';
  h += '<input type="date" id="pres-add-data" max="' + todayISO() + '" style="flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);">';
  h += '<button class="btn btn-primary btn-sm" data-tid="' + trab.id + '" onclick="adicionarDiaAvulso(this.dataset.tid)">+ Dia</button>';
  h += '</div></div>';
  h += '<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap;">';
  h += '<button class="btn btn-ghost" onclick="fecharModal()">Fechar</button>';
  h += '<button class="btn btn-ghost btn-sm" data-tid="' + trab.id + '" data-de="' + folhaDe + '" data-ate="' + folhaAte + '" onclick="imprimirReciboTrabalhador(this.dataset.tid,this.dataset.de,this.dataset.ate)">' + ICONS.print + ' Recibo</button>';
  h += '<button class="btn btn-primary" data-tid="' + trab.id + '" onclick="abrirFolhaPagamento(this.dataset.tid)">Folha Pag.</button>';
  h += '</div>';
  return h;
}

function _abrirImpressao(bodyHtml, titulo) {
  const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(titulo) + '</title><style>' + _printCss() + '</style></head><body>' +
    '<div class="btnbar"><button onclick="window.print()">Imprimir / Salvar PDF Executivo</button></div>' +
    '<div class="page">' + bodyHtml +

function renderRdoTab(o) {
  const lista = o.apontamentos.slice().sort((a, b) => b.data.localeCompare(a.data));
  if (!lista.length) {
    return relatorioHeadHtml(o, false, 'RDO') +
    '<div class="empty">Nenhum apontamento ainda.</div>';
  }

  var linhas = '';
  for (var ii=0; ii<lista.length; ii++) {
    var a = lista[ii];
    /* Equipe própria */
    var proprios = (a.presencasTrabalhadores || []).filter(function(p){return p.presente;}).map(function(p){
      var t = (o.trabalhadores || []).find(function(t){return t.id===p.trabalhadorId;});
      return t ? esc(t.nome)+' ('+esc(t.funcao)+')' : null;
    }).filter(Boolean);
    /* Terceiros */
    var terceiros = (a.efetivo || []).filter(function(e){return e.funcao;}).map(function(e){
      return e.qtd+'x '+esc(e.funcao)+(e.tipo==='subempreiteiro_custo'?' [R$'+brl(parseMoeda(e.valor||'0'))+']':'');
    });
    var equipTxt = (a.equipamentos || []).filter(function(e){return e.nome;}).map(function(e){
      return esc(e.nome)+(e.horas?' ('+e.horas+'h)':'');
    }).join(', ') || '—';
    var progresso = (a.progresso || []).filter(function(p){return Number(p.m2Executado)>0;}).map(function(p){
      var et = (o.etapas || []).find(function(e){return e.id===p.etapaId;});
      return (et?esc(et.nome):'?')+': '+p.m2Executado+' m²';
    });
    var totalPessoas = proprios.length + (a.efetivo||[]).filter(function(e){return e.funcao;}).reduce(function(s,e){return s+(Number(e.qtd)||1);},0);
    /* Fotos */
    var fotos = (a.fotos || []);
    var fotosHtml = fotos.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">' +
      fotos.map(function(f){ return '<img src="'+f+'" onclick="abrirFotoFullscreen(this.src)" style="width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;">'; }).join('') +
    '</div>' : '';

    linhas += '<div style="margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--line);">';
    linhas += '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">';
    linhas += '<span class="badge badge-neutral">RDO-'+(a.numero||'0001')+'</span>';
    linhas += '<span style="font-weight:600;">'+fmtData(a.data)+'</span>';
    linhas += '<span style="color:var(--ink-faint);">· '+esc(a.clima.toUpperCase())+'</span>';
    linhas += '<span style="color:var(--ink-faint);">· '+totalPessoas+' pessoa(s)</span>';
    linhas += '</div>';
    /* Equipe */
    if (proprios.length || terceiros.length) {
      linhas += '<div style="margin-bottom:6px;">';
      linhas += '<div style="color:var(--ink-faint);font-size:11px;text-transform:uppercase;margin-bottom:4px;">'+ICONS.trabalhadores+'  Equipe</div>';
      if (proprios.length) linhas += '<div style="font-size:13px;">'+proprios.join(' · ')+'</div>';
      if (terceiros.length) linhas += '<div style="font-size:13px;color:var(--ink-soft);">Terceiros: '+terceiros.join(', ')+'</div>';
      linhas += '</div>';
    }
    /* Equipamentos */
    linhas += '<div style="margin-bottom:6px;"><span style="color:var(--ink-faint);font-size:11px;text-transform:uppercase;">Equipamentos: </span><span style="font-size:13px;">'+equipTxt+'</span></div>';
    /* Avanço */
    if (progresso.length) {
      linhas += '<div style="margin-bottom:6px;"><span style="color:var(--ink-faint);font-size:11px;text-transform:uppercase;">Avanço: </span><span style="color:var(--good);font-size:13px;">'+progresso.join(' | ')+'</span></div>';
    }
    /* Ocorrências */
    if (a.ocorrencias) {
      linhas += '<div style="margin-bottom:6px;"><div style="color:var(--ink-faint);font-size:11px;text-transform:uppercase;margin-bottom:2px;">Ocorrências</div><div style="font-size:13px;white-space:pre-wrap;">'+esc(a.ocorrencias)+'</div></div>';
    }
    /* Fotos */
    if (fotosHtml) linhas += fotosHtml;
    linhas += '</div>';
  }

  return relatorioHeadHtml(o, false, 'RDO') +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:12px;">' +
      '<h2 class="section-title"><span class="bar"></span>RDO — Relatório Diário de Obra</h2>' +
      '<button class="btn btn-ghost btn-sm" onclick="imprimirRDO()">'+ICONS.print+' PDF</button>' +
    '</div>' +
    '<div>' + linhas + '</div>';
}


function imprimirRDO() {
  const o = getObra();
  const lista = o.apontamentos.slice().sort((a,b) => a.data.localeCompare(b.data));
  if (!lista.length) { toast('Nenhum apontamento registrado.'); return; }

  var linhas = '';
  lista.forEach(function(a, idx) {
    var proprios = (a.presencasTrabalhadores||[]).filter(function(p){return p.presente;}).map(function(p){
      var t = (o.trabalhadores||[]).find(function(t){return t.id===p.trabalhadorId;});
      return t ? t.nome+' ('+t.funcao+')' : null;
    }).filter(Boolean);
    var terceiros = (a.efetivo||[]).filter(function(e){return e.funcao;}).map(function(e){return e.qtd+'x '+e.funcao;});
    var equip = (a.equipamentos||[]).filter(function(e){return e.nome;}).map(function(e){return e.nome+(e.horas?' ('+e.horas+'h)':'');}).join(', ')||'—';
    var prog = (a.progresso||[]).filter(function(p){return Number(p.m2Executado)>0;}).map(function(p){
      var et = (o.etapas||[]).find(function(e){return e.id===p.etapaId;});
      return (et?et.nome:'?')+': '+p.m2Executado+' m²';
    }).join(' | ')||'';
    var fotos = (a.fotos||[]);
    var fotosHtml = fotos.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;">'+
      fotos.map(function(f){return '<img src="'+f+'" style="width:100px;height:100px;object-fit:cover;border-radius:6px;border:1px solid #E2E8F0;">';}).join('')+
    '</div>' : '';
    var bg = idx%2===0?'#F8FAFC':'#fff';
    linhas += '<div style="margin-bottom:16px;border:1px solid #E2E8F0;padding:14px;border-radius:8px;background:'+bg+';page-break-inside:avoid;">';
    linhas += '<div style="display:flex;justify-content:space-between;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #E2E8F0;">';
    linhas += '<strong>RDO-'+(a.numero||'0001')+'</strong> &nbsp; '+fmtData(a.data);
    linhas += '<span style="color:#64748B;">Clima: '+esc(a.clima.toUpperCase())+'</span>';
    linhas += '</div>';
    if (proprios.length) linhas += '<div style="margin-bottom:6px;"><span style="color:#64748B;font-size:11px;text-transform:uppercase;">Equipe Própria</span><br>'+proprios.join(', ')+'</div>';
    if (terceiros.length) linhas += '<div style="margin-bottom:6px;"><span style="color:#64748B;font-size:11px;text-transform:uppercase;">Terceiros</span><br>'+terceiros.join(', ')+'</div>';
    linhas += '<div style="margin-bottom:6px;"><span style="color:#64748B;font-size:11px;text-transform:uppercase;">Equipamentos</span><br>'+equip+'</div>';
    if (prog) linhas += '<div style="margin-bottom:6px;"><span style="color:#64748B;font-size:11px;text-transform:uppercase;">Avanço</span><br><span style="color:#16A34A;">'+prog+'</span></div>';
    linhas += '<div style="margin-bottom:6px;"><span style="color:#64748B;font-size:11px;text-transform:uppercase;">Ocorrências</span><br>'+(a.ocorrencias?esc(a.ocorrencias):'—')+'</div>';
    if (fotosHtml) linhas += '<div><span style="color:#64748B;font-size:11px;text-transform:uppercase;">Fotos</span>'+fotosHtml+'</div>';
    linhas += '</div>';
  });

  var body = relatorioHeadHtml(o, true, 'RELATÓRIO DIÁRIO DE OBRA') +
    '<div class="doctitle"><div class="doctitle-inner"><span class="bar"></span><h1>Relatório Diário de Obra (RDO)</h1></div></div>' +
    '<p style="color:#64748B;margin-bottom:16px;">'+lista.length+' apontamento(s) · Gerado em '+fmtData(todayISO())+'</p>' +
    linhas;
  _abrirImpressao(body, 'RDO — ' + o.nome);
}

function pointsToSmoothPath(pts) {
  if (!pts || !pts.length) return '';
  if (pts.length === 1) return 'M ' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
  if (pts.length === 2) return 'M ' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1) + ' L ' + pts[1].x.toFixed(1) + ',' + pts[1].y.toFixed(1);
  
  let d = 'M ' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i === 0 ? i : i - 1];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2 < pts.length ? i + 2 : i + 1];

    const cp1x = p1.x + (p2.x - p0.x) / 6;
    const cp1y = p1.y + (p2.y - p0.y) / 6;
    const cp2x = p2.x - (p3.x - p1.x) / 6;
    const cp2y = p2.y - (p3.y - p1.y) / 6;

    d += ' C ' + cp1x.toFixed(1) + ',' + cp1y.toFixed(1) + ' ' + cp2x.toFixed(1) + ',' + cp2y.toFixed(1) + ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1);
  }
  return d;
}

function renderCurvaTab(o) {
  if (!o.etapas.length) return '<h2 class="section-title"><span class="bar"></span>Curva S</h2><div class="empty">Cadastre etapas no Cronograma pra gerar a curva.</div>';
  const inicio = dayNum(o.contrato.dataInicio);
  const fim = dayNum(o.contrato.dataFimPrevista);
  const totalDias = Math.max(1, fim - inicio);
  const hojeDay = dayNum(todayISO());

  const W = 680, H = 280, PAD_LEFT = 40, PAD_RIGHT = 30, PAD_TOP = 25, PAD_BOT = 35;
  const graphW = W - PAD_LEFT - PAD_RIGHT;
  const graphH = H - PAD_TOP - PAD_BOT;

  const xAtDay = (d) => PAD_LEFT + clamp((d - inicio) / totalDias, 0, 1) * graphW;
  const yAtPct = (v) => PAD_TOP + graphH - (clamp(v, 0, 100) / 100) * graphH;

  const passosPrev = 24;
  const pontosPrevCoords = [];
  for (let i = 0; i <= passosPrev; i++) {
    const dia = inicio + Math.round((i / passosPrev) * totalDias);
    let prev = 0;
    o.etapas.forEach((e) => {
      const peso = pesoEtapa(o, e);
      const eIni = dayNum(e.dataInicioPrev), eFim = Math.max(eIni + 1, dayNum(e.dataFimPrev));
      const fracaoPrev = clamp((dia - eIni) / (eFim - eIni), 0, 1);
      prev += peso * fracaoPrev * 100;
    });
    pontosPrevCoords.push({ dia, x: xAtDay(dia), y: yAtPct(prev), prev });
  }
  const dPrev = pointsToSmoothPath(pontosPrevCoords);

  const m2MapByDayEtapa = {};
  (o.apontamentos || []).forEach((a) => {
    const d = dayNum(a.data);
    if (!m2MapByDayEtapa[d]) m2MapByDayEtapa[d] = {};
    (a.progresso || []).forEach((p) => {
      if (p.etapaId) {
        m2MapByDayEtapa[d][p.etapaId] = (m2MapByDayEtapa[d][p.etapaId] || 0) + (Number(p.m2Executado) || 0);
      }
    });
  });

  const datasRealSet = new Set([inicio]);
  (o.apontamentos || []).forEach((a) => {
    const d = dayNum(a.data);
    if (d >= inicio && d <= hojeDay) datasRealSet.add(d);
  });
  if (hojeDay >= inicio) datasRealSet.add(hojeDay);
  const datasReal = Array.from(datasRealSet).sort((a, b) => a - b);

  const acumuladoM2PorEtapa = {};
  const pesosEtapas = {};
  o.etapas.forEach(e => {
    acumuladoM2PorEtapa[e.id] = 0;
    pesosEtapas[e.id] = pesoEtapa(o, e);
  });

  const todosDiasRdo = Object.keys(m2MapByDayEtapa).map(Number).sort((a, b) => a - b);
  const pontosRealCoords = [];
  let rdoIdx = 0;

  datasReal.forEach((dia) => {
    while (rdoIdx < todosDiasRdo.length && todosDiasRdo[rdoIdx] <= dia) {
      const dRdo = todosDiasRdo[rdoIdx];
      const m2Dia = m2MapByDayEtapa[dRdo];
      if (m2Dia) {
        Object.keys(m2Dia).forEach(eId => {
          acumuladoM2PorEtapa[eId] = (acumuladoM2PorEtapa[eId] || 0) + m2Dia[eId];
        });
      }
      rdoIdx++;
    }

    let real = 0;
    o.etapas.forEach((e) => {
      const peso = pesosEtapas[e.id] || 0;
      const m2NaData = acumuladoM2PorEtapa[e.id] || 0;
      const prevM2 = Number(e.metragemPrevista) || 0;
      let pctNaData = 0;
      if (prevM2 > 0) {
        pctNaData = clamp((m2NaData / prevM2) * 100, 0, 100);
      } else if (m2NaData > 0) {
        pctNaData = m2NaData <= 100 ? clamp(m2NaData, 0, 100) : 100;
      }
      real += peso * pctNaData;
    });
    pontosRealCoords.push({ dia, x: xAtDay(dia), y: yAtPct(real), real });
  });

  const dReal = pointsToSmoothPath(pontosRealCoords);

  const ultimoPonto = pontosRealCoords[pontosRealCoords.length - 1] || { dia: inicio, x: PAD_LEFT, y: PAD_TOP + graphH, real: 0 };
  const pctRealAtual = pctFisicoGeral(o);
  
  const primeiroApontamento = (o.apontamentos || []).slice().sort((a, b) => a.data.localeCompare(b.data))[0];
  const diaInicioReal = primeiroApontamento ? Math.min(inicio, dayNum(primeiroApontamento.data)) : inicio;
  const diasDecorridosReais = Math.max(1, hojeDay - diaInicioReal);
  const qtdApontamentos = (o.apontamentos || []).length;

  const ritmoPlanejado = 100 / totalDias;
  const ritmoRealBruto = pctRealAtual / diasDecorridosReais;
  
  const pesoAmostra = clamp(diasDecorridosReais / (totalDias * 0.50), 0.05, 1.0);
  const ritmoPonderado = (pesoAmostra * ritmoRealBruto) + ((1 - pesoAmostra) * ritmoPlanejado);

  let diaTerminoProj = fim;
  let txtProjecao = 'Calculando tendência...';
  let badgeProjecaoClass = 'badge-neutral';
  let temProjecaoValida = false;

  if (pctRealAtual >= 100) {
    txtProjecao = 'Obra 100% Concluída';
    badgeProjecaoClass = 'badge-good';
  } else if (qtdApontamentos < 2 || diasDecorridosReais < 2) {
    txtProjecao = 'Tendência: Aguardando mais apontamentos (mín. 2 dias)';
    badgeProjecaoClass = 'badge-neutral';
  } else if (ritmoPonderado > 0) {
    temProjecaoValida = true;
    const diasFaltantes = (100 - pctRealAtual) / ritmoPonderado;
    diaTerminoProj = Math.round(hojeDay + diasFaltantes);
    const difDias = diaTerminoProj - fim;

    if (Math.abs(difDias) <= 3) {
      txtProjecao = 'Término estimado: ' + fmtData(isoFromDayNum(diaTerminoProj)) + ' (No prazo do contrato)';
      badgeProjecaoClass = 'badge-good';
    } else if (difDias > 0) {
      txtProjecao = 'Término estimado: ' + fmtData(isoFromDayNum(diaTerminoProj)) + ' (' + difDias + ' dias de atraso)';
      badgeProjecaoClass = 'badge-bad';
    } else {
      txtProjecao = 'Término estimado: ' + fmtData(isoFromDayNum(diaTerminoProj)) + ' (' + Math.abs(difDias) + ' dias adiantado)';
      badgeProjecaoClass = 'badge-good';
    }
  }

  const xProjFim = xAtDay(diaTerminoProj);
  const yProjFim = yAtPct(100);
  const dTrend = 'M ' + ultimoPonto.x.toFixed(1) + ',' + ultimoPonto.y.toFixed(1) + ' L ' + xProjFim.toFixed(1) + ',' + yProjFim.toFixed(1);

  const dotsHtml = pontosRealCoords.map((pt) =>
    '<circle cx="' + pt.x.toFixed(1) + '" cy="' + pt.y.toFixed(1) + '" r="5" fill="var(--accent)" stroke="#fff" stroke-width="2"><title>' + fmtData(isoFromDayNum(pt.dia)) + ': ' + Math.round(pt.real) + '% executado</title></circle>'
  ).join('');

  const gridLines = [0, 25, 50, 75, 100].map((v) =>
    '<line x1="' + PAD_LEFT + '" y1="' + yAtPct(v) + '" x2="' + (W - PAD_RIGHT) + '" y2="' + yAtPct(v) + '" stroke="var(--line)" stroke-width="1"/><text x="4" y="' + (yAtPct(v) + 4) + '" fill="var(--ink-faint)">' + v + '%</text>'
  ).join('');

  const svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;overflow:visible;">' +
    gridLines +
    '<path d="' + dPrev + '" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-dasharray="5,4"/>' +
    (temProjecaoValida ? '<path d="' + dTrend + '" fill="none" stroke="var(--warn)" stroke-width="2" stroke-dasharray="4,3"/>' : '') +
    '<path d="' + dReal + '" fill="none" style="stroke:var(--accent);" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    dotsHtml +
    (temProjecaoValida ? '<circle cx="' + xProjFim.toFixed(1) + '" cy="' + yProjFim.toFixed(1) + '" r="4" fill="var(--warn)" stroke="#fff" stroke-width="1.5"><title>Projeção de término: ' + fmtData(isoFromDayNum(diaTerminoProj)) + '</title></circle>' : '') +
    '</svg>';

  const pctPrazo = Math.round((clamp(hojeDay - inicio, 0, totalDias) / totalDias) * 100);
  const diasChuva = diasParadosClima(o);

  return '' +
  '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;">' +
    '<h2 class="section-title" style="margin:0;"><span class="bar"></span>Curva S (Suavização Bezier & Projeção Trend)</h2>' +
    '<span class="badge ' + badgeProjecaoClass + '">🔮 ' + esc(txtProjecao) + '</span>' +
  '</div>' +
  '<div class="card">' +
    '<div style="display:flex;gap:18px;margin-bottom:12px;flex-wrap:wrap;color:var(--ink-soft);">' +
      '<span><span style="display:inline-block;width:14px;height:3px;background:var(--ink-faint);vertical-align:middle;margin-right:5px;"></span>Previsto (Linha de Base)</span>' +
      '<span><span style="display:inline-block;width:14px;height:3px;background:var(--accent);vertical-align:middle;margin-right:5px;"></span>Realizado Suave Bezier (' + Math.round(pctRealAtual) + '%)</span>' +
      (temProjecaoValida ? '<span><span style="display:inline-block;width:14px;height:3px;background:var(--warn);vertical-align:middle;margin-right:5px;"></span>Projeção de Tendência (Forecast)</span>' : '') +
    '</div>' +
    svg +
    '<div style="display:flex;justify-content:space-between;margin-top:14px;color:var(--ink-soft);flex-wrap:wrap;gap:8px;border-top:1px solid var(--line);padding-top:10px;">' +
      '<span>Prazo Decorrido: <span class="val-destaque">' + pctPrazo + '%</span></span>' +
      '<span>Ritmo Médio Ponderado: <span class="val-destaque" style="color:var(--accent);">' + (ritmoPonderado > 0 ? ritmoPonderado.toFixed(2) + '% / dia' : '—') + '</span></span>' +
      '<span>Dias Parados por Chuva: <span style="color:var(--warn);" class="val-destaque">🌧️ ' + diasChuva + ' dia(s)</span></span>' +
      '<span>Físico Realizado: <span style="color:var(--good);" class="val-destaque">' + Math.round(pctRealAtual) + '%</span></span>' +
    '</div>' +
  '</div>';
}

function renderMedicaoTab(o) {
  const lista = o.medicoes.slice().sort((a, b) => b.dataEmissao.localeCompare(a.dataEmissao));
  const linhas = lista.map((m) => {
    const totalEtapas = (m.itens || []).reduce((a, i) => a + (Number(i.valorLiberado) || 0), 0);
    const totalAvulsos = (m.itensAvulsos || []).reduce((a, i) => a + (i.tipo === 'deducao' ? -i.valor : i.valor), 0);
    const totalLiberado = totalEtapas + totalAvulsos;
    const itensTxt = (m.itens || []).map((i) => {
      const et = o.etapas.find((e) => e.id === i.etapaId);
      return '<tr><td class="col-desc">' + esc(et ? et.nome : '—') + '</td><td class="col-num">' + Math.round(i.pctAcumulado * 100) / 100 + '%</td><td class="col-num">' + brl(i.valorLiberado) + '</td></tr>';
    }).join('');
    return '' +
    '<div class="card" style="margin-bottom:10px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
        '<div><div class="val-destaque">MED-' + (m.numero || '0001') + ' · ' + fmtData(m.periodoInicio) + ' a ' + fmtData(m.periodoFim) + '</div>' +
        '<div style="color:var(--ink-faint);">Emitida em ' + fmtData(m.dataEmissao) + '</div></div>' +
        (m.status === 'aprovada' ? '<span class="badge badge-good">✓ Aprovada</span>' : '<span class="badge badge-warn">⏳ Aberta</span>') +
      '</div>' +
      '<div class="tbl-responsive"><table class="tbl"><thead><tr><th class="col-desc">Etapa</th><th class="col-num">% Acumulado</th><th class="col-num">Valor a Liberar</th></tr></thead><tbody>' + itensTxt + '</tbody></table></div>' +
      '<div style="text-align:right;margin-top:8px;" class="val-destaque">Total: ' + brl(totalLiberado) + '</div>' +
      (m.status !== 'aprovada' ? (
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">' +
          '<button class="btn btn-ghost btn-sm" onclick="editarMedicao(\'' + m.id + '\')">' + ICONS.edit + ' Editar</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="excluirMedicao(\'' + o.id + '\',\'' + m.id + '\')">' + ICONS.trash + ' Excluir</button>' +
          '<button class="btn btn-primary btn-sm" onclick="aprovarMedicao(\'' + o.id + '\',\'' + m.id + '\')">Aprovar Medição</button>' +
        '</div>'
      ) : (
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap;">' +
          '<button class="btn btn-danger btn-sm" onclick="desfazerAprovarMedicao(\'' + o.id + '\',\'' + m.id + '\')">↩ Desfazer Aprovação / Estornar</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="imprimirRecibo(\'' + m.id + '\')">' + ICONS.print + ' Gerar Recibo</button>' +
        '</div>'
      )) +
    '</div>';
  }).join('');

  return '' +
  '<div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 10px;margin-bottom:6px;">' +
    '<h2 class="section-title"><span class="bar"></span>Medição de Serviços</h2>' +
    '<button class="btn btn-primary btn-sm" onclick="abrirModalMedicao()">' + ICONS.plus + ' Nova Medição</button>' +
  '</div>' +
  (lista.length ? linhas : '<div class="empty">Nenhuma medição gerada ainda.</div>');
}

function imprimirRecibo(medId) {
  const o = getObra();
  const m = o.medicoes.find((x) => x.id === medId);
  if (!m) return;
  const totalEtapas = (m.itens || []).reduce((a, i) => a + (Number(i.valorLiberado) || 0), 0);
  const totalAvulsos = (m.itensAvulsos || []).reduce((a, i) => a + (i.tipo === 'deducao' ? -i.valor : i.valor), 0);
  const total = totalEtapas + totalAvulsos;
  const numero = m.numero || '0001';
  const body = relatorioHeadHtml(o, true, 'RECIBO DE MEDIÇÃO') +
    '<div class="doctitle"><div class="doctitle-inner"><span class="bar"></span><h1>Comprovante de Recibo de Medição</h1></div><div class="val-destaque">MED-' + numero + '</div></div>' +
    '<div class="kpis"><div class="kpi"><span>Valor Liberado</span><div class="val-kpi">' + brl(total) + '</div></div></div>';
  _abrirImpressao(body, 'Recibo REC-' + numero);
}

function renderFinanceiroTab(o) {

function editarMetragemTotal(val) {
  const o = getObra();
  o.metragemTotal = parseMoeda(val);
  salvar(); render();
  toast('Metragem total atualizada');
}


function setClimaRapido(clima, hoje) {
  const o = getObra();
  if (!o) return;
  state._climaRapido = clima;
  let apt = (o.apontamentos || []).find(a => a.data === hoje);
  if (apt) {
    apt.clima = clima;
    salvar();
  }
  render();
}

function togglePresencaRapida(trabId) {
  const o = getObra();
  if (!o) return;
  const hoje = todayISO();
  const dataPresenca = state.presencaData || hoje;
  let apt = (o.apontamentos || []).find(a => a.data === dataPresenca);
  if (!apt) {
    /* Cria apontamento do dia se não existir */
    o.contadores = o.contadores || {};
    o.contadores.rdo = (o.contadores.rdo || 0) + 1;
    apt = {
      id: uid(), numero: String(o.contadores.rdo).padStart(4,'0'),
      data: dataPresenca, clima: 'bom', efetivo: [], equipamentos: [],
      progresso: o.etapas.map(e => ({ etapaId: e.id, m2Executado: '' })),
      ocorrencias: '', fotos: [],
      presencasTrabalhadores: (o.trabalhadores || []).map(t => ({ trabalhadorId: t.id, presente: false, valorDiaria: Number(t.valorDiaria) || 0 })),
    };
    o.apontamentos = o.apontamentos || [];
    o.apontamentos.push(apt);
  }
  apt.presencasTrabalhadores = apt.presencasTrabalhadores || [];
  const pt = apt.presencasTrabalhadores.find(p => p.trabalhadorId === trabId);
  const trab = (o.trabalhadores || []).find(t => t.id === trabId);
  if (pt) {
    pt.presente = !pt.presente;
  } else {
    apt.presencasTrabalhadores.push({ trabalhadorId: trabId, presente: true, valorDiaria: trab ? Number(trab.valorDiaria) : 0 });
  }
  /* Gera/remove conta a pagar de diária */
  o.contasPagar = (o.contasPagar || []).filter(cp => !(cp.trabalhadorId === trabId && cp.origem === 'apontamento' && cp.dataVencimento === dataPresenca));
  const ptAtual = apt.presencasTrabalhadores.find(p => p.trabalhadorId === trabId);
  if (ptAtual && ptAtual.presente && trab) {
    o.contadores.contaPagar = (o.contadores.contaPagar || 0) + 1;
    o.contasPagar.push({
      id: uid(), numero: String(o.contadores.contaPagar).padStart(4,'0'),
      descricao: 'Diária — ' + trab.nome + ' (' + trab.funcao + ')',
      fornecedor: trab.nome, valor: ptAtual.valorDiaria,
      dataEmissao: dataPresenca, dataVencimento: dataPresenca, dataPagamento: '',
      status: 'pendente', categoria: 'mao_de_obra', etapaId: '',
      observacao: 'RDO-' + apt.numero, origem: 'apontamento',
      origemId: apt.id, trabalhadorId: trabId, formaPagamento: '',
    });
  }
  salvar(); render();
}

function salvarApontamentoRapido() {
  const o = getObra();
  if (!o) return;
  const hoje = todayISO();
  const el = document.getElementById('ocorr-rapida');
  const texto = el ? el.value.trim() : '';
  let apt = (o.apontamentos || []).find(a => a.data === hoje);
  if (!apt) {
    o.contadores = o.contadores || {};
    o.contadores.rdo = (o.contadores.rdo || 0) + 1;
    apt = {
      id: uid(), numero: proximoNumero(o, 'rdo'),
      data: hoje, clima: state._climaRapido || 'bom', efetivo: [], equipamentos: [],
      progresso: o.etapas.map(e => ({ etapaId: e.id, m2Executado: '' })),
      ocorrencias: texto, fotos: [],
      presencasTrabalhadores: (o.trabalhadores || []).map(t => ({ trabalhadorId: t.id, presente: false, valorDiaria: Number(t.valorDiaria) || 0 })),
    };
    o.apontamentos.push(apt);
  } else {
    apt.ocorrencias = texto;
    if (state._climaRapido) apt.clima = state._climaRapido;
  }
  /* Salvar m² por etapa */
  apt.progresso = apt.progresso || [];
  (o.etapas || []).forEach(e => {
    const el = document.getElementById('m2-' + e.id);
    if (!el) return;
    const val = el.value.trim();
    let prog = apt.progresso.find(p => p.etapaId === e.id);
    if (prog) prog.m2Executado = val;
    else apt.progresso.push({ etapaId: e.id, m2Executado: val });
  });
  salvar();
  toast('✓ RDO-' + apt.numero + ' salvo — clima: ' + apt.clima + (apt.progresso.some(p=>p.m2Executado) ? ' · m² registrado' : ''));
  irTab('rdo');
}

/* ── Modal de confirmação interno (substitui confirm() nativo) ── */


function preencherValorMedicao(sel) {
  var opt = sel.options[sel.selectedIndex];
  if (!opt || !opt.value) return;
  var valor = opt.getAttribute('data-valor');
  if (valor && Number(valor) > 0) {
    var el = document.getElementById('rec-valor');
    if (el) el.value = brl(Number(valor));
  }
}

function _syncGastoForm() {
  if (!state.modal) return;
  var map = {'g-desc':'descricao','g-valor':'valor','g-cat':'categoria',
    'g-etapa':'etapaId','g-forn':'fornecedor','g-nf':'notaFiscal',
    'g-data':'data','g-venc':'dataVencimento','g-obs':'observacao'};
  Object.keys(map).forEach(function(id) {
    var el = document.getElementById(id);
    if (el) state.modal[map[id]] = el.value;
  });
}

function _confirmar(msg, onSim, onNao) {
  state.modalConfirm = { msg, onSim, onNao: onNao||null };
  render();
}
function _confirmarSim() {
  const cb = state.modalConfirm && state.modalConfirm.onSim;
  state.modalConfirm = null;
  render();
  if (cb) cb();
}
function _confirmarNao() {
  const cb = state.modalConfirm && state.modalConfirm.onNao;
  state.modalConfirm = null;
  render();
  if (cb) cb();
}
function _renderConfirmModal() {
  if (!state.modalConfirm) return '';
  return '<div class="modal-bg" onclick="_confirmarNao()" style="z-index:300;">' +
    '<div class="modal" onclick="event.stopPropagation()" style="max-width:340px;text-align:center;">' +
      '<div style="font-size:32px;margin-bottom:12px;">⚠️</div>' +
      '<div style="font-weight:600;margin-bottom:20px;line-height:1.5;">' + esc(state.modalConfirm.msg) + '</div>' +
      '<div style="display:flex;gap:10px;justify-content:center;">' +
        '<button class="btn btn-ghost" onclick="_confirmarNao()">Cancelar</button>' +
        '<button class="btn btn-primary" onclick="_confirmarSim()">Confirmar</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}


function reconciliarDados() {
  /* Corrige inconsistências de dados legados */
  state.obras.forEach(function(o) {
    /* 1. CRs com valor=0 vinculadas a medições — corrigir valor */
    (o.contasReceber||[]).forEach(function(cr) {
      if (cr.medicaoId && Number(cr.valor||0) === 0) {
        var med = (o.medicoes||[]).find(function(m){return m.id===cr.medicaoId;});
        if (med) {
          var v = (med.itens||[]).reduce(function(s,it){return s+(Number(it.valorLiberado)||0);},0)
                + (med.itensAvulsos||[]).reduce(function(s,it){
                    var vv = parseMoeda(it.valor||'0');
                    return it.tipo==='deducao' ? s-vv : s+vv;
                  },0);
          if (v > 0) { cr.valor = v; }
        }
      }
    });
    /* 2. CRs marcadas recebido mas sem recebimento → resetar para pendente */
    (o.contasReceber||[]).forEach(function(cr) {
      if (cr.status === 'recebido') {
        var temRec = (o.recebimentos||[]).some(function(r){return r.origemId === cr.id;});
        if (!temRec) {
          cr.status = 'pendente';
          cr.dataRecebimento = '';
        }
      }
    });
    /* 3. Gastos pendentes mas CP paga → sincronizar */
    (o.gastos||[]).forEach(function(g) {
      if (g.statusPagamento === 'pendente') {
        var cp = (o.contasPagar||[]).find(function(cp){return cp.origemId === g.id && cp.status === 'pago';});
        if (cp) g.statusPagamento = 'pago';
      }
    });
  });
}


carregar();
aplicarTema(state.tema);
carregarSessao();
render();

document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') salvarSessao(); });
window.addEventListener('pagehide', salvarSessao);
